name: Validate, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pull requests: data must validate and the committed index.html must be current.
      - name: Validate data and check index.html is current
        if: github.event_name == 'pull_request'
        run: python scripts/build.py --check

      # Main branch: validate and rebuild, so an edit to the JSON alone still deploys.
      - name: Validate data and build
        if: github.event_name != 'pull_request'
        run: python scripts/build.py

      - name: Assemble site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/data
          cp -R index.html de assets sitemap.xml robots.txt _site/
          cp data/assessment.json _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
