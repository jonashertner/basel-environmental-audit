/* Stack bars */
.stack { display: flex; height: 56px; }
.stack > div { display: flex; align-items: center; padding-inline: 10px; font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); color: var(--on-strong); overflow: hidden; white-space: nowrap; min-width: 0; }
.stack .bg-g2, .stack .bg-g3 { color: var(--ink); }
.legend { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: var(--fs-s); }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend i { width: 14px; height: 14px; display: inline-block; flex: none; }
.legend b { font-stretch: 85%; }

/* Columns */
.cols { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: clamp(10px, 3vw, 36px); height: 260px; align-items: end; padding-bottom: 0; border-bottom: 2px solid var(--ink); }
.col { position: relative; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.col .v { font-weight: 800; font-stretch: 72%; font-size: var(--fs-2xl); line-height: 1; margin-bottom: 6px; }
.col .b { width: 100%; }
.col-labels { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: clamp(10px, 3vw, 36px); margin-top: 8px; font-size: var(--fs-s); color: var(--ink-2); }
.refline { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--ink); pointer-events: none; }
.refline span { position: absolute; right: 0; top: -1.6em; font-size: var(--fs-xs); background: var(--paper); padding-left: 6px; font-weight: 600; }

/* Dots */
.dotrow { display: grid; grid-template-columns: minmax(160px, 30%) 1fr; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.dotrow .lbl { font-size: var(--fs-s); }
.dotrow .lbl b { display: block; font-size: var(--fs-l); font-stretch: 75%; font-weight: 800; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
@media (max-width: 640px) { .dotrow { grid-template-columns: 1fr; gap: 8px; } }

/* Pathway */
.series svg { display: block; width: 100%; height: auto; overflow: visible; }
.series text { font-family: var(--font); fill: var(--ink-2); font-size: 12px; }
.series .axis { stroke: var(--rule); stroke-width: 1; }
.series .base { stroke: var(--ink); stroke-width: 2; }
.series .line { stroke: var(--ink); stroke-width: 3; fill: none; }
.series .dot { fill: var(--ink); }
.series .line.ln-bad { stroke: var(--fuchsine); } .series .dot.ln-bad { fill: var(--fuchsine); }
.series .line.ln-good { stroke: var(--rhine); } .series .dot.ln-good { fill: var(--rhine); }
.series .line.ln-mid { stroke: var(--sulfur); } .series .dot.ln-mid { fill: var(--sulfur); }
.series .line.ln-g2 { stroke: var(--g2); } .series .dot.ln-g2 { fill: var(--g2); }
.lnkey { display: inline-block; width: 18px; height: 4px; vertical-align: middle; background: var(--ink); }
.lnkey.ln-bad { background: var(--fuchsine); } .lnkey.ln-good { background: var(--rhine); } .lnkey.ln-mid { background: var(--sulfur); } .lnkey.ln-g2 { background: var(--g2); }
.series .val { fill: var(--ink); font-weight: 700; }
.series .ref { stroke: var(--fuchsine); stroke-width: 2; stroke-dasharray: 6 4; }
.series .ref-pt { fill: var(--paper); stroke: var(--fuchsine); stroke-width: 2.5; }
.series .ref-path { fill: none; stroke: var(--fuchsine); stroke-width: 1.5; stroke-dasharray: 4 5; opacity: 0.8; }
.series .ref-t { fill: var(--fuchsine); font-weight: 700; }
.refkey, .refkey-pt { display: inline-block; width: 18px; height: 0; border-top: 2px dashed var(--fuchsine); vertical-align: middle; }
.refkey-pt { width: 12px; height: 12px; border: 2.5px solid var(--fuchsine); border-radius: 50%; }
.pace { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px var(--gap); margin-top: 20px; }
.pace div { border-top: 2px solid var(--ink); padding-top: 8px; }
.pace b { display: block; font-size: var(--fs-2xl); font-weight: 800; font-stretch: 72%; line-height: 1.05; }
.pace span { font-size: var(--fs-s); color: var(--ink-2); }
.pace .hot b { color: var(--fuchsine); }

/* Site sheets */
.sheets { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--gap); }
.sheet { border-top: 8px solid var(--fuchsine); background: var(--field); }
.sheet header { padding: 16px 18px 12px; }
.sheet h4 { margin: 0; font-size: var(--fs-xl); font-stretch: 75%; font-weight: 800; }
.sheet header p { font-size: var(--fs-s); color: var(--ink-2); margin-top: 2px; }
.sheet dl { margin: 0; }
.sheet dl div { display: grid; grid-template-columns: 8.5rem 1fr; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--rule); font-size: var(--fs-s); }
.sheet dt { font-weight: 700; }
.sheet dd { margin: 0; }
@media (max-width: 420px) { .sheet dl div { grid-template-columns: 1fr; gap: 2px; } }

/* Log scale */
.logaxis { position: relative; height: 18px; font-size: var(--fs-xs); color: var(--ink-2); }
.logaxis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.logaxis span:first-child { transform: none; }
.logaxis span:last-child { transform: translateX(-100%); }
.track .lim { position: absolute; top: -7px; bottom: -7px; border-left: 3px solid var(--ink); }
.legend i.limkey { width: 3px; height: 18px; background: var(--ink); }

/* Progress */
.progress { position: relative; height: 56px; background: var(--field); display: flex; }
.progress .done { background: var(--ink); color: var(--paper); display: flex; align-items: center; padding-left: 12px; font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); }
.overdue { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; }
.overdue b { font-size: var(--fs-2xl); font-weight: 800; font-stretch: 72%; color: var(--fuchsine); line-height: 1; }

/* Truth + upgrades */
.truth { margin-top: clamp(64px, 8vw, 104px); padding-top: 18px; border-top: 8px solid var(--fuchsine); }
.truth h3 { font-size: var(--fs-xs); color: var(--fuchsine); font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
.truth .lead { margin-top: 14px; font-size: clamp(1.375rem, 2.3vw, 1.75rem); font-weight: 700; font-stretch: 90%; line-height: 1.25; max-width: 34ch; text-wrap: balance; }
.truth .rest { margin-top: 14px; font-size: var(--fs-m); line-height: 1.6; color: var(--ink-2); max-width: 66ch; }
.upgrades { margin-top: clamp(48px, 6vw, 64px); }
.upgrades h3 { font-size: var(--fs-l); font-stretch: 90%; }
.upgrades ul { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 14px; max-width: 66ch; }
.upgrades li { padding-left: 22px; position: relative; }
.upgrades li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 12px; height: 4px; background: var(--rhine); }
.upgrades .note { margin-top: 12px; }

/* Generic sections */
.block { border-top: 3px solid var(--ink); padding-block: clamp(48px, 7vw, 96px); }
.block-head { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-bottom: 32px; }
.block-head h2 { grid-column: span 5; font-size: clamp(2rem, 4vw, 3.25rem); font-weight: 800; font-stretch: 72%; line-height: 1; }
.block-head p { grid-column: 7 / span 6; font-size: var(--fs-l); color: var(--ink-2); line-height: 1.45; }
@media (max-width: 900px) { .block-head h2, .block-head p { grid-column: span 12; } }

/* Votes */
.votes .row { grid-template-columns: minmax(200px, 38%) 1fr 5.5rem; }
.votes .lbl small { display: block; color: var(--ink-2); font-size: var(--fs-xs); }
.votes .kind { display: inline-block; font-size: var(--fs-xs); font-weight: 700; margin-right: 6px; }
.votes .track { height: 28px; background: transparent; border: 2px solid var(--ink); }
.votes .bar.pass { background: var(--ink); }
.votes .bar.fail { background: repeating-linear-gradient(135deg, var(--g2) 0 4px, transparent 4px 8px); }
.votes .half { position: absolute; left: 50%; top: -8px; bottom: -8px; border-left: 2px solid var(--fuchsine); }
@media (max-width: 640px) { .votes .row { grid-template-columns: 1fr 4.5rem; } }

/* Timeline */
.tl { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.tl h3 { font-size: var(--fs-l); font-stretch: 85%; margin-bottom: 8px; }
.tl ol { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); }
.tl time { font-weight: 800; font-stretch: 78%; }
.tl .when { font-size: var(--fs-xs); color: var(--fuchsine); font-weight: 700; display: block; }
.tl .ahead li:first-child { border-top: 3px solid var(--fuchsine); }
@media (max-width: 800px) { .tl { grid-template-columns: 1fr; } }

/* Legal */
.legal { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px var(--gap); }
.legal article { border-top: 2px solid var(--ink); padding-top: 12px; }
.legal h3 { font-size: var(--fs-l); font-stretch: 88%; }
.legal .law { font-size: var(--fs-s); color: var(--ink-2); margin-top: 6px; font-style: italic; }
.legal p.body { margin-top: 10px; }
.legal p.work { margin-top: 10px; font-size: var(--fs-s); }
.legal p.work b { font-weight: 700; }

/* ---------- What works: proven measures against Basel ---------- */
.st-lead { --c: var(--rhine); --c-text: var(--rhine); }
.st-partial { --c: var(--sulfur); --c-text: var(--sulfur-ink); }
.st-behind { --c: var(--fuchsine); --c-text: var(--fuchsine); }
.st-missing { --c: var(--fuchsine); --c-text: var(--fuchsine); }
.st-mark { display: inline-block; width: 12px; height: 12px; flex: none; background: var(--c); border: 2px solid var(--c); vertical-align: -1px; }
.st-missing .st-mark, .st-mark.st-missing { background: repeating-linear-gradient(135deg, var(--c) 0 2px, transparent 2px 5px); }
.st-label { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c-text); }
.traj { margin: 0; }
.traj-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); position: relative; }
.traj-col { border-top: 3px solid var(--ink); padding-top: 14px; display: flex; flex-direction: column; min-width: 0; }
.traj-col:nth-child(1) { border-top-color: var(--g2); } .traj-col:nth-child(2) { border-top-color: var(--g1); }
.traj-col .step { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); }
.traj-col h3 { font-size: var(--fs-xl); font-stretch: 78%; font-weight: 800; margin-top: 4px; }
.traj-col > p { font-size: var(--fs-s); color: var(--ink-2); margin-top: 8px; line-height: 1.45; min-height: 4.4em; }
.traj-col ul { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
.traj-col a { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--field); text-decoration: none; font-size: var(--fs-s); font-weight: 600; line-height: 1.3; border-left: 4px solid var(--c); }
.traj-col a:hover { background: var(--ink); color: var(--paper); }
.traj-col a .st-mark { margin-top: 2px; }
.traj-arrow { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); }
.traj-arrow::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, var(--g3), var(--ink)); }
.traj-arrow span:last-child { order: 2; color: var(--ink); }
.traj-arrow::after { order: 1; }
.st-legend { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: var(--fs-s); }
.st-legend li { display: flex; align-items: center; gap: 8px; }
.st-legend b { font-stretch: 80%; font-weight: 800; }
@media (max-width: 900px) { .traj-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 40px; } .traj-col > p { min-height: 0; } }
@media (max-width: 560px) { .traj-grid { grid-template-columns: 1fr; } }

/* Open obligations */
.oblig { list-style: none; margin: 0; padding: 0; }
.oblig > li { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: 8px var(--gap); padding: 18px 0; border-top: 1px solid var(--rule); }
.oblig > li:first-child { border-top: 2px solid var(--ink); }
.ob-open { --c: var(--fuchsine); --c-text: var(--fuchsine); }
.ob-risk { --c: var(--sulfur); --c-text: var(--sulfur-ink); }
.ob-late { --c: var(--ink-3); --c-text: var(--ink-2); }
.ob-late .st-mark { background: transparent; }
.ob-side .st-label { display: flex; gap: 8px; align-items: center; font-size: var(--fs-s); font-weight: 700; color: var(--c-text); }
.ob-side time { display: block; margin-top: 8px; font-weight: 800; font-stretch: 78%; }
.ob-side .when { display: block; font-size: var(--fs-xs); font-weight: 700; color: var(--c-text); }
.ob-main h3 { font-size: var(--fs-l); font-stretch: 88%; }
.ob-main .law { font-size: var(--fs-s); color: var(--ink-2); margin-top: 4px; font-style: italic; }
.ob-main .body { margin-top: 8px; max-width: 68ch; }
.ob-legend { display: flex; flex-wrap: wrap; gap: 8px 24px; list-style: none; margin: 0 0 18px; padding: 0; font-size: var(--fs-s); }
.ob-legend li { display: flex; gap: 8px; align-items: center; color: var(--c-text); font-weight: 700; }
.ob-legend b { font-stretch: 80%; font-weight: 800; }
@media (max-width: 700px) { .oblig > li { grid-template-columns: 1fr; } .ob-side { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; } .ob-side time { margin-top: 0; } }

.m-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: clamp(64px, 8vw, 104px) 0 8px; }
.m-tools h3 { font-size: var(--fs-l); font-stretch: 90%; margin-right: auto; }
.m-tools button { border: 2px solid var(--ink); background: none; padding: 5px 10px; font-size: var(--fs-xs); font-weight: 700; cursor: pointer; }
.m-tools button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.mlist { list-style: none; margin: 0; padding: 0; }
.mitem { border-top: 2px solid var(--ink); padding: 22px 0 30px; scroll-margin-top: calc(var(--header-h) + 16px); }
.mitem[hidden] { display: none; }
.mitem:target { background: linear-gradient(90deg, var(--field), transparent 70%); }
.mhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.mhead h4 { font-size: var(--fs-xl); font-stretch: 80%; font-weight: 800; margin: 0; line-height: 1.1; flex: 1 1 18rem; }
.mhead .meta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.mhead .stage { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.mcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px var(--gap); margin-top: 16px; }
.mcols h5 { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
.mcols p { font-size: var(--fs-s); line-height: 1.5; }
.mcols .src { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.mcols .src .cite:first-child { margin-left: 0; }
.mcols .basel { border-left: 4px solid var(--c); padding-left: 14px; }
.benefits { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.benefits li { font-size: var(--fs-xs); padding: 2px 8px; border: 1px solid var(--rule); color: var(--ink-2); }
@media (max-width: 900px) { .mcols { grid-template-columns: 1fr; } }

/* Method */
.rubric { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); margin: 0; }
.rubric div { border-top: 8px solid var(--c); padding-top: 8px; }
.rubric dt { font-size: var(--fs-2xl); font-weight: 900; font-stretch: 62%; line-height: 1; color: var(--c-text); }
.rubric dd { margin: 6px 0 0; font-size: var(--fs-s); }
.rubric .t-good { --c: var(--rhine); --c-text: var(--rhine); }
.rubric .t-mid { --c: var(--sulfur); --c-text: var(--sulfur-ink); }
.rubric .t-bad { --c: var(--fuchsine); --c-text: var(--fuchsine); }
.method-notes { margin: 32px 0 0; padding-left: 1.1em; max-width: 72ch; display: grid; gap: 8px; }
.basis-key { margin: 40px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px var(--gap); }
.basis-key div { border-top: 1px solid var(--rule); padding-top: 12px; }
.basis-key dt .basis { color: var(--ink); cursor: default; }
.basis-key dd { margin: 8px 0 0; font-size: var(--fs-s); color: var(--ink-2); }
@media (max-width: 800px) { .rubric { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Sources */
.src-tools { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 20px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 2px solid var(--ink); background: none; padding: 6px 10px; font-size: var(--fs-s); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.src-search { border: 2px solid var(--ink); background: var(--paper); padding: 7px 10px; font: inherit; font-size: var(--fs-s); min-width: min(100%, 280px); color: var(--ink); }
.src-status { font-size: var(--fs-s); color: var(--ink-2); }
.srclist { list-style: none; margin: 0; padding: 0; }
.srclist li { display: grid; grid-template-columns: 3rem 1fr auto; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); }
.srclist li:target { background: var(--field); }
.srclist .n { font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); line-height: 1.2; }
.srclist .t a { font-weight: 600; }
.srclist .m { font-size: var(--fs-s); color: var(--ink-2); margin-top: 2px; }
.srclist .used { font-size: var(--fs-xs); color: var(--ink-3); margin-top: 4px; }
.type { font-size: var(--fs-xs); font-weight: 700; padding: 2px 8px; border: 1px solid var(--ink); white-space: nowrap; align-self: start; }
.type.official { background: var(--ink); color: var(--paper); }
.type.advocacy { border-color: var(--fuchsine); color: var(--fuchsine); }
@media (max-width: 560px) { .srclist li { grid-template-columns: 2.25rem 1fr; } .srclist .type { grid-column: 2; justify-self: start; } }

/* Popover */
.pop {
  position: absolute; z-index: 60; width: min(380px, calc(100vw - 24px)); background: var(--paper);
  border: 2px solid var(--ink); padding: 16px 18px 18px; box-shadow: 8px 8px 0 var(--ink);
}
.pop[hidden] { display: none; }
.pop .top { display: flex; align-items: center; gap: 12px; }
.pop .top .close { margin-left: auto; }
.pop .n { font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); }
.pop h4 { margin: 10px 0 4px; font-size: var(--fs-m); line-height: 1.3; }
.pop p { font-size: var(--fs-s); color: var(--ink-2); }
.pop .links { display: flex; gap: 16px; margin-top: 12px; font-size: var(--fs-s); font-weight: 600; }
.pop .close { border: none; background: none; font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 0 4px; }
@media (max-width: 640px) {
  .pop { position: fixed; left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100%; box-shadow: 0 -4px 0 var(--ink); border-width: 2px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
}

/* Footer */
.site-foot { border-top: 3px solid var(--ink); padding-block: 32px 48px; font-size: var(--fs-s); color: var(--ink-2); }
.site-foot .wrap { display: grid; gap: 8px; }

/* Kicker, method footer, changelog */
.kicker { font-size: var(--fs-s); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 18px; display: flex; gap: 10px; align-items: center; }
.kicker::before { content: ""; flex: none; width: 28px; height: 10px; background: linear-gradient(90deg, var(--ink) 0 22%, var(--fuchsine) 22%); }
.method-foot { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px var(--gap); margin-top: 48px; }
.method-foot h3 { font-size: var(--fs-l); font-stretch: 88%; margin-bottom: 10px; }
.changelog { list-style: none; margin: 0; padding: 0; font-size: var(--fs-s); }
.changelog li { display: grid; grid-template-columns: 9rem 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--rule); }
.changelog time { font-weight: 700; }
.cite-text { font-size: var(--fs-s); background: var(--field); padding: 14px 16px; overflow-wrap: anywhere; user-select: all; }
@media (max-width: 480px) { .changelog li { grid-template-columns: 1fr; gap: 2px; } }
.noscript { padding-block: 40px; max-width: 72ch; }
.noscript h1 { font-size: var(--fs-2xl); margin-bottom: 16px; }
.noscript ul { padding-left: 1.2em; }

/* Print */
@media print {
  :root { --paper: #fff; }
  .site-head, .actions, .theme-btn, .src-tools, .m-tools button, .pop, .skip { display: none !important; }
  .mitem[hidden] { display: block !important; }
  .area-head { position: static; }
  .area, .block { break-inside: auto; padding-block: 24px; }
  .chart, .sheet, .fig, .legal article, .mitem, .traj-col, .oblig > li { break-inside: avoid; }

<main id="main">
  <noscript><div class="wrap noscript"><h1>Im Sommer 2026 hatte Basel 52 Tage mit 30 °C oder mehr: mehr als den halben Sommer.</h1><p>Jede Zahl stammt von einer amtlichen Stelle: gemessen, gezählt oder von einer Behörde berechnet, oder von dieser Bilanz aus amtlichen Zahlen abgeleitet. Ein Vermerk nennt jeweils die Grundlage, neben Jahr und Quelle. Schätzungen, Prognosen und von anderswo übertragene Durchschnittswerte sind weggelassen. Grenz- und Zielwerte erscheinen nur als Referenzwerte.</p><p><b>Gesamtnote: C.</b> Gute Steuerung auf dem Papier. Die amtlichen Daten zeigen 6 % weniger Emissionen von 2020 bis 2022, einen laufenden Wärmewandel, Rekordhitze, Luft, die die meisten, aber nicht alle Schweizer Grenzwerte einhält, und eine Chemie-Belastung, die noch im Boden liegt.</p><h2>Noten nach Bereich</h2><ul><li><b>C</b> Klimaschutz: Die Emissionen sanken von 2020 bis 2022 um 6 %, nach Berechnung des Kantons. Sein Pfad zu Netto-Null 2037 verlangt bis 2027 eine weitere Senkung um ein Viertel. Die Wärmeversorgung wandelt sich, und das lässt sich zählen.</li><li><b>D</b> Hitze und Anpassung: 2026 brachte in Basel so viele Hitzetage wie nie seit Messbeginn. Die Baumkronenfläche der Stadt ist seit 2012 nicht gewachsen.</li><li><b>D</b> Chemie-Altlasten in Boden und Grundwasser: In den beiden Basel sind 1’718 belastete Standorte registriert. Im Klybeck, wo ein neues Quartier geplant ist, misst der Kanton im Grundwasser weiterhin das krebserregende Benzidin.</li><li><b>C+</b> Luftqualität: 2025 hielt Stickstoffdioxid an beiden Basler Stationen den Schweizer Jahresgrenzwert ein. Feinstaub an der Feldbergstrasse nicht, und Ozon überschritt seinen Stundengrenzwert während Hunderten von Stunden.</li><li><b>C+</b> Trinkwasser und Flüsse: Das Leitungswasser liegt mehr als hundertfach unter den PFAS-Höchstwerten. Grundwasser und Fische stehen schlechter da.</li><li><b>D+</b> Lärm und Verkehr: Jede fünfte Person lebt nachts mit Strassenlärm über dem Grenzwert, acht Jahre nach Ablauf der Bundesfrist für die Sanierung.</li></ul><p>Diese Seite zeichnet ihre Grafiken mit JavaScript. Die vollständigen Daten stehen in <a href="../data/assessment.json">assessment.json</a>.</p></div></noscript>

</main>

<script id="assessment-data" type="application/json">{"meta":{"title":{"en":"Basel-Stadt environmental audit","de":"Umweltbilanz Basel-Stadt"},"edition":"2026","reviewed":"2026-09-29","reviewIntervalDays":90,"author":{"en":"Jonas Hertner","de":"Jonas Hertner"},"siteUrl":"https://jonashertner.github.io/basel-environmental-audit/","repoUrl":"https://github.com/jonashertner/basel-environmental-audit","kicker":{"en":"Independent audit of official data","de":"Unabhängige Auswertung amtlicher Daten"},"thesis":{"en":"In the summer of 2026, Basel had 52 days of 30 °C or more: more than half the summer.","de":"Im Sommer 2026 hatte Basel 52 Tage mit 30 °C oder mehr: mehr als den halben Sommer."},"standfirst":{"en":"Every figure here comes from an official body: measured, counted or calculated by an authority, or derived by this audit from official figures. A label on each says which, next to its year and source. Estimates, projections and averages carried over from elsewhere are left out. Legal limits and targets appear only as reference values.","de":"Jede Zahl stammt von einer amtlichen Stelle: gemessen, gezählt oder von einer Behörde berechnet, oder von dieser Bilanz aus amtlichen Zahlen abgeleitet. Ein Vermerk nennt jeweils die Grundlage, neben Jahr und Quelle. Schätzungen, Prognosen und von anderswo übertragene Durchschnittswerte sind weggelassen. Grenz- und Zielwerte erscheinen nur als Referenzwerte."},"description":{"en":"A graded assessment of the environment in Basel-Stadt built only on values measured or counted by official bodies: climate, heat, chemical legacy, air, water, noise and traffic. Every figure links to its source.","de":"Eine benotete Bilanz der Umwelt in Basel-Stadt, gestützt nur auf Werte, die amtliche Stellen gemessen oder gezählt haben: Klima, Hitze, Chemie-Altlasten, Luft, Wasser, Lärm und Verkehr. Jede Zahl verweist auf ihre Quelle."},"scope":{"en":"Canton of Basel-Stadt (Basel, Riehen, Bettingen). Some sources cover both Basel cantons; where a site lies in Basel-Landschaft but affects Basel-Stadt, that is stated.","de":"Kanton Basel-Stadt (Basel, Riehen, Bettingen). Einige Quellen betreffen beide Basel; wo ein Standort in Basel-Landschaft liegt, aber Basel-Stadt betrifft, ist das vermerkt."},"disclaimer":{"en":"Analysis of public sources. Grades are an analytical judgment, not an official rating. Not legal advice.","de":"Auswertung öffentlicher Quellen. Die Noten sind eine analytische Einschätzung, keine amtliche Bewertung. Keine Rechtsberatung."}},"hero":{"total":92,"unit":{"en":"days","de":"Tage"},"segments":[{"value":52,"label":{"en":"hot days (30 °C or more), June to August 2026","de":"Hitzetage (30 °C und mehr), Juni bis August 2026"},"sources":["nbcn-binningen"]},{"value":40,"label":{"en":"days below 30 °C","de":"Tage unter 30 °C"},"sources":["nbcn-binningen"]}],"marker":{"value":14.3,"digits":1,"label":{"en":"hot days in a whole normal year (1991–2020)","de":"Hitzetage in einem ganzen Normaljahr (1991–2020)"},"sources":["meteoswiss-normwerte"]},"aria":{"en":"Of the 92 days from June to August 2026, 52 reached 30 °C or more at Basel-Binningen. A whole normal year has 14.3.","de":"Von den 92 Tagen von Juni bis August 2026 erreichten in Basel-Binningen 52 Tage 30 °C oder mehr. Ein ganzes Normaljahr hat 14,3."},"note":{"en":"Days with a maximum of 30 °C or more at the MeteoSwiss station Basel-Binningen, summed from MeteoSwiss's monthly counts. The normal is MeteoSwiss's mean for 1991–2020.","de":"Tage mit einem Höchstwert von 30 °C oder mehr an der MeteoSchweiz-Station Basel-Binningen, summiert aus den Monatszählungen von MeteoSchweiz. Der Normwert ist das Mittel von MeteoSchweiz für 1991–2020."},"basis":["derived","measured"]},"overall":{"grade":"C","summary":{"en":"Good governance on paper. The official data show emissions down 6% from 2020 to 2022, a heating transition under way, record heat, air that meets most but not all Swiss limits, and chemical contamination that is still in the ground.","de":"Gute Steuerung auf dem Papier. Die amtlichen Daten zeigen 6 % weniger Emissionen von 2020 bis 2022, einen laufenden Wärmewandel, Rekordhitze, Luft, die die meisten, aber nicht alle Schweizer Grenzwerte einhält, und eine Chemie-Belastung, die noch im Boden liegt."},"facets":[{"label":{"en":"Governance","de":"Steuerung"},"grade":"B+","note":{"en":"Constitutional target, a dedicated climate office and a public progress portal. The portal's latest emissions data are for 2022.","de":"Ziel in der Verfassung, eine eigene Klimafachstelle und ein öffentliches Fortschrittsportal. Dessen neuste Emissionsdaten betreffen 2022."},"sources":["kv-bs","bs-mm-klimaportal","bs-klimaschutz"]},{"label":{"en":"Outcomes","de":"Ergebnisse"},"grade":"C–","note":{"en":"Emissions fell 6% from 2020 to 2022, and the canton's path requires a further quarter by 2027. Fossil boilers are being replaced. Fine particles at Feldbergstrasse remain above the Swiss limit, the canton's heat monitoring finds no measurable reduction in exposure, and road-noise remediation is years past its deadline.","de":"Die Emissionen sanken von 2020 bis 2022 um 6 %, und der Pfad des Kantons verlangt bis 2027 ein weiteres Viertel. Fossile Heizkessel werden ersetzt. Der Feinstaub an der Feldbergstrasse liegt weiter über dem Schweizer Grenzwert, das kantonale Hitze-Controlling stellt keine messbare Entlastung fest, und die Strassenlärmsanierung ist seit Jahren überfällig."},"sources":["bs-klimaportal","aue-heizungen","luft-2025","bs-controlling-2026","rr-laerm-2018"]},{"label":{"en":"Legacy liabilities","de":"Altlasten"},"grade":"D","note":{"en":"Carcinogenic benzidine in the groundwater under Klybeck, PFAS in groundwater and fish, and remediation of the largest landfill only begun in December 2025.","de":"Krebserregendes Benzidin im Grundwasser unter dem Klybeck, PFAS in Grundwasser und Fischen, und die Sanierung der grössten Deponie erst im Dezember 2025 begonnen."},"sources":["aue-benzidin-2024","aue-pfas-gw-2024","pfas-fische-2024","bl-feldreben"]}]},"domains":[{"id":"climate","name":{"en":"Climate mitigation","de":"Klimaschutz"},"short":{"en":"Climate","de":"Klima"},"grade":"C","verdict":{"en":"Emissions fell 6% from 2020 to 2022, by the canton's own calculation. Its path to net zero in 2037 needs a further cut of a quarter by 2027. Heating is changing, and the change can be counted.","de":"Die Emissionen sanken von 2020 bis 2022 um 6 %, nach Berechnung des Kantons. Sein Pfad zu Netto-Null 2037 verlangt bis 2027 eine weitere Senkung um ein Viertel. Die Wärmeversorgung wandelt sich, und das lässt sich zählen."},"metrics":[{"value":"637 kt","label":{"en":"Greenhouse gas emissions of Basel-Stadt in 2022, in CO2 equivalents","de":"Treibhausgasemissionen von Basel-Stadt 2022, in CO2-Äquivalenten"},"context":{"en":"2020: 674 kt. Target path for 2027: 479 kt.","de":"2020: 674 kt. Absenkpfad für 2027: 479 kt."},"basis":"official","sources":["bs-klimaportal","bs-klimaschutz"]},{"value":{"en":"3.1 t","de":"3,1 t"},"label":{"en":"Greenhouse gas emissions per resident in 2022","de":"Treibhausgasemissionen pro Kopf 2022"},"context":{"en":"2.9 t of it from energy use","de":"Davon 2,9 t aus dem Energieverbrauch"},"basis":"official","sources":["bs-klimaschutz"]},{"value":{"en":"7,987","de":"7’987"},"label":{"en":"Gas boilers registered in September 2026","de":"Registrierte Gasheizkessel im September 2026"},"context":{"en":"December 2018: 10,557","de":"Dezember 2018: 10’557"},"basis":"counted","sources":["aue-heizungen"]},{"value":{"en":"2,407","de":"2’407"},"label":{"en":"Heat pumps registered in September 2026","de":"Registrierte Wärmepumpen im September 2026"},"context":{"en":"December 2018: 278","de":"Dezember 2018: 278"},"basis":"counted","sources":["aue-heizungen"]}],"charts":["emissions","heating","waste-origin"],"truth":{"text":{"en":"The target path depends on the incinerator. Waste disposal was the largest source of emissions in 2020, 176 of 674 kt, and the canton's own path keeps it at about 180 kt until 2036. Most of the waste burned in Basel comes from other cantons and from Germany, and capturing its CO2 would need storage that Swiss law does not yet provide for. The inventory is also slow: its latest year is 2022. What can be counted every month points the right way: fewer gas and oil boilers, more heat pumps and district-heating connections.","de":"Der Absenkpfad hängt an der KVA. Die Entsorgung war 2020 mit 176 von 674 kt die grösste Emissionsquelle, und im eigenen Pfad des Kantons bleibt sie bis 2036 bei rund 180 kt. Der grösste Teil des in Basel verbrannten Abfalls stammt aus anderen Kantonen und aus Deutschland, und die Abscheidung seines CO2 bräuchte eine Speicherung, die das Schweizer Recht noch nicht vorsieht. Zudem ist das Inventar langsam: Sein neustes Jahr ist 2022. Was sich jeden Monat zählen lässt, zeigt in die richtige Richtung: weniger Gas- und Ölheizungen, mehr Wärmepumpen und Fernwärmeanschlüsse."},"sources":["bs-klimaportal","iwb-kva-2025","rr-ccs-2025","aue-heizungen"]},"upgrades":[{"text":{"en":"Negotiate intercantonal and cross-border cost sharing for incinerator carbon capture now. In 2025, 52,986 of the 227,078 tonnes of waste delivered came from Basel-Stadt.","de":"Die Kostenteilung für die CO2-Abscheidung an der KVA jetzt interkantonal und grenzüberschreitend verhandeln. 2025 stammten 52’986 der 227’078 angelieferten Tonnen Abfall aus Basel-Stadt."},"sources":["iwb-kva-2025","rr-ccs-2025"]},{"text":{"en":"Implement the Grand Council's 2024 motion to reform the vehicle tax, which already weighs weight and CO2, towards fuel and space consumption.","de":"Die Motion des Grossen Rates von 2024 umsetzen, welche die bereits nach Gewicht und CO2 bemessene Motorfahrzeugsteuer stärker auf Treibstoff- und Flächenverbrauch ausrichten will."},"sources":["bs-mfz-steuer"]},{"text":{"en":"Publish the emissions inventory every year, with its method and the share of modelled values, and publish the heating register as open data.","de":"Das Emissionsinventar jährlich veröffentlichen, mit Methode und Anteil modellierter Werte, und das Heizungsregister als offene Daten publizieren."},"sources":["statistik-energie-2024","aue-heizungen"]},{"text":{"en":"Position the Rhine ports as Switzerland's CO2 export hub. The government already describes the region as pivotal for moving CO2 by rail and ship.","de":"Die Rheinhäfen als Schweizer Drehscheibe für den CO2-Export positionieren. Die Regierung bezeichnet die Region bereits als zentral für den CO2-Transport per Bahn und Schiff."},"sources":["rr-ccs-2025"]}]},{"id":"heat","name":{"en":"Heat and adaptation","de":"Hitze und Anpassung"},"short":{"en":"Heat","de":"Hitze"},"grade":"D","verdict":{"en":"2026 brought the most hot days ever measured in Basel. The city's tree canopy has not grown since 2012.","de":"2026 brachte in Basel so viele Hitzetage wie nie seit Messbeginn. Die Baumkronenfläche der Stadt ist seit 2012 nicht gewachsen."},"metrics":[{"value":{"en":"39.7 °C","de":"39,7 °C"},"label":{"en":"Highest temperature ever measured at Basel-Binningen, on 30 July 2026","de":"Höchste je in Basel-Binningen gemessene Temperatur, am 30. Juli 2026"},"context":{"en":"Record before 2026: 38.6 °C, 13 August 2003","de":"Rekord vor 2026: 38,6 °C, 13. August 2003"},"basis":"measured","sources":["meteoswiss-rekord-2026","meteoswiss-jja-2026"]},{"value":"12","label":{"en":"Tropical nights (20 °C or more) from June to August 2026, a record","de":"Tropennächte (20 °C und mehr) von Juni bis August 2026, ein Rekord"},"context":{"en":"Previous record: 9, in 2015","de":"Bisheriger Rekord: 9, im Jahr 2015"},"basis":"measured","sources":["meteoswiss-jja-2026"]},{"value":{"en":"17%","de":"17 %"},"label":{"en":"Tree canopy cover of the city of Basel in 2024","de":"Baumkronenbedeckung der Stadt Basel 2024"},"context":{"en":"Unchanged since 2012; 15% without forest","de":"Seit 2012 unverändert; 15 % ohne Wald"},"basis":"official","sources":["bs-controlling-2026"]},{"value":{"en":"4,477 m²","de":"4’477 m²"},"label":{"en":"Unsealing approved by permit in 2023 and 2024, not yet built","de":"2023 und 2024 bewilligte Entsiegelung, noch nicht gebaut"},"context":{"en":"Grand Council motion: 165,000 m² by 2037","de":"Motion des Grossen Rates: 165’000 m² bis 2037"},"basis":"counted","sources":["bs-controlling-2026"]},{"value":{"en":"17.5%","de":"17,5 %"},"label":{"en":"Share of city residents with 9 m² of accessible open space within 300 m, the canton's own target","de":"Anteil der Stadtbevölkerung mit 9 m² zugänglicher Freifläche innert 300 m, dem kantonalen Zielwert"},"context":{"en":"31,367 of 179,517 residents","de":"31’367 von 179’517 Personen"},"basis":"derived","sources":["bs-controlling-2026"]}],"charts":["hot-days","trees"],"truth":{"text":{"en":"The canton's own 2026 monitoring report finds no measurable reduction in the number of people exposed to heat, and tree canopy has not grown since 2012. More trees are planted than felled, but the margin is small: 478 against 378 in the city in 2025. New trees are planted mainly where streets are already being dug up for district heating or maintenance, for cost reasons. The one measure that would free real space, converting street area to greenery, was rejected at the ballot box in 2023. Measured against proven measures elsewhere, Basel leads on green roofs and canopy monitoring and lags on the rest: no binding canopy target, no green factor, and unsealing at about a fifth of the pace the Grand Council's motion requires.","de":"Der kantonale Controllingbericht 2026 stellt keine messbare Reduktion der von Hitze betroffenen Bevölkerung fest, und die Baumkronenfläche ist seit 2012 nicht gewachsen. Es werden mehr Bäume gepflanzt als gefällt, aber knapp: 478 gegenüber 378 in der Stadt im Jahr 2025. Neue Bäume werden aus Kostengründen vor allem dort gepflanzt, wo Strassen ohnehin für Fernwärme oder Unterhalt aufgerissen werden. Die eine Massnahme, die echten Raum schaffen würde, die Umwandlung von Strassenfläche in Grün, scheiterte 2023 an der Urne. Gemessen an bewährten Massnahmen anderswo führt Basel bei Gründächern und der Messung des Kronendachs und liegt beim Rest zurück: kein verbindliches Kronenziel, kein Grünfaktor, und Entsiegelung in etwa einem Fünftel des Tempos, das die Motion des Grossen Rates verlangt."},"sources":["bs-controlling-2026","stg-baeume-2025","rr-begruenung-2025","bs-abst-2023"]},"upgrades":[{"text":{"en":"Turn the canopy aim into a binding target with a path: 18% by 2040 is barely above today's 15%. Lausanne went from 20% to 24.3% in twelve years and aims for 30%.","de":"Das Kronenziel verbindlich machen, mit Absenkpfad: 18 % bis 2040 liegt kaum über den heutigen 15 %. Lausanne kam in zwölf Jahren von 20 % auf 24,3 % und will 30 %."},"sources":["bs-controlling-2026","lausanne-canopee-2025"]},{"text":{"en":"Write the unsealing target into law as Bern did, with a yearly minimum, and make unsealing the default whenever a district-heating trench is dug: at today's pace the 165,000 m² the Grand Council asks for by 2037 will not be reached.","de":"Das Entsiegelungsziel wie Bern mit jährlichem Minimum ins Recht schreiben und bei jedem Fernwärmegraben standardmässig entsiegeln: Beim heutigen Tempo werden die vom Grossen Rat bis 2037 verlangten 165’000 m² nicht erreicht."},"sources":["bern-kar-2024","bs-controlling-2026"]},{"text":{"en":"Add a green factor to the building law that also applies in zones 5 to 7, where the garden rule does not.","de":"Einen Grünfaktor ins Baugesetz aufnehmen, der auch in den Zonen 5 bis 7 gilt, wo die Gartenregel nicht greift."},"sources":["bpg-bs","ura-lush-2017"]},{"text":{"en":"Map cool rooms against walking distance, set a minimum standard and keep the heat hotline running into September and at weekends.","de":"Kühle Räume nach Gehdistanz kartieren, einen Mindeststandard festlegen und das Hitzetelefon bis in den September und an Wochenenden betreiben."},"sources":["gd-hitze","bcn-refugis-2026"]},{"text":{"en":"Adopt the «Grünes Basel» programme for greening private land, still before the Grand Council, and aim it at courtyards, where no ballot fight is needed.","de":"Das Förderprogramm «Grünes Basel» für Begrünung auf privatem Grund, das noch im Grossen Rat hängig ist, beschliessen und gezielt in Innenhöfen einsetzen, wo es keinen Abstimmungskampf braucht."},"sources":["bs-gruenes-basel-2025","bs-controlling-2026"]}]},{"id":"legacy","name":{"en":"Chemical legacy in soil and groundwater","de":"Chemie-Altlasten in Boden und Grundwasser"},"short":{"en":"Chemical legacy","de":"Chemie-Altlasten"},"grade":"D","verdict":{"en":"1,718 contaminated sites are registered in the two Basel cantons. At Klybeck, where a new district is planned, the canton still measures the carcinogen benzidine in the groundwater.","de":"In den beiden Basel sind 1’718 belastete Standorte registriert. Im Klybeck, wo ein neues Quartier geplant ist, misst der Kanton im Grundwasser weiterhin das krebserregende Benzidin."},"metrics":[{"value":{"en":"1,718","de":"1’718"},"label":{"en":"Contaminated sites registered in Basel-Stadt and Basel-Landschaft, 2025","de":"Registrierte belastete Standorte in Basel-Stadt und Basel-Landschaft, Stand 2025"},"basis":"counted","sources":["ub-altlasten-2026"]},{"value":"62","label":{"en":"Further sites classified as requiring remediation in 2025","de":"Weitere Standorte, 2025 als sanierungsbedürftig eingestuft"},"context":{"en":"Both cantons together","de":"Beide Kantone zusammen"},"basis":"counted","sources":["ub-altlasten-2026"]},{"value":{"en":"1.6 ng/l","de":"1,6 ng/l"},"label":{"en":"Benzidine in the groundwater at Klybeck well 725, May 2024","de":"Benzidin im Grundwasser der Klybeck-Messstelle 725, Mai 2024"},"context":{"en":"Site-specific concentration value: 1.5 ng/l","de":"Standortspezifischer Konzentrationswert: 1,5 ng/l"},"basis":"measured","sources":["aue-benzidin-2024","aue-benzidin"]},{"value":{"en":"17 years","de":"17 Jahre"},"label":{"en":"From classification as requiring remediation to the start of works, Feldreben landfill, Muttenz (BL)","de":"Von der Einstufung als sanierungsbedürftig bis zum Baubeginn, Deponie Feldreben, Muttenz (BL)"},"context":{"en":"Classified in 2008; works began in December 2025","de":"Eingestuft 2008; Arbeiten seit Dezember 2025"},"basis":"derived","sources":["bl-feldreben"]}],"charts":["legacy-sites"],"truth":{"text":{"en":"The canton classifies the Klybeck work areas as contaminated and requiring monitoring, and one site there as requiring remediation. A new district is planned on this ground. In May 2024 the canton measured benzidine at 1.6 ng/l in one Klybeck well, above the site-specific concentration value; the government says the contamination poses no danger in the present situation. At Feldreben, chlorinated hydrocarbons in the groundwater exceed the legal limits up to tenfold, and seventeen years passed between the classification and the start of works.","de":"Der Kanton führt die Klybeck-Werkareale als belastet und überwachungsbedürftig, einen Standort dort als sanierungsbedürftig. Auf diesem Boden ist ein neues Quartier geplant. Im Mai 2024 mass der Kanton in einer Klybeck-Messstelle 1,6 ng/l Benzidin, über dem standortspezifischen Konzentrationswert; laut Regierung geht von den Belastungen in der heutigen Situation keine Gefährdung aus. In Feldreben überschreiten chlorierte Kohlenwasserstoffe im Grundwasser die gesetzlichen Werte bis um das Zehnfache, und zwischen Beurteilung und Arbeitsbeginn vergingen siebzehn Jahre."},"sources":["bs-klybeck","rr-klybeck-2025","aue-benzidin-2024","bafu-feldreben","bl-feldreben"]},"upgrades":[{"text":{"en":"Require a substance inventory drawn from each site's production history before building permits are granted.","de":"Vor der Erteilung von Baubewilligungen ein Stoffinventar aus der Produktionsgeschichte jedes Areals verlangen."},"sources":[]},{"text":{"en":"Make independent second opinions standard, as the canton did for the Ackermätteli playground in 2025.","de":"Unabhängige Zweitgutachten zum Standard machen, wie es der Kanton 2025 für den Spielplatz Ackermätteli getan hat."},"sources":["bs-ackermaetteli"]},{"text":{"en":"Publish all site monitoring as open data, well by well, as the canton already does for its groundwater campaigns.","de":"Die gesamte Standortüberwachung als offene Daten publizieren, Messstelle für Messstelle, wie es der Kanton für seine Grundwasserkampagnen bereits tut."},"sources":["bs-pfas"]}]},{"id":"air","name":{"en":"Air quality","de":"Luftqualität"},"short":{"en":"Air","de":"Luft"},"grade":"C+","verdict":{"en":"In 2025 nitrogen dioxide met the Swiss annual limit at both Basel stations. Fine particles at Feldbergstrasse did not, and ozone exceeded its hourly limit for hundreds of hours.","de":"2025 hielt Stickstoffdioxid an beiden Basler Stationen den Schweizer Jahresgrenzwert ein. Feinstaub an der Feldbergstrasse nicht, und Ozon überschritt seinen Stundengrenzwert während Hunderten von Stunden."},"metrics":[{"value":"27 µg/m³","label":{"en":"NO2 annual mean at Feldbergstrasse in 2025","de":"NO2-Jahresmittel an der Feldbergstrasse 2025"},"context":{"en":"Swiss limit: 30. In 2022: 37.","de":"Schweizer Grenzwert: 30. Im Jahr 2022: 37."},"basis":"measured","sources":["luft-2025","luft-2022"]},{"value":"17 µg/m³","label":{"en":"NO2 annual mean at St. Johanns-Platz in 2025","de":"NO2-Jahresmittel am St. Johanns-Platz 2025"},"context":{"en":"In 2022: 19","de":"Im Jahr 2022: 19"},"basis":"measured","sources":["luft-2025","luft-2022"]},{"value":"11 µg/m³","label":{"en":"PM2.5 annual mean at Feldbergstrasse in 2025, above the Swiss limit","de":"PM2.5-Jahresmittel an der Feldbergstrasse 2025, über dem Schweizer Grenzwert"},"context":{"en":"Swiss limit: 10. In 2022: 15.","de":"Schweizer Grenzwert: 10. Im Jahr 2022: 15."},"basis":"measured","sources":["luft-2025","luft-2022"]},{"value":"202 h","label":{"en":"Hours above the ozone limit at St. Johanns-Platz in 2025","de":"Stunden über dem Ozon-Grenzwert am St. Johanns-Platz 2025"},"context":{"en":"The limit of 120 µg/m³ may be exceeded once a year. Chrischona: 268 h.","de":"Der Grenzwert von 120 µg/m³ darf einmal im Jahr überschritten werden. Chrischona: 268 h."},"basis":"measured","sources":["luft-2025"]}],"charts":["air-limits"],"truth":{"text":{"en":"\"Within limits\" means within Swiss limits. For nitrogen dioxide and fine particles these are two to three times the WHO guidelines of 2021. In 2025 both Basel stations were above both WHO guidelines.","de":"«Innerhalb der Grenzwerte» heisst: innerhalb der Schweizer Grenzwerte. Für Stickstoffdioxid und Feinstaub liegen diese beim Zwei- bis Dreifachen der WHO-Richtwerte von 2021. 2025 lagen beide Basler Stationen über beiden WHO-Richtwerten."},"sources":["luft-2025","who-aqg-2021"]},"upgrades":[{"text":{"en":"Report against the WHO 2021 values as cantonal target values, even though the legal limits are federal.","de":"Die WHO-Werte 2021 als kantonale Zielwerte ausweisen und daran berichten, auch wenn die Grenzwerte Bundesrecht sind."},"sources":["who-aqg-2021"]},{"text":{"en":"Concentrate on fine particles and carcinogenic soot from combustion, which the regional clean-air programme singles out for reduction.","de":"Auf Feinstaub und krebserregenden Russ aus Verbrennung fokussieren, deren Reduktion das regionale Luftreinhalteprogramm besonders hervorhebt."},"sources":["ub-luft-2025"]}]},{"id":"water","name":{"en":"Drinking water and rivers","de":"Trinkwasser und Flüsse"},"short":{"en":"Water","de":"Wasser"},"grade":"C+","subgrades":[{"label":{"en":"Tap water","de":"Leitungswasser"},"grade":"B–"},{"label":{"en":"River ecosystems","de":"Flussökosysteme"},"grade":"C"}],"verdict":{"en":"Tap water stays more than a hundred times below the PFAS maxima. Groundwater and fish do not look as good.","de":"Das Leitungswasser liegt mehr als hundertfach unter den PFAS-Höchstwerten. Grundwasser und Fische stehen schlechter da."},"metrics":[{"value":">100×","label":{"en":"Margin below the legal maxima for PFOS, PFOA and PFHxS in Basel tap water, 2023","de":"Abstand zu den gesetzlichen Höchstwerten für PFOS, PFOA und PFHxS im Basler Trinkwasser, 2023"},"context":{"en":"In every sample","de":"In allen Proben"},"basis":"measured","sources":["gr-pfas-2024"]},{"value":{"en":"11,000","de":"11’000"},"label":{"en":"ng TEQ/l PFAS at the most contaminated groundwater well in Basel, May 2024","de":"ng TEQ/l PFAS an der am stärksten belasteten Grundwassermessstelle Basels, Mai 2024"},"context":{"en":"Federal concentration value then applied: 50","de":"Damals angewandter Konzentrationswert des Bundes: 50"},"basis":"measured","sources":["aue-pfas-gw-2024"]},{"value":{"en":"107 of 107","de":"107 von 107"},"label":{"en":"Wild fish samples from both Basel cantons containing PFAS, 2024","de":"Wildfischproben aus beiden Basel mit PFAS, 2024"},"context":{"en":"4 of 10 chub from the Wiese were above the food maxima for PFOS, which formally apply only to fish sold.","de":"4 von 10 Alet aus der Wiese lagen über den Lebensmittel-Höchstwerten für PFOS, die formell nur für verkaufte Fische gelten."},"basis":"measured","sources":["pfas-fische-2024","gd-pfas-fische-2024"]},{"value":{"en":"25.9 °C","de":"25,9 °C"},"label":{"en":"Highest daily mean temperature of the Rhine at Weil (Palmrainbrücke), 30 June 2026","de":"Höchstes Tagesmittel der Rheintemperatur bei Weil (Palmrainbrücke), 30. Juni 2026"},"context":{"en":"On 24 June the canton closed the lower Birs and Wiese to bathing, entry and fishing to protect fish from heat stress.","de":"Am 24. Juni sperrte der Kanton die Unterläufe von Birs und Wiese für Baden, Betreten und Fischen, um die Fische vor Hitzestress zu schützen."},"basis":"measured","sources":["bafu-rhein-weil","bs-mm-sperre-2026","bs-birs-2026","bs-wiese-2026"]}],"charts":["pfas-groundwater"],"truth":{"text":{"en":"Part of Basel's drinking water is produced from groundwater in areas where PFAS are measured. In May 2024 samples in the populated inflow area of the Langen Erlen wells were partly above the reference value that applies to groundwater protection areas. The canton says the causes are being investigated and that elevated levels are to be expected in built-up areas, from more than one source. Since 2025 it assesses the results against a new, higher federal value that is still only proposed.","de":"Ein Teil des Basler Trinkwassers wird aus Grundwasser in Gebieten gewonnen, in denen PFAS gemessen werden. Im Mai 2024 lagen Proben im besiedelten Zuströmbereich der Fassungen in den Langen Erlen teils über dem für Grundwasserschutzbereiche massgebenden Wert. Der Kanton sagt, den Ursachen werde nachgegangen, und erhöhte Werte seien im besiedelten Gebiet zu erwarten und nicht auf eine einzige Quelle zurückzuführen. Seit 2025 beurteilt er die Ergebnisse an einem neuen, höheren Wert des Bundes, der erst vorgeschlagen ist."},"sources":["aue-pfas-gw-2024","aue-pfas-gw-2025"]},"upgrades":[{"text":{"en":"Identify the sources of the PFAS hotspots in the groundwater, enter them in the contaminated-sites register and put the cost on the polluters. The Grand Council took a first step in September 2026 by referring a cantonal initiative for a federal PFAS levy.","de":"Die Quellen der PFAS-Belastungsschwerpunkte im Grundwasser ermitteln, im Kataster der belasteten Standorte erfassen und die Kosten den Verursachern auferlegen. Der Grosse Rat hat im September 2026 mit der Überweisung einer Standesinitiative für eine PFAS-Abgabe des Bundes einen ersten Schritt getan."},"sources":["aue-pfas-gw-2024","gr-pfas-abgabe-2026"]},{"text":{"en":"Build cold-water refuges at the mouths of the Birs and Wiese before the next hot summer.","de":"Vor dem nächsten heissen Sommer Kaltwasser-Refugien an den Mündungen von Birs und Wiese schaffen."},"sources":["bs-birs-2026"]}]},{"id":"noise","name":{"en":"Noise and traffic","de":"Lärm und Verkehr"},"short":{"en":"Noise & traffic","de":"Lärm & Verkehr"},"grade":"D+","verdict":{"en":"One resident in five lives with road noise above the legal limit at night, eight years after the federal deadline for remediation.","de":"Jede fünfte Person lebt nachts mit Strassenlärm über dem Grenzwert, acht Jahre nach Ablauf der Bundesfrist für die Sanierung."},"metrics":[{"value":{"en":"19.7%","de":"19,7 %"},"label":{"en":"Residents of Basel-Stadt exposed to road noise above the legal limit at night, 2025","de":"Anteil der Bevölkerung von Basel-Stadt mit Strassenlärm über dem Grenzwert in der Nacht, 2025"},"context":{"en":"2000: 17.0%","de":"2000: 17,0 %"},"basis":"official","sources":["ub-laerm-1002"]},{"value":{"en":"11.6%","de":"11,6 %"},"label":{"en":"Residents exposed to road noise above the legal limit by day, 2025","de":"Anteil der Bevölkerung mit Strassenlärm über dem Grenzwert am Tag, 2025"},"context":{"en":"2000: 13.4%","de":"2000: 13,4 %"},"basis":"official","sources":["ub-laerm-1002"]},{"value":{"en":"9,631,209","de":"9’631’209"},"label":{"en":"EuroAirport passengers in 2025","de":"Passagiere am EuroAirport 2025"},"context":{"en":"2019: 9,090,312","de":"2019: 9’090’312"},"basis":"counted","sources":["eap-stat-2025"]}],"charts":["noise-exposure","calming"],"truth":{"text":{"en":"The legal duty to remediate road noise has been overdue since 2018, and the canton's main measure, more Tempo 30, is not yet decided. It is before the Grand Council, and from 1 October 2026 federal law requires an expert report showing that Tempo 30 on a main road does not divert traffic into residential streets. Basel-Stadt voted 56% against motorway expansion in 2024, yet federal planning has put the Rheintunnel back on the list. Meanwhile the canton's own calculation shows no progress at night: in 2025 a larger share of residents lived above the night-time limit than in 2000.","de":"Die Rechtspflicht zur Sanierung des Strassenlärms ist seit 2018 überfällig, und die wichtigste Massnahme des Kantons, mehr Tempo 30, ist noch nicht beschlossen. Sie liegt beim Grossen Rat, und ab dem 1. Oktober 2026 verlangt das Bundesrecht ein Gutachten, das zeigt, dass Tempo 30 auf einer Hauptstrasse keinen Ausweichverkehr in Wohnquartiere auslöst. Basel-Stadt stimmte 2024 mit 56 % gegen den Autobahnausbau, doch die Bundesplanung hat den Rheintunnel wieder auf die Liste gesetzt. Die eigene Berechnung des Kantons zeigt nachts keinen Fortschritt: 2025 lebte ein grösserer Anteil der Bevölkerung über dem Nachtgrenzwert als im Jahr 2000."},"sources":["bs-mm-tempo30-2026","uvek-v45-2026","astra-schilliger-2026","bs-abst-2024","ub-laerm-1002"]},"upgrades":[{"text":{"en":"Introduce the planned night-time Tempo 30 immediately. It needs signs, not construction, and courts have upheld noise-based Tempo 30 orders.","de":"Das geplante Nacht-Tempo-30 sofort einführen. Es braucht Signale, keine Bauarbeiten, und Gerichte haben lärmbegründete Tempo-30-Anordnungen bestätigt."},"sources":["bs-mm-tempo30-2026","bger-1c-318-2024"]},{"text":{"en":"Hold the government to the conditions it set in March 2026 for supporting the Rheintunnel: tangible gains for residents, flanking measures such as urban greenery, space for walking and cycling and unsealing, and a limited construction burden. Make them binding before construction is approved.","de":"Die Regierung auf die Bedingungen verpflichten, die sie im März 2026 für eine Unterstützung des Rheintunnels formuliert hat: spürbarer Mehrwert für die Bevölkerung, flankierende Massnahmen wie Stadtgrün, Raum für Fuss- und Veloverkehr und Entsiegelung sowie eine begrenzte Baubelastung. Diese Bedingungen verbindlich machen, bevor der Bau bewilligt wird."},"sources":["rr-rheintunnel-2026"]},{"text":{"en":"Commission the diversion reports now required by federal law for each main-road section together with the noise reports, so that the new requirement does not delay remediation further.","de":"Die neu vom Bundesrecht verlangten Gutachten zum Ausweichverkehr für jeden Hauptstrassenabschnitt zusammen mit den Lärmgutachten in Auftrag geben, damit die neue Anforderung die Sanierung nicht weiter verzögert."},"sources":["astra-schilliger-2026"]},{"text":{"en":"Publish measured noise levels from permanent stations on the busiest roads, so that remediation can be checked against measurements rather than models.","de":"Gemessene Lärmpegel von festen Stationen an den meistbefahrenen Strassen veröffentlichen, damit sich die Sanierung an Messungen statt an Modellen überprüfen lässt."},"sources":["lsv-38"]}]}],"charts":{"waste-origin":{"type":"stack","basis":["measured","derived"],"title":{"en":"Where the waste burned in Basel comes from, 2025","de":"Woher der in Basel verbrannte Abfall stammt, 2025"},"note":{"en":"Tonnes of waste delivered to the Basel incinerator (KVA) in 2025, by origin, as reported by IWB. «Other» combines the report's rows for Aargau, the Fricktal and Laufental-Schwarzbubenland waste associations, Solothurn and various suppliers.","de":"2025 an die Kehrichtverwertungsanlage (KVA) Basel gelieferte Tonnen Abfall nach Herkunft, gemäss IWB. «Übrige» fasst die Zeilen des Berichts für Aargau, die Abfallverbände Fricktal und Laufental-Schwarzbubenland, Solothurn und diverse Anlieferer zusammen."},"unit":"t","segments":[{"label":{"en":"Basel-Stadt","de":"Basel-Stadt"},"value":52986,"tone":"ink"},{"label":{"en":"Basel-Landschaft","de":"Basel-Landschaft"},"value":92058,"tone":"g1"},{"label":{"en":"Germany (district of Lörrach)","de":"Deutschland (Landkreis Lörrach)"},"value":32832,"tone":"g2"},{"label":{"en":"Other","de":"Übrige"},"value":49202,"tone":"g3"}],"sources":["iwb-kva-2025"]},"hot-days":{"type":"columns","basis":["derived","measured"],"title":{"en":"Hot days (30 °C or more) in Basel, June to August","de":"Hitzetage (30 °C und mehr) in Basel, Juni bis August"},"note":{"en":"MeteoSwiss station Basel/Binningen, homogenised series. The bars for 2003, 2018 and 2026 add up MeteoSwiss's counts for June, July and August; the normal is MeteoSwiss's mean for a whole year. In 2026 there were 62 hot days up to 27 September.","de":"MeteoSchweiz-Station Basel/Binningen, homogenisierte Reihe. Die Säulen für 2003, 2018 und 2026 addieren die Zählungen von MeteoSchweiz für Juni, Juli und August; der Normwert ist das Jahresmittel von MeteoSchweiz. 2026 gab es bis zum 27. September 62 Hitzetage."},"unit":{"en":"days","de":"Tage"},"valueLabel":{"en":"Days of 30 °C or more","de":"Tage mit 30 °C und mehr"},"bars":[{"label":{"en":"Normal, whole year (1991–2020)","de":"Normwert ganzes Jahr (1991–2020)"},"value":14.3,"digits":1,"tone":"base","sources":["meteoswiss-normwerte"]},{"label":{"en":"2003","de":"2003"},"value":41,"tone":"mid","sources":["nbcn-binningen"]},{"label":{"en":"2018","de":"2018"},"value":24,"tone":"mid","sources":["nbcn-binningen"]},{"label":{"en":"2026","de":"2026"},"value":52,"tone":"bad","sources":["nbcn-binningen"]}],"sources":["nbcn-binningen","meteoswiss-normwerte","meteoswiss-jja-2026"]},"trees":{"type":"dots","basis":"counted","title":{"en":"Trees on public ground in the city of Basel, 2025","de":"Bäume auf öffentlichem Grund in der Stadt Basel, 2025"},"note":{"en":"One dot is ten trees. Trees maintained by the Stadtgärtnerei in parks, streets and public grounds of the city of Basel. Planting includes replacements; felling includes routine, emergency and construction felling. The stock was 23,784 at the end of 2023 and 24,436 at the end of 2025.","de":"Ein Punkt entspricht zehn Bäumen. Von der Stadtgärtnerei gepflegte Bäume in Parks, Strassen und öffentlichen Anlagen der Stadt Basel. Pflanzungen einschliesslich Ersatz; Fällungen einschliesslich regulärer, Not- und Baufällungen. Der Bestand betrug Ende 2023 23’784 und Ende 2025 24’436 Bäume."},"perDot":10,"unit":{"en":"Trees","de":"Bäume"},"rows":[{"label":{"en":"Planted in 2025","de":"Gepflanzt 2025"},"value":478,"tone":"good","sources":["stg-baeume-2025"]},{"label":{"en":"Felled in 2025","de":"Gefällt 2025"},"value":378,"tone":"bad","sources":["stg-baeume-2025"]}],"sources":["stg-baeume-2025"]},"legacy-sites":{"type":"sites","basis":"measured","title":{"en":"Two sites, measured and classified","de":"Zwei Standorte, gemessen und eingestuft"},"note":{"en":"Status and measurements as published by the cantonal and federal environmental offices.","de":"Stand und Messwerte gemäss den Veröffentlichungen der kantonalen und eidgenössischen Umweltämter."},"sites":[{"name":{"en":"Klybeck","de":"Klybeck"},"place":{"en":"Basel-Stadt, former chemical works between the Rhine and the Wiese","de":"Basel-Stadt, ehemalige Chemie-Werkareale zwischen Rhein und Wiese"},"rows":[{"k":{"en":"Register status","de":"Katastereintrag"},"v":{"en":"Work areas 1, 2 and 3/6 «contaminated, requiring monitoring»; one site in area 3 requires remediation","de":"Werkareale 1, 2 und 3/6 «belastet, überwachungsbedürftig»; ein Standort auf Areal 3 sanierungsbedürftig"},"sources":["bs-klybeck","rr-klybeck-2025"]},{"k":{"en":"Benzidine, May 2024","de":"Benzidin, Mai 2024"},"v":{"en":"1.6 ng/l at well 725; below 0.1 ng/l at wells 726 and 831","de":"1,6 ng/l an Messstelle 725; unter 0,1 ng/l an den Messstellen 726 und 831"},"sources":["aue-benzidin-2024"]},{"k":{"en":"Reference values","de":"Beurteilungswerte"},"v":{"en":"Site-specific concentration value 1.5 ng/l; monitoring 0.6 ng/l, remediation 3.0 ng/l","de":"Standortspezifischer Konzentrationswert 1,5 ng/l; Überwachung 0,6 ng/l, Sanierung 3,0 ng/l"},"sources":["aue-benzidin","aue-benzidin-2024"]},{"k":{"en":"Hazard","de":"Gefährdung"},"v":{"en":"Benzidine is carcinogenic; the government sees no danger from the subsoil in the present situation","de":"Benzidin ist krebserregend; die Regierung sieht in der heutigen Situation keine Gefährdung aus dem Untergrund"},"sources":["aue-benzidin","rr-klybeck-2025"]},{"k":{"en":"Complication","de":"Erschwernis"},"v":{"en":"Listed buildings and underground tunnels make excavation difficult","de":"Denkmalgeschützte Bauten und unterirdische Stollen erschweren den Aushub"},"sources":["bs-klybeck"]}]},{"name":{"en":"Feldreben","de":"Feldreben"},"place":{"en":"Muttenz (Basel-Landschaft), landfill under a commercial area","de":"Muttenz (Basel-Landschaft), Deponie unter einem Gewerbegebiet"},"rows":[{"k":{"en":"History","de":"Geschichte"},"v":{"en":"Landfill from 1936 to 1967 for household, construction and commercial waste; chemical companies delivered waste for about ten years","de":"Deponie von 1936 bis 1967 für Hauskehricht, Bauschutt und Gewerbeabfälle; chemische Betriebe lieferten während rund zehn Jahren Abfälle an"},"sources":["bafu-feldreben"]},{"k":{"en":"Groundwater","de":"Grundwasser"},"v":{"en":"Chlorinated hydrocarbons downstream of the landfill, up to ten times the limits of the Contaminated Sites Ordinance","de":"Chlorierte Kohlenwasserstoffe im Abstrom der Deponie, bis zum Zehnfachen der Werte der Altlasten-Verordnung"},"sources":["bafu-feldreben"]},{"k":{"en":"Status","de":"Stand"},"v":{"en":"Classified as requiring remediation in September 2008; remediation order 2016; works began in December 2025","de":"Im September 2008 als sanierungsbedürftig beurteilt; Sanierungsverfügung 2016; Arbeiten seit Dezember 2025"},"sources":["bl-feldreben"]}]}],"sources":["bs-klybeck","bafu-feldreben","bl-feldreben"]},"air-limits":{"type":"thresholds","basis":"measured","title":{"en":"Measured against two yardsticks","de":"An zwei Massstäben gemessen"},"note":{"en":"Annual means in µg/m³. Only 2022 and 2025 are shown for Feldbergstrasse: in 2024 the station stood at a temporary, better-ventilated site. Limits and guidelines are reference values, not measurements.","de":"Jahresmittel in µg/m³. Für die Feldbergstrasse sind nur 2022 und 2025 gezeigt: 2024 stand die Station an einem provisorischen, besser durchlüfteten Standort. Grenz- und Richtwerte sind Referenzwerte, keine Messwerte."},"max":40,"unit":"µg/m³","groups":[{"label":{"en":"Nitrogen dioxide (NO2)","de":"Stickstoffdioxid (NO2)"},"items":[{"label":{"en":"Feldbergstrasse, 2022","de":"Feldbergstrasse, 2022"},"value":37,"tone":"ink","s
