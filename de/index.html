.dotrow .lbl { font-size: var(--fs-s); }
.dotrow .lbl b { display: block; font-size: var(--fs-l); font-stretch: 75%; font-weight: 800; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
@media (max-width: 640px) { .dotrow { grid-template-columns: 1fr; gap: 8px; } }

/* Pathway */
.series svg { display: block; width: 100%; height: auto; overflow: visible; }
.series text { font-family: var(--font); fill: var(--ink-2); font-size: 12px; }
.series .axis { stroke: var(--rule); stroke-width: 1; }
.series .base { stroke: var(--ink); stroke-width: 2; }
.series .line { stroke: var(--ink); stroke-width: 3; fill: none; }
.series .dot { fill: var(--ink); }
.series .line.ln-bad { stroke: var(--fuchsine); } .series .dot.ln-bad { fill: var(--fuchsine); }
.series .line.ln-good { stroke: var(--rhine); } .series .dot.ln-good { fill: var(--rhine); }
.series .line.ln-mid { stroke: var(--sulfur); } .series .dot.ln-mid { fill: var(--sulfur); }
.series .line.ln-g2 { stroke: var(--g2); } .series .dot.ln-g2 { fill: var(--g2); }
.lnkey { display: inline-block; width: 18px; height: 4px; vertical-align: middle; background: var(--ink); }
.lnkey.ln-bad { background: var(--fuchsine); } .lnkey.ln-good { background: var(--rhine); } .lnkey.ln-mid { background: var(--sulfur); } .lnkey.ln-g2 { background: var(--g2); }
.series .val { fill: var(--ink); font-weight: 700; }
.series .ref { stroke: var(--fuchsine); stroke-width: 2; stroke-dasharray: 6 4; }
.series .ref-pt { fill: none; stroke: var(--fuchsine); stroke-width: 2.5; }
.series .ref-t { fill: var(--fuchsine); font-weight: 700; }
.refkey, .refkey-pt { display: inline-block; width: 18px; height: 0; border-top: 2px dashed var(--fuchsine); vertical-align: middle; }
.refkey-pt { width: 12px; height: 12px; border: 2.5px solid var(--fuchsine); border-radius: 50%; }
.pace { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px var(--gap); margin-top: 20px; }
.pace div { border-top: 2px solid var(--ink); padding-top: 8px; }
.pace b { display: block; font-size: var(--fs-2xl); font-weight: 800; font-stretch: 72%; line-height: 1.05; }
.pace span { font-size: var(--fs-s); color: var(--ink-2); }
.pace .hot b { color: var(--fuchsine); }

/* Site sheets */
.sheets { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--gap); }
.sheet { border-top: 8px solid var(--fuchsine); background: var(--field); }
.sheet header { padding: 16px 18px 12px; }
.sheet h4 { margin: 0; font-size: var(--fs-xl); font-stretch: 75%; font-weight: 800; }
.sheet header p { font-size: var(--fs-s); color: var(--ink-2); margin-top: 2px; }
.sheet dl { margin: 0; }
.sheet dl div { display: grid; grid-template-columns: 8.5rem 1fr; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--rule); font-size: var(--fs-s); }
.sheet dt { font-weight: 700; }
.sheet dd { margin: 0; }
@media (max-width: 420px) { .sheet dl div { grid-template-columns: 1fr; gap: 2px; } }

/* Log scale */
.logaxis { position: relative; height: 18px; font-size: var(--fs-xs); color: var(--ink-2); }
.logaxis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.logaxis span:first-child { transform: none; }
.logaxis span:last-child { transform: translateX(-100%); }
.track .lim { position: absolute; top: -7px; bottom: -7px; border-left: 3px solid var(--ink); }
.legend i.limkey { width: 3px; height: 18px; background: var(--ink); }

/* Progress */
.progress { position: relative; height: 56px; background: var(--field); display: flex; }
.progress .done { background: var(--ink); color: var(--paper); display: flex; align-items: center; padding-left: 12px; font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); }
.overdue { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; }
.overdue b { font-size: var(--fs-2xl); font-weight: 800; font-stretch: 72%; color: var(--fuchsine); line-height: 1; }

/* Truth + upgrades */
.truth { margin-top: clamp(48px, 6vw, 72px); padding-top: 16px; border-top: 8px solid var(--fuchsine); }
.truth h3 { font-size: var(--fs-s); color: var(--fuchsine); font-weight: 700; }
.truth p { margin-top: 10px; font-size: clamp(1.25rem, 2.1vw, 1.625rem); font-weight: 600; font-stretch: 92%; line-height: 1.3; max-width: 44ch; }
.upgrades { margin-top: 40px; }
.upgrades h3 { font-size: var(--fs-l); font-stretch: 90%; }
.upgrades ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 72ch; }
.upgrades li { padding-left: 22px; position: relative; }
.upgrades li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 12px; height: 4px; background: var(--rhine); }
.upgrades .note { margin-top: 12px; }

/* Generic sections */
.block { border-top: 3px solid var(--ink); padding-block: clamp(48px, 7vw, 96px); }
.block-head { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-bottom: 32px; }
.block-head h2 { grid-column: span 5; font-size: clamp(2rem, 4vw, 3.25rem); font-weight: 800; font-stretch: 72%; line-height: 1; }
.block-head p { grid-column: 7 / span 6; font-size: var(--fs-l); color: var(--ink-2); line-height: 1.45; }
@media (max-width: 900px) { .block-head h2, .block-head p { grid-column: span 12; } }

/* Votes */
.votes .row { grid-template-columns: minmax(200px, 38%) 1fr 5.5rem; }
.votes .lbl small { display: block; color: var(--ink-2); font-size: var(--fs-xs); }
.votes .kind { display: inline-block; font-size: var(--fs-xs); font-weight: 700; margin-right: 6px; }
.votes .track { height: 28px; background: transparent; border: 2px solid var(--ink); }
.votes .bar.pass { background: var(--ink); }
.votes .bar.fail { background: repeating-linear-gradient(135deg, var(--g2) 0 4px, transparent 4px 8px); }
.votes .half { position: absolute; left: 50%; top: -8px; bottom: -8px; border-left: 2px solid var(--fuchsine); }
@media (max-width: 640px) { .votes .row { grid-template-columns: 1fr 4.5rem; } }

/* Timeline */
.tl { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.tl h3 { font-size: var(--fs-l); font-stretch: 85%; margin-bottom: 8px; }
.tl ol { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); }
.tl time { font-weight: 800; font-stretch: 78%; }
.tl .when { font-size: var(--fs-xs); color: var(--fuchsine); font-weight: 700; display: block; }
.tl .ahead li:first-child { border-top: 3px solid var(--fuchsine); }
@media (max-width: 800px) { .tl { grid-template-columns: 1fr; } }

/* Legal */
.legal { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px var(--gap); }
.legal article { border-top: 2px solid var(--ink); padding-top: 12px; }
.legal h3 { font-size: var(--fs-l); font-stretch: 88%; }
.legal .law { font-size: var(--fs-s); color: var(--ink-2); margin-top: 6px; font-style: italic; }
.legal p.body { margin-top: 10px; }
.legal p.work { margin-top: 10px; font-size: var(--fs-s); }
.legal p.work b { font-weight: 700; }

/* Method */
.rubric { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); margin: 0; }
.rubric div { border-top: 8px solid var(--c); padding-top: 8px; }
.rubric dt { font-size: var(--fs-2xl); font-weight: 900; font-stretch: 62%; line-height: 1; color: var(--c-text); }
.rubric dd { margin: 6px 0 0; font-size: var(--fs-s); }
.rubric .t-good { --c: var(--rhine); --c-text: var(--rhine); }
.rubric .t-mid { --c: var(--sulfur); --c-text: var(--sulfur-ink); }
.rubric .t-bad { --c: var(--fuchsine); --c-text: var(--fuchsine); }
.method-notes { margin: 32px 0 0; padding-left: 1.1em; max-width: 72ch; display: grid; gap: 8px; }
@media (max-width: 800px) { .rubric { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Sources */
.src-tools { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 20px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 2px solid var(--ink); background: none; padding: 6px 10px; font-size: var(--fs-s); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.src-search { border: 2px solid var(--ink); background: var(--paper); padding: 7px 10px; font: inherit; font-size: var(--fs-s); min-width: min(100%, 280px); color: var(--ink); }
.src-status { font-size: var(--fs-s); color: var(--ink-2); }
.srclist { list-style: none; margin: 0; padding: 0; }
.srclist li { display: grid; grid-template-columns: 3rem 1fr auto; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); }
.srclist li:target { background: var(--field); }
.srclist .n { font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); line-height: 1.2; }
.srclist .t a { font-weight: 600; }
.srclist .m { font-size: var(--fs-s); color: var(--ink-2); margin-top: 2px; }
.srclist .used { font-size: var(--fs-xs); color: var(--ink-3); margin-top: 4px; }
.type { font-size: var(--fs-xs); font-weight: 700; padding: 2px 8px; border: 1px solid var(--ink); white-space: nowrap; align-self: start; }
.type.official { background: var(--ink); color: var(--paper); }
.type.advocacy { border-color: var(--fuchsine); color: var(--fuchsine); }
@media (max-width: 560px) { .srclist li { grid-template-columns: 2.25rem 1fr; } .srclist .type { grid-column: 2; justify-self: start; } }

/* Popover */
.pop {
  position: absolute; z-index: 60; width: min(380px, calc(100vw - 24px)); background: var(--paper);
  border: 2px solid var(--ink); padding: 16px 18px 18px; box-shadow: 8px 8px 0 var(--ink);
}
.pop[hidden] { display: none; }
.pop .top { display: flex; align-items: center; gap: 12px; }
.pop .top .close { margin-left: auto; }
.pop .n { font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); }
.pop h4 { margin: 10px 0 4px; font-size: var(--fs-m); line-height: 1.3; }
.pop p { font-size: var(--fs-s); color: var(--ink-2); }
.pop .links { display: flex; gap: 16px; margin-top: 12px; font-size: var(--fs-s); font-weight: 600; }
.pop .close { border: none; background: none; font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 0 4px; }
@media (max-width: 640px) {
  .pop { position: fixed; left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100%; box-shadow: 0 -4px 0 var(--ink); border-width: 2px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
}

/* Footer */
.site-foot { border-top: 3px solid var(--ink); padding-block: 32px 48px; font-size: var(--fs-s); color: var(--ink-2); }
.site-foot .wrap { display: grid; gap: 8px; }

/* Kicker, method footer, changelog */
.kicker { font-size: var(--fs-s); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 18px; display: flex; gap: 10px; align-items: center; }
.kicker::before { content: ""; flex: none; width: 28px; height: 10px; background: linear-gradient(90deg, var(--ink) 0 22%, var(--fuchsine) 22%); }
.method-foot { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px var(--gap); margin-top: 48px; }
.method-foot h3 { font-size: var(--fs-l); font-stretch: 88%; margin-bottom: 10px; }
.changelog { list-style: none; margin: 0; padding: 0; font-size: var(--fs-s); }
.changelog li { display: grid; grid-template-columns: 9rem 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--rule); }
.changelog time { font-weight: 700; }
.cite-text { font-size: var(--fs-s); background: var(--field); padding: 14px 16px; overflow-wrap: anywhere; user-select: all; }
@media (max-width: 480px) { .changelog li { grid-template-columns: 1fr; gap: 2px; } }
.noscript { padding-block: 40px; max-width: 72ch; }
.noscript h1 { font-size: var(--fs-2xl); margin-bottom: 16px; }
.noscript ul { padding-left: 1.2em; }

/* Print */
@media print {
  :root { --paper: #fff; }
  .site-head, .actions, .theme-btn, .src-tools, .pop, .skip { display: none !important; }
  .area-head { position: static; }

  .srclist .t a::after { content: " " attr(href); font-weight: 400; font-size: 0.75rem; word-break: break-all; }
  body { font-size: 10.5pt; }
}

  <noscript><div class="wrap noscript"><h1>Im Sommer 2026 hatte Basel 52 Tage mit 30 °C oder mehr: mehr als den halben Sommer.</h1><p>Diese Bilanz verwendet nur Werte, die eine amtliche Stelle gemessen oder gezählt hat, jeweils mit Jahr und Quelle. Grenz- und Zielwerte erscheinen nur als Referenzlinien. Schätzungen, Prognosen und modellierte Zahlen sind weggelassen, auch das Treibhausgasinventar des Kantons, das eine Berechnung ist.</p><p><b>Gesamtnote: C.</b> Gute Steuerung auf dem Papier. Die Messungen zeigen einen laufenden Wärmewandel, Rekordhitze, Luft, die die meisten, aber nicht alle Schweizer Grenzwerte einhält, und eine Chemie-Belastung, die noch im Boden liegt.</p><h2>Noten nach Bereich</h2><ul><li><b>C</b> Klimaschutz: Die Wärmeversorgung wandelt sich, und das lässt sich zählen. Ob das Ziel 2037 erreicht wird, lässt sich an Messwerten nicht ablesen: Die Emissionszahlen des Kantons sind Berechnungen, die neusten betreffen 2022.</li><li><b>D</b> Hitze und Anpassung: 2026 brachte in Basel so viele Hitzetage wie nie seit Messbeginn. Die Baumkronenfläche der Stadt ist seit 2012 nicht gewachsen.</li><li><b>D</b> Chemie-Altlasten in Boden und Grundwasser: In den beiden Basel sind 1’718 belastete Standorte registriert. Im Klybeck, wo ein neues Quartier geplant ist, misst der Kanton im Grundwasser weiterhin das krebserregende Benzidin.</li><li><b>B–</b> Luftqualität: 2025 hielt Stickstoffdioxid an beiden Basler Stationen den Schweizer Jahresgrenzwert ein. Feinstaub an der Feldbergstrasse nicht, und Ozon überschritt seinen Stundengrenzwert während Hunderten von Stunden.</li><li><b>C+</b> Trinkwasser und Flüsse: Das Leitungswasser liegt mehr als hundertfach unter den PFAS-Höchstwerten. Grundwasser und Fische stehen schlechter da.</li><li><b>C–</b> Lärm und Verkehr: Jahre nach Ablauf einer Bundesfrist zum Strassenlärm, und keine Reihe gemessener Lärmpegel, die zeigt, wo Basel steht.</li></ul><p>Diese Seite zeichnet ihre Grafiken mit JavaScript. Die vollständigen Daten stehen in <a href="../data/assessment.json">assessment.json</a>.</p></div></noscript>

t (Basel, Riehen, Bettingen). Einige Quellen betreffen beide Basel; wo ein Standort in Basel-Landschaft liegt, aber Basel-Stadt betrifft, ist das vermerkt."},"disclaimer":{"en":"Analysis of public sources. Grades are an analytical judgment, not an official rating. Not legal advice.","de":"Auswertung öffentlicher Quellen. Die Noten sind eine analytische Einschätzung, keine amtliche Bewertung. Keine Rechtsberatung."}},"hero":{"total":92,"unit":{"en":"days","de":"Tage"},"segments":[{"value":52,"label":{"en":"hot days (30 °C or more), June to August 2026","de":"Hitzetage (30 °C und mehr), Juni bis August 2026"},"sources":["nbcn-binningen"]},{"value":40,"label":{"en":"days below 30 °C","de":"Tage unter 30 °C"},"sources":["nbcn-binningen"]}],"marker":{"value":13.6,"digits":1,"label":{"en":"hot days in a normal summer (1991–2020, sum of the monthly normals for June to August)","de":"Hitzetage in einem Normalsommer (1991–2020, Summe der Monatsnormwerte Juni bis August)"},"sources":["meteoswiss-normwerte"]},"aria":{"en":"Of the 92 days from June to August 2026, 52 reached 30 °C or more at Basel-Binningen. In a normal summer there are 13.6.","de":"Von den 92 Tagen von Juni bis August 2026 erreichten in Basel-Binningen 52 Tage 30 °C oder mehr. In einem Normalsommer sind es 13,6."},"note":{"en":"Daily maximum temperature at the MeteoSwiss station Basel-Binningen. Each day is counted once.","de":"Tageshöchsttemperatur an der MeteoSchweiz-Station Basel-Binningen. Jeder Tag ist einmal gezählt."}},"overall":{"grade":"C","summary":{"en":"Good governance on paper. The measurements show a heating transition under way, record heat, air that meets most but not all Swiss limits, and chemical contamination that is still in the ground.","de":"Gute Steuerung auf dem Papier. Die Messungen zeigen einen laufenden Wärmewandel, Rekordhitze, Luft, die die meisten, aber nicht alle Schweizer Grenzwerte einhält, und eine Chemie-Belastung, die noch im Boden liegt."},"facets":[{"label":{"en":"Governance","de":"Steuerung"},"grade":"B+","note":{"en":"Constitutional target, a dedicated climate office and a public progress portal. The portal's latest emissions data are for 2022.","de":"Ziel in der Verfassung, eine eigene Klimafachstelle und ein öffentliches Fortschrittsportal. Dessen neuste Emissionsdaten betreffen 2022."},"sources":["kv-bs","bs-mm-klimaportal","bs-klimaschutz"]},{"label":{"en":"Measured outcomes","de":"Gemessene Ergebnisse"},"grade":"C–","note":{"en":"Fossil boilers are measurably being replaced. Fine particles at Feldbergstrasse remain above the Swiss limit, the canton's heat monitoring finds no measurable reduction in exposure, and road-noise remediation is years past its deadline.","de":"Fossile Heizkessel werden messbar ersetzt. Der Feinstaub an der Feldbergstrasse liegt weiter über dem Schweizer Grenzwert, das kantonale Hitze-Controlling stellt keine messbare Entlastung fest, und die Strassenlärmsanierung ist seit Jahren überfällig."},"sources":["aue-heizungen","luft-2025","bs-controlling-2026","rr-laerm-2018"]},{"label":{"en":"Legacy liabilities","de":"Altlasten"},"grade":"D","note":{"en":"Carcinogenic benzidine in the groundwater under Klybeck, PFAS in groundwater and fish, and remediation of the largest landfill only begun in December 2025.","de":"Krebserregendes Benzidin im Grundwasser unter dem Klybeck, PFAS in Grundwasser und Fischen, und die Sanierung der grössten Deponie erst im Dezember 2025 begonnen."},"sources":["aue-benzidin-2024","aue-pfas-gw-2024","pfas-fische-2024","bl-feldreben"]}]},"domains":[{"id":"climate","name":{"en":"Climate mitigation","de":"Klimaschutz"},"short":{"en":"Climate","de":"Klima"},"grade":"C","verdict":{"en":"Heating is changing, and the change can be counted. Whether the 2037 target will be met cannot be read from measurements: the canton's emissions figures are calculations, and the latest are for 2022.","de":"Die Wärmeversorgung wandelt sich, und das lässt sich zählen. Ob das Ziel 2037 erreicht wird, lässt sich an Messwerten nicht ablesen: Die Emissionszahlen des Kantons sind Berechnungen, die neusten betreffen 2022."},"metrics":[{"value":{"en":"7,987","de":"7’987"},"label":{"en":"Gas boilers registered in September 2026 (December 2018: 10,557)","de":"Registrierte Gasheizkessel im September 2026 (Dezember 2018: 10’557)"},"sources":["aue-heizungen"]},{"value":{"en":"1,647","de":"1’647"},"label":{"en":"Oil boilers registered in September 2026 (December 2018: 2,631)","de":"Registrierte Ölheizkessel im September 2026 (Dezember 2018: 2’631)"},"sources":["aue-heizungen"]},{"value":{"en":"2,407","de":"2’407"},"label":{"en":"Heat pumps registered in September 2026 (December 2018: 278)","de":"Registrierte Wärmepumpen im September 2026 (Dezember 2018: 278)"},"sources":["aue-heizungen"]},{"value":{"en":"7,819","de":"7’819"},"label":{"en":"District-heating connections registered in September 2026 (December 2018: 6,572)","de":"Registrierte Fernwärmeanschlüsse im September 2026 (Dezember 2018: 6’572)"},"sources":["aue-heizungen"]},{"value":{"en":"52,986 t","de":"52’986 t"},"label":{"en":"Waste from Basel-Stadt delivered to the Basel incinerator in 2025, out of 227,078 t delivered in total","de":"Abfall aus Basel-Stadt, 2025 an die KVA Basel geliefert, von insgesamt 227’078 t"},"sources":["iwb-kva-2025"]}],"charts":["heating","waste-origin"],"truth":{"text":{"en":"Basel-Stadt's net-zero target cannot be checked against measurements. The canton's emissions figures are calculated from energy statistics that themselves contain modelled values, and the most recent year is 2022. What can be counted points in the right direction: fewer gas and oil boilers, more heat pumps and district-heating connections. The incinerator shows the limits of a territorial target. Most of the waste burned there comes from other cantons and from Germany. Capturing its CO2 would need storage that Swiss law does not yet provide for.","de":"Das Netto-Null-Ziel von Basel-Stadt lässt sich nicht an Messwerten überprüfen. Die Emissionszahlen des Kantons werden aus der Energiestatistik berechnet, die ihrerseits modellierte Werte enthält, und das neuste Jahr ist 2022. Was sich zählen lässt, zeigt in die richtige Richtung: weniger Gas- und Ölheizungen, mehr Wärmepumpen und Fernwärmeanschlüsse. Die KVA zeigt die Grenzen eines territorialen Ziels. Der grösste Teil des dort verbrannten Abfalls stammt aus anderen Kantonen und aus Deutschland. Die Abscheidung seines CO2 bräuchte eine Speicherung, die das Schweizer Recht noch nicht vorsieht."},"sources":["statistik-energie-2024","iwb-kva-2025","aue-heizungen","rr-ccs-2025"]},"upgrades":[{"text":{"en":"Negotiate intercantonal and cross-border cost sharing for incinerator carbon capture now. In 2025, 52,986 of the 227,078 tonnes of waste delivered came from Basel-Stadt.","de":"Die Kostenteilung für die CO2-Abscheidung an der KVA jetzt interkantonal und grenzüberschreitend verhandeln. 2025 stammten 52’986 der 227’078 angelieferten Tonnen Abfall aus Basel-Stadt."},"sources":["iwb-kva-2025","rr-ccs-2025"]},{"text":{"en":"Implement the Grand Council's 2024 motion to reform the vehicle tax, which already weighs weight and CO2, towards fuel and space consumption.","de":"Die Motion des Grossen Rates von 2024 umsetzen, welche die bereits nach Gewicht und CO2 bemessene Motorfahrzeugsteuer stärker auf Treibstoff- und Flächenverbrauch ausrichten will."},"sources":["bs-mfz-steuer"]},{"text":{"en":"Publish the emissions inventory every year, with its method and the share of modelled values, and publish the heating register as open data.","de":"Das Emissionsinventar jährlich veröffentlichen, mit Methode und Anteil modellierter Werte, und das Heizungsregister als offene Daten publizieren."},"sources":["statistik-energie-2024","aue-heizungen"]},{"text":{"en":"Position the Rhine ports as Switzerland's CO2 export hub. The government already describes the region as pivotal for moving CO2 by rail and ship.","de":"Die Rheinhäfen als Schweizer Drehscheibe für den CO2-Export positionieren. Die Regierung bezeichnet die Region bereits als zentral für den CO2-Transport per Bahn und Schiff."},"sources":["rr-ccs-2025"]}]},{"id":"heat","name":{"en":"Heat and adaptation","de":"Hitze und Anpassung"},"short":{"en":"Heat","de":"Hitze"},"grade":"D","verdict":{"en":"2026 brought the most hot days ever measured in Basel. The city's tree canopy has not grown since 2012.","de":"2026 brachte in Basel so viele Hitzetage wie nie seit Messbeginn. Die Baumkronenfläche der Stadt ist seit 2012 nicht gewachsen."},"metrics":[{"value":{"en":"39.7 °C","de":"39,7 °C"},"label":{"en":"Highest temperature ever measured at Basel-Binningen, 30 July 2026 (record before 2026: 38.6 °C, 13 August 2003)","de":"Höchste je in Basel-Binningen gemessene Temperatur, 30. Juli 2026 (Rekord vor 2026: 38,6 °C, 13. August 2003)"},"sources":["meteoswiss-rekord-2026","meteoswiss-jja-2026"]},{"value":"52","label":{"en":"Hot days (30 °C or more) in June–August 2026; 1991–2020 normal: 13.6","de":"Hitzetage (30 °C und mehr) im Juni–August 2026; Normwert 1991–2020: 13,6"},"sources":["nbcn-binningen","meteoswiss-normwerte"]},{"value":"20","label":{"en":"Days of 35 °C or more in June–August 2026 (2003: 12)","de":"Tage mit 35 °C und mehr im Juni–August 2026 (2003: 12)"},"sources":["nbcn-binningen"]},{"value":"12","label":{"en":"Tropical nights (20 °C or more) at Basel-Binningen in June–August 2026, a record (previous: 9 in 2015)","de":"Tropennächte (20 °C und mehr) in Basel-Binningen im Juni–August 2026, ein Rekord (bisher: 9 im Jahr 2015)"},"sources":["meteoswiss-jja-2026"]},{"value":{"en":"17%","de":"17 %"},"label":{"en":"Tree canopy cover of the city of Basel in 2024, unchanged since 2012","de":"Baumkronenbedeckung der Stadt Basel 2024, seit 2012 unverändert"},"sources":["bs-controlling-2026"]},{"value":{"en":"4,477 m²","de":"4’477 m²"},"label":{"en":"Unsealing approved by permit in 2023–2024 (not yet built), against a parliamentary target of 165,000 m² by 2037","de":"2023–2024 bewilligte Entsiegelung (noch nicht gebaut), gemessen an einem Ziel des Grossen Rates von 165’000 m² bis 2037"},"sources":["bs-controlling-2026"]}],"charts":["hot-days","trees"],"truth":{"text":{"en":"The canton's own 2026 monitoring report finds no measurable reduction in the number of people exposed to heat, and tree canopy has not grown since 2012. More trees are planted than felled, but the margin is small: 478 against 378 in the city in 2025. New trees are planted mainly where streets are already being dug up for district heating or maintenance, for cost reasons. The one measure that would free real space, converting street area to greenery, was rejected at the ballot box in 2023.","de":"Der kantonale Controllingbericht 2026 stellt keine messbare Reduktion der von Hitze betroffenen Bevölkerung fest, und die Baumkronenfläche ist seit 2012 nicht gewachsen. Es werden mehr Bäume gepflanzt als gefällt, aber knapp: 478 gegenüber 378 in der Stadt im Jahr 2025. Neue Bäume werden aus Kostengründen vor allem dort gepflanzt, wo Strassen ohnehin für Fernwärme oder Unterhalt aufgerissen werden. Die eine Massnahme, die echten Raum schaffen würde, die Umwandlung von Strassenfläche in Grün, scheiterte 2023 an der Urne."},"sources":["bs-controlling-2026","stg-baeume-2025","rr-begruenung-2025","bs-abst-2023"]},"upgrades":[{"text":{"en":"Set a canopy-cover target for the identified heat hotspots instead of a tree count.","de":"Für die bekannten Hitze-Hotspots ein Ziel für die Kronenüberdeckung setzen statt einer Baumzahl."},"sources":[]},{"text":{"en":"Adopt the proposed «Grünes Basel» programme for greening and unsealing private land, still before the Grand Council, and aim it at courtyards, where no ballot fight is needed.","de":"Das vorgeschlagene Förderprogramm «Grünes Basel» für Begrünung und Entsiegelung privater Flächen, das noch im Grossen Rat hängig ist, beschliessen und gezielt in Innenhöfen einsetzen, wo es keinen Abstimmungskampf braucht."},"sources":["bs-gruenes-basel-2025","bs-controlling-2026"]},{"text":{"en":"Make unsealing the default whenever a district-heating trench is dug, not an option.","de":"Entsiegelung zur Regel machen, wann immer ein Fernwärmegraben geöffnet wird, nicht zur Option."},"sources":[]}]},{"id":"legacy","name":{"en":"Chemical legacy in soil and groundwater","de":"Chemie-Altlasten in Boden und Grundwasser"},"short":{"en":"Chemical legacy","de":"Chemie-Altlasten"},"grade":"D","verdict":{"en":"1,718 contaminated sites are registered in the two Basel cantons. At Klybeck, where a new district is planned, the canton still measures the carcinogen benzidine in the groundwater.","de":"In den beiden Basel sind 1’718 belastete Standorte registriert. Im Klybeck, wo ein neues Quartier geplant ist, misst der Kanton im Grundwasser weiterhin das krebserregende Benzidin."},"metrics":[{"value":{"en":"1,718","de":"1’718"},"label":{"en":"Contaminated sites registered in Basel-Stadt and Basel-Landschaft together (2025)","de":"Registrierte belastete Standorte in Basel-Stadt und Basel-Landschaft zusammen (Stand 2025)"},"sources":["ub-altlasten-2026"]},{"value":"62","label":{"en":"Further sites classified as requiring remediation in 2025, both cantons","de":"Weitere Standorte, 2025 als sanierungsbedürftig eingestuft, beide Kantone"},"sources":["ub-altlasten-2026"]},{"value":{"en":"1.6 ng/l","de":"1,6 ng/l"},"label":{"en":"Benzidine in groundwater at Klybeck well 725, May 2024, above the site-specific concentration value of 1.5 ng/l","de":"Benzidin im Grundwasser der Klybeck-Messstelle 725, Mai 2024, über dem standortspezifischen Konzentrationswert von 1,5 ng/l"},"sources":["aue-benzidin-2024","aue-benzidin"]},{"value":"2008","label":{"en":"Year the Feldreben landfill in Muttenz (BL) was classified as requiring remediation; works began in December 2025","de":"Jahr, in dem die Deponie Feldreben in Muttenz (BL) als sanierungsbedürftig beurteilt wurde; die Arbeiten begannen im Dezember 2025"},"sources":["bl-feldreben"]}],"charts":["legacy-sites"],"truth":{"text":{"en":"The canton classifies the Klybeck work areas as contaminated and requiring monitoring, and one site there as requiring remediation. A new district is planned on this ground. In May 2024 the canton measured benzidine at 1.6 ng/l in one Klybeck well, above the site-specific concentration value; the government says the contamination poses no danger in the present situation. At Feldreben, chlorinated hydrocarbons in the groundwater exceed the legal limits up to tenfold, and seventeen years passed between the classification and the start of works.","de":"Der Kanton führt die Klybeck-Werkareale als belastet und überwachungsbedürftig, einen Standort dort als sanierungsbedürftig. Auf diesem Boden ist ein neues Quartier geplant. Im Mai 2024 mass der Kanton in einer Klybeck-Messstelle 1,6 ng/l Benzidin, über dem standortspezifischen Konzentrationswert; laut Regierung geht von den Belastungen in der heutigen Situation keine Gefährdung aus. In Feldreben überschreiten chlorierte Kohlenwasserstoffe im Grundwasser die gesetzlichen Werte bis um das Zehnfache, und zwischen Beurteilung und Arbeitsbeginn vergingen siebzehn Jahre."},"sources":["bs-klybeck","rr-klybeck-2025","aue-benzidin-2024","bafu-feldreben","bl-feldreben"]},"upgrades":[{"text":{"en":"Require a substance inventory drawn from each site's production history before building permits are granted.","de":"Vor der Erteilung von Baubewilligungen ein Stoffinventar aus der Produktionsgeschichte jedes Areals verlangen."},"sources":[]},{"text":{"en":"Make independent second opinions standard, as the canton did for the Ackermätteli playground in 2025.","de":"Unabhängige Zweitgutachten zum Standard machen, wie es der Kanton 2025 für den Spielplatz Ackermätteli getan hat."},"sources":["bs-ackermaetteli"]},{"text":{"en":"Publish all site monitoring as open data, well by well, as the canton already does for its groundwater campaigns.","de":"Die gesamte Standortüberwachung als offene Daten publizieren, Messstelle für Messstelle, wie es der Kanton für seine Grundwasserkampagnen bereits tut."},"sources":["bs-pfas"]}]},{"id":"air","name":{"en":"Air quality","de":"Luftqualität"},"short":{"en":"Air","de":"Luft"},"grade":"B–","verdict":{"en":"In 2025 nitrogen dioxide met the Swiss annual limit at both Basel stations. Fine particles at Feldbergstrasse did not, and ozone exceeded its hourly limit for hundreds of hours.","de":"2025 hielt Stickstoffdioxid an beiden Basler Stationen den Schweizer Jahresgrenzwert ein. Feinstaub an der Feldbergstrasse nicht, und Ozon überschritt seinen Stundengrenzwert während Hunderten von Stunden."},"metrics":[{"value":"27 µg/m³","label":{"en":"NO2 annual mean at Feldbergstrasse in 2025; Swiss limit 30 (2022: 37)","de":"NO2-Jahresmittel an der Feldbergstrasse 2025; Schweizer Grenzwert 30 (2022: 37)"},"sources":["luft-2025","luft-2022"]},{"value":"17 µg/m³","label":{"en":"NO2 annual mean at St. Johanns-Platz in 2025 (2022: 19)","de":"NO2-Jahresmittel am St. Johanns-Platz 2025 (2022: 19)"},"sources":["luft-2025","luft-2022"]},{"value":"11 µg/m³","label":{"en":"PM2.5 annual mean at Feldbergstrasse in 2025, above the Swiss limit of 10 (2022: 15)","de":"PM2.5-Jahresmittel an der Feldbergstrasse 2025, über dem Schweizer Grenzwert von 10 (2022: 15)"},"sources":["luft-2025","luft-2022"]},{"value":"202 h","label":{"en":"Hours above the ozone limit of 120 µg/m³ at St. Johanns-Platz in 2025 (Chrischona: 268); the limit may be exceeded once a year","de":"Stunden über dem Ozon-Grenzwert von 120 µg/m³ am St. Johanns-Platz 2025 (Chrischona: 268); der Grenzwert darf einmal im Jahr überschritten werden"},"sources":["luft-2025"]},{"value":{"en":"Stalled","de":"Stagnation"},"label":{"en":"Nitrogen dioxide in 2025: the decline stopped, but the Swiss annual limit was met at every station","de":"Stickstoffdioxid 2025: kein weiterer Rückgang, aber der Schweizer Jahresgrenzwert wurde an allen Stationen eingehalten"},"sources":["luft-2025"]}],"charts":["air-limits"],"truth":{"text":{"en":"\"Within limits\" means within Swiss limits. For nitrogen dioxide and fine particles these are two to three times the WHO guidelines of 2021. In 2025 both Basel stations were above both WHO guidelines.","de":"«Innerhalb der Grenzwerte» heisst: innerhalb der Schweizer Grenzwerte. Für Stickstoffdioxid und Feinstaub liegen diese beim Zwei- bis Dreifachen der WHO-Richtwerte von 2021. 2025 lagen beide Basler Stationen über beiden WHO-Richtwerten."},"sources":["luft-2025","who-aqg-2021"]},"upgrades":[{"text":{"en":"Report against the WHO 2021 values as cantonal target values, even though the legal limits are federal.","de":"Die WHO-Werte 2021 als kantonale Zielwerte ausweisen und daran berichten, auch wenn die Grenzwerte Bundesrecht sind."},"sources":["who-aqg-2021"]},{"text":{"en":"Concentrate on fine particles and carcinogenic soot from combustion, which the regional clean-air programme singles out for reduction.","de":"Auf Feinstaub und krebserregenden Russ aus Verbrennung fokussieren, deren Reduktion das regionale Luftreinhalteprogramm besonders hervorhebt."},"sources":["ub-luft-2025"]}]},{"id":"water","name":{"en":"Drinking water and rivers","de":"Trinkwasser und Flüsse"},"short":{"en":"Water","de":"Wasser"},"grade":"C+","subgrades":[{"label":{"en":"Tap water","de":"Leitungswasser"},"grade":"B–"},{"label":{"en":"River ecosystems","de":"Flussökosysteme"},"grade":"C"}],"verdict":{"en":"Tap water stays more than a hundred times below the PFAS maxima. Groundwater and fish do not look as good.","de":"Das Leitungswasser liegt mehr als hundertfach unter den PFAS-Höchstwerten. Grundwasser und Fische stehen schlechter da."},"metrics":[{"value":{"en":">100×","de":">100×"},"label":{"en":"Margin below the legal maxima for PFOS, PFOA and PFHxS in every Basel tap-water sample, 2023","de":"Abstand zu den gesetzlichen Höchstwerten für PFOS, PFOA und PFHxS in allen Basler Trinkwasserproben, 2023"},"sources":["gr-pfas-2024"]},{"value":{"en":"11,000","de":"11’000"},"label":{"en":"ng TEQ/l PFAS at the most contaminated groundwater well in Basel, May 2024; the federal concentration value then applied was 50","de":"ng TEQ/l PFAS an der am stärksten belasteten Grundwassermessstelle Basels, Mai 2024; der damals angewandte Konzentrationswert des Bundes lag bei 50"},"sources":["aue-pfas-gw-2024"]},{"value":{"en":"4 of 10","de":"4 von 10"},"label":{"en":"Chub from the Wiese above the food maxima for PFOS, 2024; the maxima formally apply only to fish sold","de":"Alet aus der Wiese über den Lebensmittel-Höchstwerten für PFOS, 2024; die Höchstwerte gelten formell nur für verkaufte Fische"},"sources":["pfas-fische-2024"]},{"value":{"en":"107 of 107","de":"107 von 107"},"label":{"en":"Wild fish samples from both Basel cantons containing PFAS, 2024","de":"Wildfischproben aus beiden Basel mit PFAS, 2024"},"sources":["pfas-fische-2024","gd-pfas-fische-2024"]},{"value":"2","label":{"en":"Rivers closed to bathing, entry and fishing on their lower reaches on 24 June 2026 to protect fish from heat stress (Birs and Wiese)","de":"Flüsse, deren Unterläufe am 24. Juni 2026 zum Schutz der Fische vor Hitzestress für Baden, Betreten und Fischen gesperrt wurden (Birs und Wiese)"},"sources":["bs-mm-sperre-2026","bs-birs-2026","bs-wiese-2026"]},{"value":{"en":"25.9 °C","de":"25,9 °C"},"label":{"en":"Highest daily mean temperature of the Rhine at Weil (Palmrainbrücke) in 2026, on 30 June","de":"Höchstes Tagesmittel der Wassertemperatur des Rheins bei Weil (Palmrainbrücke) 2026, am 30. Juni"},"sources":["bafu-rhein-weil"]}],"charts":["pfas-groundwater"],"truth":{"text":{"en":"Part of Basel's drinking water is produced from groundwater in areas where PFAS are measured. In May 2024 samples in the populated inflow area of the Langen Erlen wells were partly above the reference value that applies to groundwater protection areas. The canton says the causes are being investigated and that elevated levels are to be expected in built-up areas, from more than one source. Since 2025 it assesses the results against a new, higher federal value that is still only proposed.","de":"Ein Teil des Basler Trinkwassers wird aus Grundwasser in Gebieten gewonnen, in denen PFAS gemessen werden. Im Mai 2024 lagen Proben im besiedelten Zuströmbereich der Fassungen in den Langen Erlen teils über dem für Grundwasserschutzbereiche massgebenden Wert. Der Kanton sagt, den Ursachen werde nachgegangen, und erhöhte Werte seien im besiedelten Gebiet zu erwarten und nicht auf eine einzige Quelle zurückzuführen. Seit 2025 beurteilt er die Ergebnisse an einem neuen, höheren Wert des Bundes, der erst vorgeschlagen ist."},"sources":["aue-pfas-gw-2024","aue-pfas-gw-2025"]},"upgrades":[{"text":{"en":"Identify the sources of the PFAS hotspots in the groundwater, enter them in the contaminated-sites register and put the cost on the polluters. The Grand Council took a first step in September 2026 by referring a cantonal initiative for a federal PFAS levy.","de":"Die Quellen der PFAS-Belastungsschwerpunkte im Grundwasser ermitteln, im Kataster der belasteten Standorte erfassen und die Kosten den Verursachern auferlegen. Der Grosse Rat hat im September 2026 mit der Überweisung einer Standesinitiative für eine PFAS-Abgabe des Bundes einen ersten Schritt getan."},"sources":["aue-pfas-gw-2024","gr-pfas-abgabe-2026"]},{"text":{"en":"Build cold-water refuges at the mouths of the Birs and Wiese before the next hot summer.","de":"Vor dem nächsten heissen Sommer Kaltwasser-Refugien an den Mündungen von Birs und Wiese schaffen."},"sources":["bs-birs-2026"]}]},{"id":"noise","name":{"en":"Noise and traffic","de":"Lärm und Verkehr"},"short":{"en":"Noise & traffic","de":"Lärm & Verkehr"},"grade":"C–","verdict":{"en":"Years past a federal deadline on road noise, and no series of measured noise levels to show where Basel stands.","de":"Jahre nach Ablauf einer Bundesfrist zum Strassenlärm, und keine Reihe gemessener Lärmpegel, die zeigt, wo Basel steht."},"metrics":[{"value":{"en":"63%","de":"63 %"},"label":{"en":"Share of city and cantonal roads with Tempo 30, meeting zones or pedestrian zones, as stated by the canton in 2026","de":"Anteil der Gemeinde- und Kantonsstrassen mit Tempo 30, Begegnungs- oder Fussgängerzonen, gemäss Kanton 2026"},"sources":["bs-tempo30-page"]},{"value":{"en":"9,631,209","de":"9’631’209"},"label":{"en":"EuroAirport passengers in 2025 (2019: 9,090,312)","de":"Passagiere am EuroAirport 2025 (2019: 9’090’312)"},"sources":["eap-stat-2025"]}],"charts":["calming"],"truth":{"text":{"en":"Basel-Stadt voted 56% against motorway expansion in 2024. Federal planning has put the Rheintunnel back on the list anyway. The canton's Tempo 30 extension, meant to meet a legal duty overdue since 2018, is still before the Grand Council. Since 1 October 2026, federal law also requires an expert report showing that Tempo 30 on main roads does not divert traffic into residential streets. Federal law allows road-noise exposure to be calculated instead of measured, and this audit found no published series of measured noise levels for Basel-Stadt.","de":"Basel-Stadt stimmte 2024 mit 56 % gegen den Autobahnausbau. Die Bundesplanung hat den Rheintunnel trotzdem wieder auf die Liste gesetzt. Die kantonale Ausweitung von Tempo 30, die eine seit 2018 überfällige Rechtspflicht erfüllen soll, liegt noch beim Grossen Rat. Seit dem 1. Oktober 2026 verlangt das Bundesrecht zudem ein Gutachten, das zeigt, dass Tempo 30 auf Hauptstrassen keinen Ausweichverkehr in Wohnquartiere auslöst. Das Bundesrecht erlaubt, die Strassenlärmbelastung zu berechnen statt zu messen, und diese Bilanz fand keine veröffentlichte Reihe gemessener Lärmpegel für Basel-Stadt."},"sources":["bs-abst-2024","uvek-v45-2026","bs-mm-tempo30-2026","astra-schilliger-2026","lsv-38"]},"upgrades":[{"text":{"en":"Introduce the planned night-time Tempo 30 immediately. It needs signs, not construction, and courts have upheld noise-based Tempo 30 orders.","de":"Das geplante Nacht-Tempo-30 sofort einführen. Es braucht Signale, keine Bauarbeiten, und Gerichte haben lärmbegründete Tempo-30-Anordnungen bestätigt."},"sources":["bs-mm-tempo30-2026","bger-1c-318-2024"]},{"text":{"en":"Hold the government to the conditions it set in March 2026 for supporting the Rheintunnel: tangible gains for residents, flanking measures such as urban greenery, space for walking and cycling and unsealing, and a limited construction burden. Make them binding before construction is approved.","de":"Die Regierung auf die Bedingungen verpflichten, die sie im März 2026 für eine Unterstützung des Rheintunnels formuliert hat: spürbarer Mehrwert für die Bevölkerung, flankierende Massnahmen wie Stadtgrün, Raum für Fuss- und Veloverkehr und Entsiegelung sowie eine begrenzte Baubelastung. Diese Bedingungen verbindlich machen, bevor der Bau bewilligt wird."},"sources":["rr-rheintunnel-2026"]},{"text":{"en":"Commission the diversion reports now required by federal law for each main-road section together with the noise reports, so that the new requirement does not delay remediation further.","de":"Die neu vom Bundesrecht verlangten Gutachten zum Ausweichverkehr für jeden Hauptstrassenabschnitt zusammen mit den Lärmgutachten in Auftrag geben, damit die neue Anforderung die Sanierung nicht weiter verzögert."},"sources":["astra-schilliger-2026"]},{"text":{"en":"Publish measured noise levels from permanent stations on the busiest roads, so that remediation can be checked against measurements rather than models.","de":"Gemessene Lärmpegel von festen Stationen an den meistbefahrenen Strassen veröffentlichen, damit sich die Sanierung an Messungen statt an Modellen überprüfen lässt."},"sources":["lsv-38"]}]}],"charts":{"waste-origin":{"type":"stack","title":{"en":"Where the waste burned in Basel comes from, 2025","de":"Woher der in Basel verbrannte Abfall stammt, 2025"},"note":{"en":"Tonnes of waste delivered to the Basel incinerator (KVA) in 2025, by origin, as reported by IWB. «Other» combines the report's rows for Aargau, the Fricktal and Laufental-Schwarzbubenland waste associations, Solothurn and various suppliers.","de":"2025 an die Kehrichtverwertungsanlage (KVA) Basel gelieferte Tonnen Abfall nach Herkunft, gemäss IWB. «Übrige» fasst die Zeilen des Berichts für Aargau, die Abfallverbände Fricktal und Laufental-Schwarzbubenland, Solothurn und diverse Anlieferer zusammen."},"unit":"t","segments":[{"label":{"en":"Basel-Stadt","de":"Basel-Stadt"},"value":52986,"tone":"ink"},{"label":{"en":"Basel-Landschaft","de":"Basel-Landschaft"},"value":92058,"tone":"g1"},{"label":{"en":"Germany (district of Lörrach)","de":"Deutschland (Landkreis Lörrach)"},"value":32832,"tone":"g2"},{"label":{"en":"Other","de":"Übrige"},"value":49202,"tone":"g3"}],"sources":["iwb-kva-2025"]},"hot-days":{"type":"columns","title":{"en":"Hot days (30 °C or more) in Basel, June to August","de":"Hitzetage (30 °C und mehr) in Basel, Juni bis August"},"note":{"en":"MeteoSwiss station Basel/Binningen, homogenised series. The normal is the sum of MeteoSwiss's monthly normals for June, July and August. In 2026 there were 62 hot days up to 27 September.","de":"MeteoSchweiz-Station Basel/Binningen, homogenisierte Reihe. Der Normwert ist die Summe der Monatsnormwerte von MeteoSchweiz für Juni, Juli und August. 2026 gab es bis zum 27. September 62 Hitzetage."},"unit":{"en":"days","de":"Tage"},"valueLabel":{"en":"Days of 30 °C or more","de":"Tage mit 30 °C und mehr"},"bars":[{"label":{"en":"Normal 1991–2020","de":"Normwert 1991–2020"},"value":13.6,"digits":1,"tone":"base","sources":["meteoswiss-normwerte"]},{"label":{"en":"2003","de":"2003"},"value":41,"tone":"mid","sources":["nbcn-binningen"]},{"label":{"en":"2018","de":"2018"},"value":24,"tone":"mid","sources":["nbcn-binningen"]},{"label":{"en":"2026","de":"2026"},"value":52,"tone":"bad","sources":["nbcn-binningen"]}],"sources":["nbcn-binningen","meteoswiss-normwerte","meteoswiss-jja-2026"]},"trees":{"type":"dots","title":{"en":"Trees on public ground in the city of Basel, 2025","de":"Bäume auf öffentlichem Grund in der Stadt Basel, 2025"},"note":{"en":"One dot is ten trees. Trees maintained by the Stadtgärtnerei in parks, streets and public grounds of the city of Basel. Planting includes replacements; felling includes routine, emergency and construction felling. The stock was 23,784 at the end of 2023 and 24,436 at the end of 2025.","de":"Ein Punkt entspricht zehn Bäumen. Von der Stadtgärtnerei gepflegte Bäume in Parks, Strassen und öffentlichen Anlagen der Stadt Basel. Pflanzungen einschliesslich Ersatz; Fällungen einschliesslich regulärer, Not- und Baufällungen. Der Bestand betrug Ende 2023 23’784 und Ende 2025 24’436 Bäume."},"perDot":10,"unit":{"en":"Trees","de":"Bäume"},"rows":[{"label":{"en":"Planted in 2025","de":"Gepflanzt 2025"},"value":478,"tone":"good","sources":["stg-baeume-2025"]},{"label":{"en":"Felled in 2025","de":"Gefällt 2025"},"value":378,"tone":"bad","sources":["stg-baeume-2025"]}],"sources":["stg-baeume-2025"]},"legacy-sites":{"type":"sites","title":{"en":"Two sites, measured and classified","de":"Zwei Standorte, gemessen und eingestuft"},"note":{"en":"Status and measurements as published by the cantonal and federal environmental offices.","de":"Stand und Messwerte gemäss den Veröffentlichungen der kantonalen und eidgenössischen Umweltämter."},"sites":[{"name":{"en":"Klybeck","de":"Klybeck"},"place":{"en":"Basel-Stadt, former chemical works between the Rhine and the Wiese","de":"Basel-Stadt, ehemalige Chemie-Werkareale zwischen Rhein und Wiese"},"rows":[{"k":{"en":"Register status","de":"Katastereintrag"},"v":{"en":"Work areas 1, 2 and 3/6 «contaminated, requiring monitoring»; one site in area 3 requires remediation","de":"Werkareale 1, 2 und 3/6 «belastet, überwachungsbedürftig»; ein Standort auf Areal 3 sanierungsbedürftig"},"sources":["bs-klybeck","rr-klybeck-2025"]},{"k":{"en":"Benzidine, May 2024","de":"Benzidin, Mai 2024"},"v":{"en":"1.6 ng/l at well 725; below 0. te":{"en":"Toxicity-weighted sum of nine PFAS in ng TEQ/l, logarithmic scale. The canton's map shows 31 sampling points; the chart shows the five highest and the lowest. 14 of the 31 are above the federal concentration value of 50 ng TEQ/l applied in the 2024 assessment. From 2025 the canton applies a proposed federal value of 200 ng TEQ/l.","de":"Toxizitätsgewichtete Summe von neun PFAS in ng TEQ/l, logarithmische Skala. Die Karte des Kantons zeigt 31 Messstellen; die Grafik zeigt die fünf höchsten und die tiefste. 14 der 31 liegen über dem Konzentrationswert des Bundes von 50 ng TEQ/l, der in der Beurteilung 2024 angewandt wurde. Ab 2025 wendet der Kanton einen vorgeschlagenen Wert des Bundes von 200 ng TEQ/l an."},"min":1,"max":100000,"unit":"ng TEQ/l","items":[{"label":{"en":"Well F_1438","de":"Messstelle F_1438"},"to":11000,"tone":"bad","sources":["aue-pfas-gw-2024"]},{"label":{"en":"Well F_1044","de":"Messstelle F_1044"},"to":1300,"tone":"bad","sources":["aue-pfas-gw-2024"]},{"label":{"en":"Well F_0726","de":"Messstelle F_0726"},"to":400,"tone":"bad","sources":["aue-pfas-gw-2024"]},{"label":{"en":"Well F_0725","de":"Messstelle F_0725"},"to":320,"tone":"bad","sources":["aue-pfas-gw-2024"]},{"label":{"en":"Well F_0741","de":"Messstelle F_0741"},"to":150,"tone":"bad","sources":["aue-pfas-gw-2024"]},{"label":{"en":"Danacher spring (lowest)","de":"Danacherquelle (tiefster Wert)"},"to":5.1,"tone":"good","sources":["aue-pfas-gw-2024"]},{"label":{"en":"Federal concentration value applied in 2024","de":"Konzentrationswert des Bundes, 2024 angewandt"},"to":50,"tone":"base","sources":["aue-pfas-gw-2024"]}],"sources":["aue-pfas-gw-2024","aue-pfas-gw-2025"]}},"politics":{"title":{"en":"What voters approved, and what they rejected","de":"Was die Stimmberechtigten annahmen und was sie ablehnten"},"lead":{"en":"Basel votes for ambitious targets and against new motorways, but not for giving up street space. The result is a status quo defended from both sides.","de":"Basel stimmt für ehrgeizige Ziele und gegen neue Autobahnen, aber nicht dafür, Strassenraum abzugeben. Das Ergebnis ist ein Status quo, der von beiden Seiten verteidigt wird."},"votes":[{"date":"2022-11-27","label":{"en":"Net zero by 2037 (counter-proposal)","de":"Netto-Null bis 2037 (Gegenvorschlag)"},"kind":{"en":"Target","de":"Ziel"},"yes":64.1,"sources":["bs-abst-2022"]},{"date":"2022-11-27","label":{"en":"Net zero by 2030 (initiative)","de":"Netto-Null bis 2030 (Initiative)"},"kind":{"en":"Target","de":"Ziel"},"yes":56.72,"note":{"en":"Lost the tie-break to 2037","de":"Unterlag in der Stichfrage gegen 2037"},"sources":["bs-abst-2022"]},{"date":"2023-11-26","label":{"en":"Turn 5% of street space into greenery","de":"5 % der Strassenfläche begrünen"},"kind":{"en":"Measure","de":"Massnahme"},"yes":43.12,"sources":["bs-abst-2023"]},{"date":"2023-11-26","label":{"en":"Turn 5% of street space over to walking, cycling and transit","de":"5 % der Strassenfläche für Fuss-, Velo- und öffentlichen Verkehr"},"kind":{"en":"Measure","de":"Massnahme"},"yes":40.35,"sources":["bs-abst-2023"]},{"date":"2024-11-24","label":{"en":"National motorway expansion incl. Rheintunnel (Basel-Stadt result)","de":"Nationaler Autobahnausbau inkl. Rheintunnel (Resultat Basel-Stadt)"},"kind":{"en":"Road building","de":"Strassenbau"},"yes":43.57,"sources":["bs-abst-2024"]}]},"timeline":[{"date":"2018-03-31","label":{"en":"Federal deadline for road-noise remediation passes","de":"Bundesfrist für die Strassenlärmsanierung läuft ab"},"sources":["rr-laerm-2018"]},{"date":"2019-01-01","precision":"year","label":{"en":"Basel-Stadt declares a climate emergency","de":"Basel-Stadt ruft den Klimanotstand aus"},"sources":["bs-strategie-2023"]},{"date":"2022-11-27","label":{"en":"Voters put net zero by 2037 into the constitution","de":"Die Stimmberechtigten schreiben Netto-Null 2037 in die Verfassung"},"sources":["bs-abst-2022"]},{"date":"2023-11-26","label":{"en":"Voters reject both street-space initiatives","de":"Die Stimmberechtigten lehnen beide Strassenraum-Initiativen ab"},"sources":["bs-abst-2023"]},{"date":"2024-05-01","precision":"month","label":{"en":"Klybeck: carcinogenic benzidine measured in groundwater, 1.6 ng/l at one well","de":"Klybeck: krebserregendes Benzidin im Grundwasser gemessen, 1,6 ng/l an einer Messstelle"},"sources":["aue-benzidin-2024"]},{"date":"2024-11-24","label":{"en":"Motorway expansion rejected nationally; Basel-Stadt 56% against","de":"Autobahnausbau national abgelehnt; Basel-Stadt 56 % dagegen"},"sources":["bs-abst-2024"]},{"date":"2025-09-11","label":{"en":"Canton launches its public climate portal","de":"Der Kanton lanciert sein öffentliches Klimaportal"},"sources":["bs-mm-klimaportal"]},{"date":"2025-12-01","precision":"month","label":{"en":"Feldreben landfill in Muttenz: remediation works begin","de":"Deponie Feldreben in Muttenz: Sanierungsarbeiten beginnen"},"sources":["bl-feldreben"]},{"date":"2026-01-28","label":{"en":"Federal Council puts the Rheintunnel back in the 2045 horizon","de":"Der Bundesrat nimmt den Rheintunnel wieder in den Horizont 2045 auf"},"sources":["rr-rheintunnel-2026"]},{"date":"2026-03-27","label":{"en":"Federal Supreme Court upholds noise-based Tempo 30 on cantonal roads in three Basel-Landschaft towns","de":"Das Bundesgericht bestätigt lärmbegründetes Tempo 30 auf Kantonsstrassen in drei Baselbieter Gemeinden"},"sources":["bger-1c-318-2024","bl-tempo30-bger"]},{"date":"2026-03-31","label":{"en":"Government proposes Tempo 30 on 50 more kilometres","de":"Die Regierung schlägt Tempo 30 auf 50 weiteren Kilometern vor"},"sources":["bs-mm-tempo30-2026","bs-tempo30-page"]},{"date":"2026-06-24","label":{"en":"Birs and Wiese closed to bathing, entry and fishing to protect fish from heat stress","de":"Birs und Wiese zum Schutz der Fische vor Hitzestress für Baden, Betreten und Fischen gesperrt"},"sources":["bs-mm-sperre-2026"]},{"date":"2026-08-31","precision":"season","label":{"en":"Hottest summer since Swiss records began in 1864; 39.7 °C in Basel-Binningen","de":"Heissester Sommer seit Messbeginn 1864; 39,7 °C in Basel-Binningen"},"sources":["meteoswiss-jja-2026","nbcn-binningen"]},{"date":"2026-09-23","label":{"en":"Grand Council refers a cantonal initiative for a federal PFAS levy","de":"Der Grosse Rat überweist eine Standesinitiative für eine Bundesabgabe auf PFAS"},"sources":["gr-pfas-abgabe-2026"]},{"date":"2026-10-01","label":{"en":"Amended federal signalling rules: Tempo 30 on main roads needs proof of no diversion into residential streets","de":"Geänderte Signalisationsverordnung: Tempo 30 auf Hauptstrassen braucht den Nachweis, dass kein Ausweichverkehr in Quartiere entsteht"},"sources":["astra-schilliger-2026"]},{"date":"2027-01-01","precision":"year","display":{"en":"From 2027","de":"Ab 2027"},"label":{"en":"IWB begins switching off the gas grid in stages","de":"Die IWB beginnen, das Gasnetz etappenweise stillzulegen"},"sources":["iwb-fokus-2025"]},{"date":"2027-06-01","precision":"season","display":{"en":"Summer–autumn 2027","de":"Sommer/Herbst 2027"},"label":{"en":"Federal parliament expected to debate the 2045 transport programme, incl. Rheintunnel","de":"Das Bundesparlament berät voraussichtlich das Verkehrsprogramm 2045, inkl. Rheintunnel"},"sources":["rr-dreirosen-2026"]},{"date":"2027-12-31","precision":"year","display":{"en":"End of 2027","de":"Ende 2027"},"label":{"en":"Feasibility study on carbon capture at the Basel incinerator due","de":"Machbarkeitsstudie zur CO2-Abscheidung an der Basler KVA fällig"},"sources":["rr-ccs-2025"]},{"date":"2030-12-31","precision":"year","display":{"en":"2030","de":"2030"},"label":{"en":"Cantonal administration to reach net zero on its direct emissions","de":"Die Kantonsverwaltung soll bei ihren direkten Emissionen Netto-Null erreichen"},"sources":["bs-klimaschutz"]},{"date":"2031-01-01","label":{"en":"Federal CCS framework law planned to take effect","de":"Geplantes Inkrafttreten eines Bundesrahmengesetzes zu CCS"},"sources":["rr-ccs-2025"]},{"date":"2037-12-31","precision":"year","display":{"en":"2037","de":"2037"},"label":{"en":"Net zero on cantonal territory; gas grid switched off","de":"Netto-Null auf Kantonsgebiet; Gasnetz stillgelegt"},"sources":["bs-strategie-2023","iwb-fokus-2025"]},{"date":"2045-12-31","precision":"year","display":{"en":"2045","de":"2045"},"label":{"en":"Rheintunnel realisation horizon","de":"Realisierungshorizont Rheintunnel"},"sources":["rr-rheintunnel-2026"]}],"legal":[{"title":{"en":"Who pays for Klybeck","de":"Wer bezahlt im Klybeck?"},"law":{"en":"Art. 32d and Art. 32d bis para. 3 USG (SR 814.01); AltlV (SR 814.680); BGE 139 II 106; BGE 144 II 332","de":"Art. 32d und Art. 32d bis Abs. 3 USG (SR 814.01); AltlV (SR 814.680); BGE 139 II 106; BGE 144 II 332"},"body":{"en":"Remediation costs fall primarily on those whose conduct caused the contamination; at Klybeck that points to the chemical companies that ran the works, whose successors BASF and Novartis sold the site. An owner who merely holds the land bears a small share at most, and none if it could not have known of the contamination with due care; the Federal Supreme Court has held a 10% share excessive for such an owner absent special circumstances. According to the cantonal government, the buyers, Swiss Life and Rhystadt, received all existing contamination reports before the sale. Selling or dividing a parcel listed in the contaminated-sites register has required a permit since 2014.","de":"Die Sanierungskosten tragen in erster Linie jene, die die Belastung durch ihr Verhalten verursacht haben; im Klybeck weist das auf die Chemieunternehmen, die die Werke betrieben, deren Nachfolgerinnen BASF und Novartis das Areal verkauften. Wer das Grundstück bloss innehat, trägt höchstens einen kleinen Anteil und keinen, wenn er die Belastung bei gebotener Sorgfalt nicht kennen konnte; das Bundesgericht hielt für einen solchen Eigentümer 10 % ohne besondere Umstände für übersetzt. Nach Angaben der Regierung erhielten die Käuferinnen Swiss Life und Rhystadt vor dem Verkauf alle vorhandenen Belastungsberichte. Die Veräusserung oder Teilung eines im Kataster eingetragenen Grundstücks ist seit 2014 bewilligungspflichtig."},"work":{"en":"Buyers, lenders and investors carry the risk of a cost-allocation ruling, which any party responsible can request (Art. 32d para. 4 USG). Contamination findings are therefore a pricing and contract question, not only a planning one.","de":"Käufer, Kreditgeber und Investoren tragen das Risiko einer Kostenverteilungsverfügung, die jeder Verursacher verlangen kann (Art. 32d Abs. 4 USG). Belastungsbefunde werden damit zur Preis- und Vertragsfrage, nicht nur zur Planungsfrage."},"sources":["rr-klybeck-2025","bs-klybeck"]},{"title":{"en":"Carbon storage has no domestic legal path yet","de":"Für die CO2-Speicherung fehlt im Inland der Rechtsweg"},"law":{"en":"Art. 3 para. 5 and Art. 6 KlG (SR 814.310); Art. 14 KlV (SR 814.310.1); Art. 55 para. 1bis CO2 Ordinance (SR 641.711); planned federal CCS framework law","de":"Art. 3 Abs. 5 und Art. 6 KlG (SR 814.310); Art. 14 KlV (SR 814.310.1); Art. 55 Abs. 1bis CO2-Verordnung (SR 641.711); geplantes Bundesrahmengesetz zu CCS"},"body":{"en":"Captured CO2 destined for disposal counts as waste. It may be exported for permanent geological storage in an approved European site, which the CO2 Ordinance has credited since 2025, but only with a waste-law export permit and a bilateral agreement; Switzerland signed one with Norway in 2025. There is no permit regime for storing CO2 underground in Switzerland and no law on CO2 pipelines. A framework law is planned to take effect on 1 January 2031. Federal aid for new technologies can cover up to half of eligible costs, and federal and cantonal authorities must make carbon storage available by 2050.","de":"Abgeschiedenes CO2, das entsorgt werden soll, gilt als Abfall. Es darf zur dauerhaften geologischen Speicherung in eine bewilligte europäische Lagerstätte exportiert werden, was die CO2-Verordnung seit 2025 anrechnet, aber nur mit abfallrechtlicher Exportbewilligung und bilateralem Abkommen; mit Norwegen hat die Schweiz 2025 eines unterzeichnet. Für eine Speicherung im Schweizer Untergrund fehlt ein Bewilligungsregime, für CO2-Leitungen ein Gesetz. Ein Rahmengesetz soll am 1. Januar 2031 in Kraft treten. Bundesbeiträge für neuartige Technologien können bis zur Hälfte der anrechenbaren Kosten decken, und Bund und Kantone müssen bis 2050 Kohlenstoffspeicher verfügbar machen."},"work":{"en":"Until storage in Switzerland is lawful, capture at the incinerator can be planned and subsidised but depends on export by rail and ship. Cost sharing with the cantons and regions that send waste has to be negotiated.","de":"Solange die Speicherung in der Schweiz nicht zulässig ist, lässt sich die Abscheidung an der KVA planen und fördern, bleibt aber auf den Export per Bahn und Schiff angewiesen. Die Kostenteilung mit den Kantonen und Regionen, die Abfall liefern, muss ausgehandelt werden."},"sources":["rr-ccs-2025"]},{"title":{"en":"Road noise is an overdue duty","de":"Die Strassenlärmsanierung ist überfällig"},"law":{"en":"Art. 16 USG; Art. 13 and Art. 17 para. 4 lit. b LSV (SR 814.41); Art. 108 SSV (SR 741.21), as amended on 12 August 2026 with effect from 1 October 2026; BGer 1C_318/2024 of 27 March 2026; BGer 1C_513/2022 of 7 July 2023","de":"Art. 16 USG; Art. 13 und Art. 17 Abs. 4 lit. b LSV (SR 814.41); Art. 108 SSV (SR 741.21), geändert am 12. August 2026 mit Wirkung ab 1. Oktober 2026; BGer 1C_318/2024 vom 27. März 2026; BGer 1C_513/2022 vom 7. Juli 2023"},"body":{"en":"The deadline for remediating noise from main and other roads passed on 31 March 2018. On 27 March 2026 the Federal Supreme Court dismissed, insofar as it was admissible, an appeal by the TCS section of both Basel cantons and a resident against Tempo 30 on cantonal roads in Bottmingen, Oberwil and Therwil. It had upheld Tempo 30 on Basel's Feldbergstrasse in 2023. The Basel-Stadt government nevertheless says blanket Tempo 30 would conflict with federal law, and proceeds road by road. Since 1 October 2026, the expert report for Tempo 30 on traffic-oriented roads must also show that the reduction does not cause unwanted diversion into residential areas. The Federal Council's announcement does not say how this applies to procedures already under way.","de":"Die Frist zur Sanierung des Lärms von Haupt- und übrigen Strassen lief am 31. März 2018 ab. Am 27. März 2026 wies das Bundesgericht eine Beschwerde der TCS-Sektion beider Basel und eines Anwohners gegen Tempo 30 auf Kantonsstrassen in Bottmingen, Oberwil und Therwil ab, soweit es darauf eintrat. Bereits 2023 hatte es Tempo 30 auf der Basler Feldbergstrasse bestätigt. Die Basler Regierung hält flächendeckendes Tempo 30 dennoch für bundesrechtswidrig und geht Strasse für Strasse vor. Seit dem 1. Oktober 2026 muss das Gutachten für Tempo 30 auf verkehrsorientierten Strassen zudem zeigen, dass die Temporeduktion keinen «unerwünschten Ausweichverkehr» in Wohnquartiere verursacht. Wie das auf laufende Verfahren anzuwenden ist, sagt die Mitteilung des Bundesrates nicht."},"work":{"en":"Residents along roads above the noise limits can ask the authorities to act. Road users can appeal speed orders, but courts have upheld them where limits are exceeded and the expert report required by Art. 108 SSV is sound.","de":"Anwohnende von Strassen über den Lärmgrenzwerten können von den Behörden Massnahmen verlangen. Verkehrsteilnehmende können Temporeduktionen anfechten, doch Gerichte haben sie bestätigt, wo Grenzwerte überschritten sind und das Gutachten nach Art. 108 SSV trägt."},"sources":["rr-laerm-2018","bger-1c-318-2024","bger-1c-513-2022","bs-mm-tempo30-2026","astra-schilliger-2026"]},{"title":{"en":"PFAS across a treaty border","de":"PFAS über eine Vertragsgrenze hinweg"},"law":{"en":"Franco-Swiss treaty on Basel-Mulhouse Airport of 4 July 1949 (SR 0.748.131.934.92), Art. 6; Drinking Water Ordinance TBDV (SR 817.022.11); polluter-pays principle (Art. 2 USG)","de":"Französisch-schweizerischer Staatsvertrag vom 4. Juli 1949 über den Flughafen Basel-Mülhausen (SR 0.748.131.934.92), Art. 6; Trinkwasserverordnung TBDV (SR 817.022.11); Verursacherprinzip (Art. 2 USG)"},"body":{"en":"The binational airport lies on French soil; under Art. 6 of the 1949 treaty, French law applies throughout the airport area unless the treaty provides otherwise. Swiss drinking-water law currently sets limits for single PFAS substances. The EU-aligned limit of 100 ng/l for the sum of 20 PFAS is planned but was not in force on 28 September 2026.","de":"Der binationale Flughafen liegt auf französischem Boden; nach Art. 6 des Staatsvertrags von 1949 gilt im ganzen Flughafengebiet französisches Recht, soweit der Vertrag nichts anderes vorsieht. Das Schweizer Trinkwasserrecht kennt heute Höchstwerte für einzelne PFAS. Der an die EU angelehnte Höchstwert von 100 ng/l für die Summe von 20 PFAS ist geplant, war am 28. September 2026 aber nicht in Kraft."},"work":{"en":"Holding a polluter liable for any contamination that originates on the airport site raises questions of jurisdiction, applicable law and the airport's treaty status. On 23 September 2026 the Grand Council referred, on first reading, a cantonal initiative asking the federal parliament for a levy on PFAS to fund remediation.","de":"Einen Verursacher für eine Belastung haftbar zu machen, die vom Flughafengelände ausgeht, würde Fragen der Zuständigkeit, des anwendbaren Rechts und des Status des Flughafens nach dem Staatsvertrag aufwerfen. Am 23. September 2026 hat der Grosse Rat eine Standesinitiative erstmals überwiesen, die vom Bundesparlament eine Abgabe auf PFAS zur Finanzierung von Sanierungen verlangt."},"sources":["bl-eap-2024","bafu-naqua-pfas","gr-pfas-abgabe-2026"]},{"title":{"en":"Can anyone enforce net zero 2037?","de":"Kann jemand Netto-Null 2037 durchsetzen?"},"law":{"en":"§ 15 para. 2 and § 16a para. 2 Constitution of Basel-Stadt (SG 111.100); ECtHR (Grand Chamber), Verein KlimaSeniorinnen Schweiz and Others v. Switzerland, no. 53600/20, 9 April 2024, § 502","de":"§ 15 Abs. 2 und § 16a Abs. 2 Verfassung des Kantons Basel-Stadt (SG 111.100); EGMR (Grosse Kammer), Verein KlimaSeniorinnen Schweiz u. a. gegen die Schweiz, Nr. 53600/20, 9. April 2024, § 502"},"body":{"en":"§ 16a para. 2 obliges the canton, within its competences, to bring emissions on its territory to net zero in all sectors by 2037; § 15 para. 2 commits it to contribute, within its means, to keeping global warming below 1.5 °C. Both qualifiers weigh against enforceable individual claims. A search of opencaselaw.ch on 28 September 2026 found no decision construing § 16a. The Strasbourg court recognised standing for associations to bring Convention claims against the state; that does not create standing under cantonal law.","de":"§ 16a Abs. 2 verpflichtet den Kanton, «im Rahmen seiner Kompetenzen» dafür zu sorgen, dass die Treibhausgasemissionen auf Kantonsgebiet in allen Sektoren bis 2037 auf Netto-Null sinken; nach § 15 Abs. 2 trägt er «nach seinen Möglichkeiten» dazu bei, dass die Erwärmung 1,5 °C nicht übersteigt. Beide Vorbehalte sprechen gegen durchsetzbare individuelle Ansprüche. Eine Suche auf opencaselaw.ch am 28. September 2026 ergab keinen Entscheid, der § 16a auslegt. Der Strassburger Gerichtshof anerkannte die Beschwerdebefugnis von Verbänden für Konventionsrügen gegen den Staat; eine Legitimation nach kantonalem Recht folgt daraus nicht."},"work":{"en":"The target binds the canton, but it is unclear who could take it to court. Standing, not the substance of the target, is the likely obstacle.","de":"Das Ziel bindet den Kanton, aber es ist offen, wer es vor Gericht bringen könnte. Hürde ist voraussichtlich die Legitimation, nicht der Inhalt des Ziels."},"sources":["kv-bs","egmr-klimaseniorinnen"]}],"method":{"rubric":[{"grade":"A","meaning":{"en":"Meets health-based benchmarks and legal deadlines; on track.","de":"Erfüllt gesundheitsbasierte Richtwerte und gesetzliche Fristen; auf Kurs."}},{"grade":"B","meaning":{"en":"Broadly compliant with a credible plan; minor gaps.","de":"Weitgehend rechtskonform mit glaubwürdigem Plan; kleinere Lücken."}},{"grade":"C","meaning":{"en":"Targets set, but outcomes lag or depend on unproven measures.","de":"Ziele gesetzt, aber die Ergebnisse hinken nach oder hängen von unerprobten Massnahmen ab."}},{"grade":"D","meaning":{"en":"Material unresolved harm, or legal deadlines missed.","de":"Erhebliche ungelöste Schäden oder verpasste gesetzliche Fristen."}},{"grade":"F","meaning":{"en":"Deteriorating with no credible plan.","de":"Verschlechterung ohne glaubwürdigen Plan."}}],"notes":[{"en":"Letter grades run from A (best) to F.","de":"Buchstabennoten von A (beste) bis F, nicht die Schweizer Schulnoten 1 bis 6."},{"en":"Plus and minus mark the position within a band. The overall grade is a judgment, not an average.","de":"Plus und Minus zeigen die Lage innerhalb einer Stufe. Die Gesamtnote ist eine Einschätzung, kein Durchschnitt."},{"en":"Data years differ: heating counts are from September 2026, weather from 2026, air from 2025, groundwater and fish from 2024 and 2025. Each figure shows its year and source.","de":"Die Datenjahre unterscheiden sich: Heizungszählungen vom September 2026, Wetter von 2026, Luft von 2025, Grundwasser und Fische von 2024 und 2025. Jede Zahl nennt ihr Jahr und ihre Quelle."},{"en":"Every figure is a value that an official body measured or counted. Estimates, projections, modelled values, costs and press or advocacy figures are excluded; the build refuses any figure that cites a non-official source. Legal limits, guidelines and targets appear only as labelled reference values.","de":"Jede Zahl ist ein Wert, den eine amtliche Stelle gemessen oder gezählt hat. Schätzungen, Prognosen, modellierte Werte, Kosten sowie Zahlen aus Presse oder Interessenvertretungen sind ausgeschlossen; der Build lehnt jede Zahl ab, die eine nicht amtliche Quelle zitiert. Grenz-, Richt- und Zielwerte erscheinen nur als gekennzeichnete Referenzwerte."},{"en":"No own measurements were taken. Where this audit adds up official counts (hot days per summer, the June to August normal, the waste segment “Other”), the parts are official and the sum is stated as such.","de":"Es wurden keine eigenen Messungen durchgeführt. Wo diese Bilanz amtliche Zählungen addiert (Hitzetage pro Sommer, der Normwert Juni bis August, das Abfallsegment «Übrige»), sind die Teile amtlich und die Summe als solche ausgewiesen."},{"en":"The canton's greenhouse gas inventory is not shown: it is calculated from energy statistics and emission factors, and the latest published year is 2022. Noise is shown without a noise level, because no published series of measured levels was found.","de":"Das Treibhausgasinventar des Kantons wird nicht gezeigt: Es wird aus Energiestatistiken und Emissionsfaktoren berechnet, und das neuste veröffentlichte Jahr ist 2022. Lärm erscheint ohne Lärmpegel, weil keine veröffentlichte Reihe gemessener Pegel gefunden wurde."},{"en":"Recommendations under 'What would raise the grade' are this audit's analysis, not the canton's plans.","de":"Die Empfehlungen unter «Was die Note verbessern würde» sind Analyse dieser Bilanz, nicht Pläne des Kantons."}]},"changelog":[{"date":"2026-09-29","text":{"en":"Strict edition: only values measured or counted by official bodies. Removed all estimates, projections, costs and press or advocacy figures, including the per-capita footprint estimate on which the previous thesis rested. New measured series on heating systems, hot days, air quality, groundwater PFAS and river temperature.","de":"Strenge Ausgabe: nur Werte, die amtliche Stellen gemessen oder gezählt haben. Alle Schätzungen, Prognosen, Kosten sowie Zahlen aus Presse oder Interessenvertretungen entfernt, auch die Schätzung des Pro-Kopf-Fussabdrucks, auf der die bisherige These beruhte. Neue Messreihen zu Heizungen, Hitzetagen, Luftqualität, PFAS im Grundwasser und Flusstemperatur."}},{"date":"2026-09-28","text":{"en":"First public edition, in English and German. Figures and legal references checked against primary sources on 28 September 2026.","de":"Erste öffentliche Ausgabe, auf Englisch und Deutsch. Zahlen und Rechtsgrundlagen am 28. September 2026 an den Primärquellen überprüft."}}],"sources":[{"id":"bs-strategie-2023","type":"official","publisher":"Regierungsrat Basel-Stadt","date":"2023-09-26","title":"Gemeinsam Netto-Null 2037 erreichen: Regierungsrat verabschiedet die kantonale Klimaschutzstrategie","url":"https://www.bs.ch/medienmitteilungen/2023-gemeinsam-netto-null-2037-erreichen-regierungsrat-verabschiedet-die-kantonale-klimaschutzstrategie"},{"id":"bs-klimaschutz","type":"official","publisher":"Kanton Basel-Stadt","date":"2025-07","title":"Massnahmen für den Klimaschutz","url":"https://www.bs.ch/schwerpunkte/klima/klimaschutz"},{"id":"bs-mm-klimaportal","type":"official","publisher":"Kanton Basel-Stadt","date":"2025-09-11","title":"Mit einem Klimaportal macht der Kanton die Fortschritte im Klimaschutz transparent","url":"https://www.bs.ch/medienmitteilungen/2025-mit-einem-klimaportal-macht-der-kanton-basel-stadt-die-fortschritte-im-klimaschutz-transparent"},{"id":"rr-ccs-2025","type":"official","publisher":"Regierungsrat Basel-Stadt","date":"2025-09-17","title":"Bericht zum Anzug Leonhardt/Hanauer: CO2-Abscheidung bei der KVA der IWB (23.5299.02)","url":"https://grosserrat.bs.ch/dokumente/100410/000000410724.pdf"},{"id":"bs-abst-2022","type":"official","publisher":"Staatskanzlei Basel-Stadt","date":"2022-11-27","title":"Schlussresultat der kantonalen Abstimmung vom 27. November 2022","url":"https://www.bs.ch/medienmitteilungen/staatskanzlei/2022-schlussresultat-der-kantonalen-abstimmung-vom-27-november-2022"},{"id":"bs-abst-2023","type":"official","publisher":"Staatskanzlei Basel-Stadt","date":"2023-11-26","title":"Schlussresultat der kantonalen Abstimmung vom 2 (() => {

  /* ---------- Language ---------- */
  // Keep numbers with their units and currency codes on one line.
  const UNITS = '%|ha|°C|t|kt|km|m²|m|ng/l|µg/m³|Mio\\.|Mrd\\.|bn|days|Tage|years|Jahre|Jahren|properties|Liegenschaften|trees|Bäume';
  const NB_UNIT = new RegExp(`(\\d) (?=(?:${UNITS})(?![\\p{L}\\d]))`, 'gu');
  const MONTHS = LANG === 'de'
    ? '(?:Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)'
    : '(?:January|February|March|April|May|June|July|August|September|October|November|December)';
  const NB_DATE = new RegExp(`(\\b\\d{1,2}\\.?) (?=${MONTHS}\\b)`, 'g');
  // German puts a (non-breaking) space before the percent sign.
  const pctSpace = (t) => (LANG === 'de' ? t.replace(/(\d)%/g, '$1 %') : t);
  const typo = (s) => pctSpace(String(s)).replace(NB_DATE, '$1 ').replace(NB_UNIT, '$1 ').replace(/(^|[\s(])(CHF|EUR|Art\.|Abs\.|§|Nr\.|no\.|lit\.) (?=\S)/g, '$1$2 ');
  // A localised field is {en, de}; plain strings and numbers pass through.
  const L = (x) => {
    if (x == null) return '';
    if (typeof x === 'object' && !Array.isArray(x)) return typo(x[LANG] ?? x.en ?? '');
    return typeof x === 'string' ? typo(x) : x;
  };
  const LOCALE = LANG === 'de' ? 'de-CH' : 'en-GB';
  // Swiss style: apostrophe for thousands, decimal comma in running text.
  const fmtN = (n, digits = 0) => {
    const s = new Intl.NumberFormat(LOCALE, { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(n);
    return LANG === 'de' ? s.replace('.', ',') : s;
  };
  const pct = (n, digits = 0) => LANG === 'de' ? `${fmtN(n, digits)} %` : `${fmtN(n, digits)}%`;

  const UI = {
    en: {
      months: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
