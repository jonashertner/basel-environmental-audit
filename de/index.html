date":"2027-01-01","precision":"year","display":{"en":"From 2027","de":"Ab 2027"},"label":{"en":"IWB begins switching off the gas grid in stages","de":"Die IWB beginnen, das Gasnetz etappenweise stillzulegen"},"sources":["iwb-fokus-2025"]},{"date":"2027-06-01","precision":"season","display":{"en":"Summer–autumn 2027","de":"Sommer/Herbst 2027"},"label":{"en":"Federal parliament expected to debate the 2045 transport programme, incl. Rheintunnel","de":"Das Bundesparlament berät voraussichtlich das Verkehrsprogramm 2045, inkl. Rheintunnel"},"sources":["rr-dreirosen-2026"]},{"date":"2027-12-31","precision":"year","display":{"en":"End of 2027","de":"Ende 2027"},"label":{"en":"Feasibility study on carbon capture at the Basel incinerator due","de":"Machbarkeitsstudie zur CO2-Abscheidung an der Basler KVA fällig"},"sources":["rr-ccs-2025"]},{"date":"2030-12-31","precision":"year","display":{"en":"2030","de":"2030"},"label":{"en":"Cantonal administration to reach net zero on its direct emissions","de":"Die Kantonsverwaltung soll bei ihren direkten Emissionen Netto-Null erreichen"},"sources":["bs-klimaschutz"]},{"date":"2031-01-01","label":{"en":"Federal CCS framework law planned to take effect","de":"Geplantes Inkrafttreten eines Bundesrahmengesetzes zu CCS"},"sources":["rr-ccs-2025"]},{"date":"2037-12-31","precision":"year","display":{"en":"2037","de":"2037"},"label":{"en":"Net zero on cantonal territory; gas grid switched off","de":"Netto-Null auf Kantonsgebiet; Gasnetz stillgelegt"},"sources":["bs-strategie-2023","iwb-fokus-2025"]},{"date":"2045-12-31","precision":"year","display":{"en":"2045","de":"2045"},"label":{"en":"Rheintunnel realisation horizon","de":"Realisierungshorizont Rheintunnel"},"sources":["rr-rheintunnel-2026"]},{"date":"2026-04-23","label":{"en":"Deadline for the vehicle tax motion passes without a bill","de":"Frist der Motion zur Motorfahrzeugsteuer verstreicht ohne Vorlage"},"sources":["gr-23-5581"]},{"date":"2026-09-11","label":{"en":"Deadline for the government's report on the biodiversity initiative passes","de":"Frist für den Regierungsbericht zur Biodiversitätsinitiative verstreicht"},"sources":["rr-25-1737"]},{"date":"2026-10-23","label":{"en":"Government's report on raising canopy cover due","de":"Bericht der Regierung zur Erhöhung der Baumkronenbedeckung fällig"},"sources":["gr-24-5156"]},{"date":"2027-12-31","precision":"year","display":{"en":"2027","de":"2027"},"label":{"en":"First five-year climate target: 479,000 t CO2eq net; next canopy survey","de":"Erstes Fünfjahresziel Klima: netto 479’000 t CO2eq; nächste Kronenerhebung"},"sources":["bs-ks-teil1-2025","stg-kronen-ogd"]}],"legal":[{"title":{"en":"Who pays for Klybeck","de":"Wer bezahlt im Klybeck?"},"law":{"en":"Art. 32d and Art. 32d bis para. 3 USG (SR 814.01); AltlV (SR 814.680); BGE 139 II 106; BGE 144 II 332","de":"Art. 32d und Art. 32d bis Abs. 3 USG (SR 814.01); AltlV (SR 814.680); BGE 139 II 106; BGE 144 II 332"},"body":{"en":"Remediation costs fall primarily on those whose conduct caused the contamination; at Klybeck that points to the chemical companies that ran the works, whose successors BASF and Novartis sold the site. An owner who merely holds the land bears a small share at most, and none if it could not have known of the contamination with due care; the Federal Supreme Court has held a 10% share excessive for such an owner absent special circumstances. According to the cantonal government, the buyers, Swiss Life and Rhystadt, received all existing contamination reports before the sale. Selling or dividing a parcel listed in the contaminated-sites register has required a permit since 2014.","de":"Die Sanierungskosten tragen in erster Linie jene, die die Belastung durch ihr Verhalten verursacht haben; im Klybeck weist das auf die Chemieunternehmen, die die Werke betrieben, deren Nachfolgerinnen BASF und Novartis das Areal verkauften. Wer das Grundstück bloss innehat, trägt höchstens einen kleinen Anteil und keinen, wenn er die Belastung bei gebotener Sorgfalt nicht kennen konnte; das Bundesgericht hielt für einen solchen Eigentümer 10 % ohne besondere Umstände für übersetzt. Nach Angaben der Regierung erhielten die Käuferinnen Swiss Life und Rhystadt vor dem Verkauf alle vorhandenen Belastungsberichte. Die Veräusserung oder Teilung eines im Kataster eingetragenen Grundstücks ist seit 2014 bewilligungspflichtig."},"work":{"en":"Buyers, lenders and investors carry the risk of a cost-allocation ruling, which any party responsible can request (Art. 32d para. 4 USG). Contamination findings are therefore a pricing and contract question, not only a planning one.","de":"Käufer, Kreditgeber und Investoren tragen das Risiko einer Kostenverteilungsverfügung, die jeder Verursacher verlangen kann (Art. 32d Abs. 4 USG). Belastungsbefunde werden damit zur Preis- und Vertragsfrage, nicht nur zur Planungsfrage."},"sources":["rr-klybeck-2025","bs-klybeck"]},{"title":{"en":"Carbon storage has no domestic legal path yet","de":"Für die CO2-Speicherung fehlt im Inland der Rechtsweg"},"law":{"en":"Art. 3 para. 5 and Art. 6 KlG (SR 814.310); Art. 14 KlV (SR 814.310.1); Art. 55 para. 1bis CO2 Ordinance (SR 641.711); planned federal CCS framework law","de":"Art. 3 Abs. 5 und Art. 6 KlG (SR 814.310); Art. 14 KlV (SR 814.310.1); Art. 55 Abs. 1bis CO2-Verordnung (SR 641.711); geplantes Bundesrahmengesetz zu CCS"},"body":{"en":"Captured CO2 destined for disposal counts as waste. It may be exported for permanent geological storage in an approved European site, which the CO2 Ordinance has credited since 2025, but only with a waste-law export permit and a bilateral agreement; Switzerland signed one with Norway in 2025. There is no permit regime for storing CO2 underground in Switzerland and no law on CO2 pipelines. A framework law is planned to take effect on 1 January 2031. Federal aid for new technologies can cover up to half of eligible costs, and federal and cantonal authorities must make carbon storage available by 2050.","de":"Abgeschiedenes CO2, das entsorgt werden soll, gilt als Abfall. Es darf zur dauerhaften geologischen Speicherung in eine bewilligte europäische Lagerstätte exportiert werden, was die CO2-Verordnung seit 2025 anrechnet, aber nur mit abfallrechtlicher Exportbewilligung und bilateralem Abkommen; mit Norwegen hat die Schweiz 2025 eines unterzeichnet. Für eine Speicherung im Schweizer Untergrund fehlt ein Bewilligungsregime, für CO2-Leitungen ein Gesetz. Ein Rahmengesetz soll am 1. Januar 2031 in Kraft treten. Bundesbeiträge für neuartige Technologien können bis zur Hälfte der anrechenbaren Kosten decken, und Bund und Kantone müssen bis 2050 Kohlenstoffspeicher verfügbar machen."},"work":{"en":"Until storage in Switzerland is lawful, capture at the incinerator can be planned and subsidised but depends on export by rail and ship. Cost sharing with the cantons and regions that send waste has to be negotiated.","de":"Solange die Speicherung in der Schweiz nicht zulässig ist, lässt sich die Abscheidung an der KVA planen und fördern, bleibt aber auf den Export per Bahn und Schiff angewiesen. Die Kostenteilung mit den Kantonen und Regionen, die Abfall liefern, muss ausgehandelt werden."},"sources":["rr-ccs-2025"]},{"title":{"en":"Road noise is an overdue duty","de":"Die Strassenlärmsanierung ist überfällig"},"law":{"en":"Art. 16 USG; Art. 13 and Art. 17 para. 4 lit. b LSV (SR 814.41); Art. 108 SSV (SR 741.21), as amended on 12 August 2026 with effect from 1 October 2026; BGer 1C_318/2024 of 27 March 2026; BGer 1C_513/2022 of 7 July 2023","de":"Art. 16 USG; Art. 13 und Art. 17 Abs. 4 lit. b LSV (SR 814.41); Art. 108 SSV (SR 741.21), geändert am 12. August 2026 mit Wirkung ab 1. Oktober 2026; BGer 1C_318/2024 vom 27. März 2026; BGer 1C_513/2022 vom 7. Juli 2023"},"body":{"en":"The deadline for remediating noise from main and other roads passed on 31 March 2018. On 27 March 2026 the Federal Supreme Court dismissed, insofar as it was admissible, an appeal by the TCS section of both Basel cantons and a resident against Tempo 30 on cantonal roads in Bottmingen, Oberwil and Therwil. It had upheld Tempo 30 on Basel's Feldbergstrasse in 2023. The Basel-Stadt government nevertheless says blanket Tempo 30 would conflict with federal law, and proceeds road by road. From 1 October 2026, the expert report for Tempo 30 on traffic-oriented roads must also show that the reduction does not cause unwanted diversion into residential areas. The Federal Council's announcement does not say how this applies to procedures already under way.","de":"Die Frist zur Sanierung des Lärms von Haupt- und übrigen Strassen lief am 31. März 2018 ab. Am 27. März 2026 wies das Bundesgericht eine Beschwerde der TCS-Sektion beider Basel und eines Anwohners gegen Tempo 30 auf Kantonsstrassen in Bottmingen, Oberwil und Therwil ab, soweit es darauf eintrat. Bereits 2023 hatte es Tempo 30 auf der Basler Feldbergstrasse bestätigt. Die Basler Regierung hält flächendeckendes Tempo 30 dennoch für bundesrechtswidrig und geht Strasse für Strasse vor. Ab dem 1. Oktober 2026 muss das Gutachten für Tempo 30 auf verkehrsorientierten Strassen zudem zeigen, dass die Temporeduktion keinen «unerwünschten Ausweichverkehr» in Wohnquartiere verursacht. Wie das auf laufende Verfahren anzuwenden ist, sagt die Mitteilung des Bundesrates nicht."},"work":{"en":"Residents along roads above the noise limits can ask the authorities to act. Road users can appeal speed orders, but courts have upheld them where limits are exceeded and the expert report required by Art. 108 SSV is sound.","de":"Anwohnende von Strassen über den Lärmgrenzwerten können von den Behörden Massnahmen verlangen. Verkehrsteilnehmende können Temporeduktionen anfechten, doch Gerichte haben sie bestätigt, wo Grenzwerte überschritten sind und das Gutachten nach Art. 108 SSV trägt."},"sources":["rr-laerm-2018","bger-1c-318-2024","bger-1c-513-2022","bs-mm-tempo30-2026","astra-schilliger-2026"]},{"title":{"en":"PFAS across a treaty border","de":"PFAS über eine Vertragsgrenze hinweg"},"law":{"en":"Franco-Swiss treaty on Basel-Mulhouse Airport of 4 July 1949 (SR 0.748.131.934.92), Art. 6; Drinking Water Ordinance TBDV (SR 817.022.11); polluter-pays principle (Art. 2 USG)","de":"Französisch-schweizerischer Staatsvertrag vom 4. Juli 1949 über den Flughafen Basel-Mülhausen (SR 0.748.131.934.92), Art. 6; Trinkwasserverordnung TBDV (SR 817.022.11); Verursacherprinzip (Art. 2 USG)"},"body":{"en":"The binational airport lies on French soil; under Art. 6 of the 1949 treaty, French law applies throughout the airport area unless the treaty provides otherwise. Swiss drinking-water law currently sets limits for single PFAS substances. The EU-aligned limit of 100 ng/l for the sum of 20 PFAS is planned but was not in force on 28 September 2026.","de":"Der binationale Flughafen liegt auf französischem Boden; nach Art. 6 des Staatsvertrags von 1949 gilt im ganzen Flughafengebiet französisches Recht, soweit der Vertrag nichts anderes vorsieht. Das Schweizer Trinkwasserrecht kennt heute Höchstwerte für einzelne PFAS. Der an die EU angelehnte Höchstwert von 100 ng/l für die Summe von 20 PFAS ist geplant, war am 28. September 2026 aber nicht in Kraft."},"work":{"en":"Holding a polluter liable for any contamination that originates on the airport site raises questions of jurisdiction, applicable law and the airport's treaty status. On 23 September 2026 the Grand Council referred, on first reading, a cantonal initiative asking the federal parliament for a levy on PFAS to fund remediation.","de":"Einen Verursacher für eine Belastung haftbar zu machen, die vom Flughafengelände ausgeht, würde Fragen der Zuständigkeit, des anwendbaren Rechts und des Status des Flughafens nach dem Staatsvertrag aufwerfen. Am 23. September 2026 hat der Grosse Rat eine Standesinitiative erstmals überwiesen, die vom Bundesparlament eine Abgabe auf PFAS zur Finanzierung von Sanierungen verlangt."},"sources":["bl-eap-2024","bafu-naqua-pfas","gr-pfas-abgabe-2026"]},{"title":{"en":"Can anyone enforce net zero 2037?","de":"Kann jemand Netto-Null 2037 durchsetzen?"},"law":{"en":"§ 15 para. 2 and § 16a para. 2 Constitution of Basel-Stadt (SG 111.100); ECtHR (Grand Chamber), Verein KlimaSeniorinnen Schweiz and Others v. Switzerland, no. 53600/20, 9 April 2024, § 502","de":"§ 15 Abs. 2 und § 16a Abs. 2 Verfassung des Kantons Basel-Stadt (SG 111.100); EGMR (Grosse Kammer), Verein KlimaSeniorinnen Schweiz u. a. gegen die Schweiz, Nr. 53600/20, 9. April 2024, § 502"},"body":{"en":"§ 16a para. 2 obliges the canton, within its competences, to bring emissions on its territory to net zero in all sectors by 2037; § 15 para. 2 commits it to contribute, within its means, to keeping global warming below 1.5 °C. Both qualifiers weigh against enforceable individual claims. A search of opencaselaw.ch on 28 September 2026 found no decision construing § 16a. The Strasbourg court recognised standing for associations to bring Convention claims against the state; that does not create standing under cantonal law.","de":"§ 16a Abs. 2 verpflichtet den Kanton, «im Rahmen seiner Kompetenzen» dafür zu sorgen, dass die Treibhausgasemissionen auf Kantonsgebiet in allen Sektoren bis 2037 auf Netto-Null sinken; nach § 15 Abs. 2 trägt er «nach seinen Möglichkeiten» dazu bei, dass die Erwärmung 1,5 °C nicht übersteigt. Beide Vorbehalte sprechen gegen durchsetzbare individuelle Ansprüche. Eine Suche auf opencaselaw.ch am 28. September 2026 ergab keinen Entscheid, der § 16a auslegt. Der Strassburger Gerichtshof anerkannte die Beschwerdebefugnis von Verbänden für Konventionsrügen gegen den Staat; eine Legitimation nach kantonalem Recht folgt daraus nicht."},"work":{"en":"The target binds the canton, but it is unclear who could take it to court. Standing, not the substance of the target, is the likely obstacle.","de":"Das Ziel bindet den Kanton, aber es ist offen, wer es vor Gericht bringen könnte. Hürde ist voraussichtlich die Legitimation, nicht der Inhalt des Ziels."},"sources":["kv-bs","egmr-klimaseniorinnen"]}],"method":{"rubric":[{"grade":"A","meaning":{"en":"Meets health-based benchmarks and legal deadlines; on track.","de":"Erfüllt gesundheitsbasierte Richtwerte und gesetzliche Fristen; auf Kurs."}},{"grade":"B","meaning":{"en":"Broadly compliant with a credible plan; minor gaps.","de":"Weitgehend rechtskonform mit glaubwürdigem Plan; kleinere Lücken."}},{"grade":"C","meaning":{"en":"Targets set, but outcomes lag or depend on unproven measures.","de":"Ziele gesetzt, aber die Ergebnisse hinken nach oder hängen von unerprobten Massnahmen ab."}},{"grade":"D","meaning":{"en":"Material unresolved harm, or legal deadlines missed.","de":"Erhebliche ungelöste Schäden oder verpasste gesetzliche Fristen."}},{"grade":"F","meaning":{"en":"Deteriorating with no credible plan.","de":"Verschlechterung ohne glaubwürdigen Plan."}}],"notes":[{"en":"Letter grades run from A (best) to F.","de":"Buchstabennoten von A (beste) bis F, nicht die Schweizer Schulnoten 1 bis 6."},{"en":"Plus and minus mark the position within a band. The overall grade is a judgment, not an average.","de":"Plus und Minus zeigen die Lage innerhalb einer Stufe. Die Gesamtnote ist eine Einschätzung, kein Durchschnitt."},{"en":"Data years differ: heating counts are from September 2026, weather from 2026, air from 2025, groundwater and fish from 2024 and 2025. Each figure shows its year and source.","de":"Die Datenjahre unterscheiden sich: Heizungszählungen vom September 2026, Wetter von 2026, Luft von 2025, Grundwasser und Fische von 2024 und 2025. Jede Zahl nennt ihr Jahr und ihre Quelle."},{"en":"Every figure comes from an official source and carries its basis: measured, counted, official calculation, or derived from official data (key below). Estimates, projections, costs, averages carried over from elsewhere (such as the Swiss average per-capita footprint applied to Basel) and press or advocacy figures are left out. The build refuses any figure that cites a non-official source or lacks a basis. Legal limits, guidelines and targets appear only as labelled reference values.","de":"Jede Zahl stammt aus einer amtlichen Quelle und nennt ihre Grundlage: gemessen, gezählt, amtlich berechnet oder aus amtlichen Daten abgeleitet (Legende unten). Schätzungen, Prognosen, Kosten, von anderswo übertragene Durchschnittswerte (etwa der Schweizer Pro-Kopf-Fussabdruck, auf Basel übertragen) sowie Zahlen aus Presse oder Interessenvertretungen sind weggelassen. Der Build lehnt jede Zahl ab, die eine nicht amtliche Quelle zitiert oder keine Grundlage nennt. Grenz-, Richt- und Zielwerte erscheinen nur als gekennzeichnete Referenzwerte."},{"en":"No own measurements were taken. Where this audit adds up or subtracts official figures (hot days over a summer, the waste segment “Other”, the years between two official dates), the parts are official and the result is labelled as derived.","de":"Es wurden keine eigenen Messungen durchgeführt. Wo diese Bilanz amtliche Zahlen addiert oder subtrahiert (Hitzetage eines Sommers, das Abfallsegment «Übrige», die Jahre zwischen zwei amtlichen Daten), sind die Teile amtlich und das Ergebnis ist als abgeleitet gekennzeichnet."},{"en":"The canton's greenhouse gas inventory is an official calculation from energy statistics and emission factors. Its latest published year is 2022; the canton announces the next edition, with 2024 data, for 2026. Figures from 2020 on follow the method of the 2023 climate protection strategy and are not compared here with older inventories. Road-noise exposure is likewise the canton's calculation from its noise emission cadastre, as federal law allows; no series of measured noise levels is published.","de":"Das Treibhausgasinventar des Kantons ist eine amtliche Berechnung aus Energiestatistik und Emissionsfaktoren. Sein neustes veröffentlichtes Jahr ist 2022; die nächste Ausgabe mit Daten von 2024 kündigt der Kanton für 2026 an. Die Zahlen ab 2020 folgen der Methode der Klimaschutzstrategie von 2023 und werden hier nicht mit älteren Inventaren verglichen. Auch die Strassenlärmbelastung ist eine Berechnung des Kantons aus seinem Lärm-Emissionskataster, wie es das Bundesrecht erlaubt; eine Reihe gemessener Lärmpegel ist nicht veröffentlicht."},{"en":"Recommendations under 'What would raise the grade' are this audit's analysis, not the canton's plans.","de":"Die Empfehlungen unter «Was die Note verbessern würde» sind Analyse dieser Bilanz, nicht Pläne des Kantons."},{"en":"'What works' compares Basel with official evidence reviews and with other cities' official records. The status of each measure is this audit's judgment. Comparison cities were chosen because their authorities publish what they did; figures from foundations, advocacy groups or press were left out, which excludes some well-known examples. Parts of a measure that state only a rule, target or date carry no basis mark.","de":"«Was wirkt» vergleicht Basel mit amtlichen Evidenzauswertungen und mit amtlichen Angaben anderer Städte. Der Stand jeder Massnahme ist die Beurteilung dieser Bilanz. Vergleichsstädte wurden gewählt, weil ihre Behörden veröffentlichen, was sie getan haben; Zahlen von Stiftungen, Interessengruppen oder Presse blieben weg, was einige bekannte Beispiele ausschliesst. Teile einer Massnahme, die nur eine Regel, ein Ziel oder ein Datum nennen, tragen keine Grundlagenmarke."},{"en":"'Open obligations' lists only duties with a deadline set by federal or cantonal law or by a Grand Council decision, checked against the Grand Council's records on 29 September 2026. It is not a complete audit of every duty; where the record did not establish a breach, the item was left out.","de":"«Offene Pflichten» führt nur Pflichten mit einer Frist aus Bundes- oder kantonalem Recht oder aus einem Beschluss des Grossen Rates auf, geprüft anhand der Geschäftsdatenbank des Grossen Rates am 29. September 2026. Es ist keine vollständige Prüfung aller Pflichten; wo die Akten keine Verletzung belegten, blieb der Punkt weg."}],"basis":[{"id":"measured","label":{"en":"Measured","de":"Gemessen"},"text":{"en":"Measured by an official body, or a statistic it forms directly from its measurements, such as an annual mean, a count of hot days or a 30-year normal.","de":"Von einer amtlichen Stelle gemessen oder direkt aus ihren Messungen gebildet, etwa ein Jahresmittel, eine Zahl von Hitzetagen oder ein 30-jähriger Normwert."}},{"id":"counted","label":{"en":"Counted","de":"Gezählt"},"text":{"en":"Counted by an official body: registers, permits, site inventories, trees, passengers and votes.","de":"Von einer amtlichen Stelle gezählt: Register, Bewilligungen, Kataster, Bäume, Passagiere und Stimmen."}},{"id":"official","label":{"en":"Official calculation","de":"Amtlich berechnet"},"text":{"en":"Calculated by an official body by its own published method, such as the canton's greenhouse gas inventory, a canopy cover or a share of the road network.","de":"Von einer amtlichen Stelle nach eigener, veröffentlichter Methode berechnet, etwa das Treibhausgasinventar des Kantons, eine Kronenbedeckung oder ein Anteil am Strassennetz."}},{"id":"derived","label":{"en":"Derived from official data","de":"Aus amtlichen Daten abgeleitet"},"text":{"en":"Calculated by this audit from official figures alone, by adding or subtracting them. The chart or note says how.","de":"Von dieser Bilanz allein aus amtlichen Zahlen berechnet, durch Addieren oder Subtrahieren. Grafik oder Anmerkung sagen, wie."}},{"id":"assessed","label":{"en":"Assessed evidence","de":"Geprüfte Evidenz"},"text":{"en":"A finding or range from an official review of many studies, by an intergovernmental or federal body such as the IPCC, WHO, the EEA or BAFU. It says what a measure achieves in general, not what it has achieved in Basel.","de":"Ein Befund oder eine Bandbreite aus einer amtlichen Auswertung vieler Studien, durch eine zwischenstaatliche oder eidgenössische Stelle wie IPCC, WHO, EUA oder BAFU. Er sagt, was eine Massnahme allgemein bewirkt, nicht was sie in Basel bewirkt hat."}}]},"changelog":[{"date":"2026-09-29","text":{"en":"Every figure now states its basis: measured, counted, official calculation, or derived from official data. Official calculations are admitted: the canton's greenhouse gas inventory and target path are back in the climate section, and its calculated road-noise exposure is new in the noise section, whose grade falls from C– to D+. Quieter citations, fewer figures per section and a lighter layout.","de":"Jede Zahl nennt nun ihre Grundlage: gemessen, gezählt, amtlich berechnet oder aus amtlichen Daten abgeleitet. Amtliche Berechnungen sind zugelassen: Das Treibhausgasinventar des Kantons und sein Absenkpfad sind zurück im Klimateil, und die vom Kanton berechnete Strassenlärmbelastung ist neu im Lärmteil, dessen Note von C– auf D+ sinkt. Ruhigere Quellenangaben, weniger Zahlen pro Abschnitt und ein leichteres Layout."}},{"date":"2026-09-29","text":{"en":"Strict edition: only values measured or counted by official bodies. Removed all estimates, projections, costs and press or advocacy figures, including the per-capita footprint estimate on which the previous thesis rested. New measured series on heating systems, hot days, air quality, groundwater PFAS and river temperature.","de":"Strenge Ausgabe: nur Werte, die amtliche Stellen gemessen oder gezählt haben. Alle Schätzungen, Prognosen, Kosten sowie Zahlen aus Presse oder Interessenvertretungen entfernt, auch die Schätzung des Pro-Kopf-Fussabdrucks, auf der die bisherige These beruhte. Neue Messreihen zu Heizungen, Hitzetagen, Luftqualität, PFAS im Grundwasser und Flusstemperatur."}},{"date":"2026-09-28","text":{"en":"First public edition, in English and German. Figures and legal references checked against primary sources on 28 September 2026.","de":"Erste öffentliche Ausgabe, auf Englisch und Deutsch. Zahlen und Rechtsgrundlagen am 28. September 2026 an den Primärquellen überprüft."}},{"date":"2026-09-29","text":{"en":"New section «What works»: fifteen heat measures benchmarked against official evidence reviews and other cities, with Basel's status. New section «Open obligations». New basis «assessed evidence». Heat area revised: outdated recommendation on a canopy target replaced, open-space figure added.","de":"Neuer Abschnitt «Was wirkt»: fünfzehn Hitzemassnahmen, gemessen an amtlichen Evidenzauswertungen und anderen Städten, mit dem Stand in Basel. Neuer Abschnitt «Offene Pflichten». Neue Grundlage «geprüfte Evidenz». Bereich Hitze überarbeitet: veraltete Empfehlung zu einem Kronenziel ersetzt, Freiflächen-Kennzahl ergänzt."}}],"sources":[{"id":"bs-strategie-2023","type":"official","publisher":"Regierungsrat Basel-Stadt","date":"2023-09-26","title":"Gemeinsam Netto-Null 2037 erreichen: Regierungsrat verabschiedet die kantonale Klimaschutzstrategie","url":"https://www.bs.ch/medienmitteilungen/2023-gemeinsam-netto-null-2037-erreichen-regierungsrat-verabschiedet-die-kantonale-klimaschutzstrategie"},{"id":"bs-klimaschutz","type":"official","publisher":"Kanton Basel-Stadt","date":"2025-07","title":"Massnahmen für den Klimaschutz","url":"https://www.bs.ch/schwerpunkte/klima/klimaschutz"},{"id":"bs-mm-klimaportal","type":"official","publisher":"Kanton Basel-Stadt","date":"2025-09-11","title":"Mit einem Klimaportal macht der Kanton die Fortschritte im Klimaschutz transparent","url":"https://www.bs.ch/medienmitteilungen/2025-mit-einem-klimaportal-macht-der-kanton-basel-stadt-die-fortschritte-im-klimaschutz-transparent"},{"id":"rr-ccs-2025","type":"official","publisher":"Regierungsrat Basel-Stadt","date":"2025-09-17","title":"Bericht zum Anzug Leonhardt/Hanauer: CO2-Abscheidung bei der KVA der IWB (23.5299.02)","url":"https://grosserrat.bs.ch/dokumente/100410/000000410724.pdf"},{"id":"bs-abst-2022","type":"official","publisher":"Staatskanzlei Basel-Stadt","date":"2022-11-27","title":"Schlussresultat der kantonalen Abstimmung vom 27. November 2022","url":"https:/ //www.bger.ch/ext/eurospider/live/de/php/aza/http/index.php?lang=de&type=show_document&highlight_docid=aza://03-07-2025-1C_191-2025"},{"id":"bs-gewaesserraum","type":"official","publisher":"Amt für Umwelt und Energie Basel-Stadt","date":"2026","title":"Gewässerschutz und Revitalisierung: Festlegung des Gewässerraums","url":"https://www.bs.ch/wsu/aue/abteilung-gewaesser-und-boden/gewaesserschutz-und-revitalisierung"},{"id":"gschv-ueb-2011","type":"official","publisher":"Schweizerische Eidgenossenschaft (Fedlex)","date":"2026-01-01","title":"Gewässerschutzverordnung (GSchV, SR 814.201), Übergangsbestimmungen zur Änderung vom 4. Mai 2011","url":"https://www.fedlex.admin.ch/eli/cc/1998/2863_2863_2863/de"},{"id":"lsv-17","type":"official","publisher":"Schweizerische Eidgenossenschaft (Fedlex)","date":"2026-04-01","title":"Lärmschutz-Verordnung (LSV, SR 814.41), Art. 17 Fristen für Sanierungen","url":"https://www.fedlex.admin.ch/eli/cc/1987/338_338_338/de#art_17"},{"id":"berlin-bff","type":"official","publisher":"Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt Berlin","date":"n.d.","title":"Der Biotopflächenfaktor: Ihr ökologisches Planungsinstrument","url":"https://www.berlin.de/sen/uvk/_assets/natur-gruen/landschaftsplanung/bff-biotopflaechenfaktor/broschuere_bff_als_oekologisches_planungsinstrument.pdf"}],"measures":{"title":{"en":"What works, and where Basel stands","de":"Was wirkt, und wo Basel steht"},"lead":{"en":"Fifteen measures against summer heat, ordered from protecting people to regenerating the living systems that cool a city. For each: what official reviews of the evidence say, a city that does it well or instructively, and where Basel-Stadt stands.","de":"Fünfzehn Massnahmen gegen Sommerhitze, geordnet vom Schutz der Menschen bis zur Regeneration der lebendigen Systeme, die eine Stadt kühlen. Zu jeder: was amtliche Auswertungen der Evidenz sagen, eine Stadt, die es gut oder lehrreich macht, und wo Basel-Stadt steht."},"trajCaption":{"en":"Measures by stage and Basel's status","de":"Massnahmen nach Stufe und Stand in Basel"},"statusNote":{"en":"The status is this audit's comparison of Basel with the evidence and the examples, not an official rating. «Among the leaders» means Basel matches the best examples found; «Missing» means no instrument exists.","de":"Der Stand ist die Einschätzung dieser Bilanz aus dem Vergleich Basels mit der Evidenz und den Beispielen, keine amtliche Bewertung. «Unter den Vorreitern» heisst, Basel hält mit den besten gefundenen Beispielen mit; «Fehlt» heisst, es gibt kein Instrument."},"benefitsLabel":{"en":"Also helps","de":"Hilft auch"},"stages":[{"id":"protect","label":{"en":"Protect people","de":"Menschen schützen"},"text":{"en":"Get everyone through the hottest days: warnings, care for those at risk, cool places close by.","de":"Alle durch die heissesten Tage bringen: Warnungen, Betreuung der Gefährdeten, kühle Orte in der Nähe."}},{"id":"reduce","label":{"en":"Keep heat out","de":"Wärme vermeiden"},"text":{"en":"Stop streets and buildings from absorbing and storing heat: shade, surfaces, air flow.","de":"Verhindern, dass Strassen und Gebäude Wärme aufnehmen und speichern: Schatten, Oberflächen, Luftaustausch."}},{"id":"restore","label":{"en":"Restore living systems","de":"Lebendiges wiederherstellen"},"text":{"en":"Bring back trees, soil and water. Evaporation and shade from living things cool more than any material.","de":"Bäume, Boden und Wasser zurückbringen. Verdunstung und Schatten von Lebendigem kühlen stärker als jedes Material."}},{"id":"regenerate","label":{"en":"Regenerate","de":"Regenerieren"},"text":{"en":"Make every plot and street leave more nature than before, and measure whether it does.","de":"Jede Parzelle und jede Strasse soll mehr Natur hinterlassen als vorher, und das wird gemessen."}}],"status":[{"id":"lead","label":{"en":"Among the leaders","de":"Unter den Vorreitern"}},{"id":"partial","label":{"en":"In place, with gaps","de":"Vorhanden, mit Lücken"}},{"id":"behind","label":{"en":"Behind","de":"Im Rückstand"}},{"id":"missing","label":{"en":"Missing","de":"Fehlt"}}],"benefits":[{"id":"health","label":{"en":"Health","de":"Gesundheit"}},{"id":"water","label":{"en":"Water cycle","de":"Wasserkreislauf"}},{"id":"bio","label":{"en":"Biodiversity","de":"Biodiversität"}},{"id":"fair","label":{"en":"Fair access","de":"Gerechter Zugang"}},{"id":"carbon","label":{"en":"Climate protection","de":"Klimaschutz"}}],"items":[{"id":"heat-plan","stage":"protect","status":"partial","name":{"en":"Heat-health action plan","de":"Hitzeaktionsplan"},"evidence":{"text":{"en":"WHO Europe calls for more and broader heat-health action plans: warnings, care for people at risk, and long-term building and urban measures. The evidence that they save lives is thin: the Cochrane review WHO cites found only four studies, and the EEA judged the plans active in 2022 only partially effective.","de":"Die WHO Europa verlangt mehr und breitere Hitzeaktionspläne: Warnungen, Betreuung Gefährdeter sowie langfristige bauliche und städtische Massnahmen. Die Evidenz, dass sie Leben retten, ist dünn: Die von der WHO zitierte Cochrane-Übersicht fand nur vier Studien, und die EUA hielt die 2022 aktiven Pläne nur für teilweise wirksam."},"basis":"assessed","sources":["who-heat-2021","eea-heat-2024"]},"exemplar":{"text":{"en":"Switzerland as a whole: the share of heat deaths in all deaths from May to September fell by about 13% from 1980–2002 to 2004–2025, although the mean summer temperature rose by 1.4 °C. The federal estimate does not isolate what caused the fall.","de":"Die Schweiz insgesamt: Der Anteil der Hitzetoten an allen Todesfällen von Mai bis September sank von 1980–2002 bis 2004–2025 um rund 13 %, obwohl die mittlere Sommertemperatur um 1,4 °C stieg. Die Bundesschätzung weist nicht aus, worauf der Rückgang zurückgeht."},"basis":"official","sources":["bafu-hitzetote-2025"]},"basel":{"text":{"en":"Basel-Stadt has had a heat plan since 2021 and is one of 8 of 26 cantons that meet at least 5 of WHO's 8 core elements. Its heat hotline with Pro Senectute runs on weekdays only and only until the end of August. The federal estimate for 2025 is 13 heat deaths in Basel-Stadt (95% interval 10–17), 6.3 per 100,000 against 4.5 for Switzerland.","de":"Basel-Stadt hat seit 2021 einen Hitzeplan und gehört zu den 8 von 26 Kantonen, die mindestens 5 der 8 Kernelemente der WHO erfüllen. Das Hitzetelefon mit Pro Senectute läuft nur werktags und nur bis Ende August. Die Bundesschätzung für 2025 ergibt 13 Hitzetote in Basel-Stadt (95-%-Intervall 10–17), 6,3 pro 100’000 gegenüber 4,5 in der Schweiz."},"basis":["counted","official"],"sources":["nccs-hitzeschutz-2025","gd-hitze","bafu-hitzetote-2025"]},"benefits":["health","fair"]},{"id":"cool-rooms","stage":"protect","status":"behind","name":{"en":"Cool rooms within walking distance","de":"Kühle Räume in Gehdistanz"},"evidence":{"text":{"en":"No official review measures the lives saved by cool rooms. WHO notes weak evidence that outreach to frail older people and cooled wards reduce harm. Spain's first national guide (2026) sets a minimum standard: free entry, step-free access, about 27 °C, seating, drinking water and toilets.","de":"Keine amtliche Auswertung misst, wie viele Leben kühle Räume retten. Die WHO nennt schwache Evidenz dafür, dass aufsuchende Betreuung gebrechlicher älterer Menschen und gekühlte Stationen Schaden mindern. Der erste nationale Leitfaden Spaniens (2026) setzt einen Mindeststandard: freier Eintritt, stufenloser Zugang, etwa 27 °C, Sitzplätze, Trinkwasser und Toiletten."},"basis":"assessed","sources":["who-heat-2021","miteco-refugios-2026"]},"exemplar":{"text":{"en":"Barcelona: more than 500 climate shelters in 2026, over three quarters of them indoors. The city calculates that 99.5% of residents have one within a ten-minute walk, and 80.3% within five minutes.","de":"Barcelona: über 500 Klimaschutzräume im Jahr 2026, mehr als drei Viertel davon in Innenräumen. Die Stadt berechnet, dass 99,5 % der Bevölkerung einen innert zehn Gehminuten erreichen, 80,3 % innert fünf."},"basis":["counted","official"],"sources":["bcn-refugis-2026"]},"basel":{"text":{"en":"The health department publishes a list of cool rooms that it calls not exhaustive. There is no standard, no opening-hours commitment and no walking-distance analysis. IWB runs more than 200 public fountains.","de":"Das Gesundheitsdepartement veröffentlicht eine Liste kühler Räume, die es selbst als nicht abschliessend bezeichnet. Es gibt keinen Standard, keine Zusage zu Öffnungszeiten und keine Analyse der Gehdistanz. Die IWB betreiben über 200 öffentliche Brunnen."},"basis":"counted","sources":["gd-hitze"]},"benefits":["health","fair"]},{"id":"shade","stage":"reduce","status":"partial","name":{"en":"Shade where people walk and wait","de":"Schatten, wo Menschen gehen und warten"},"evidence":{"text":{"en":"Shade is the most effective measure against daytime heat stress: modelled perceived temperature in shade can be 20 degrees or more below that in sun. The federal guide prefers trees to sails and umbrellas, because trees also cool by evaporation.","de":"Schatten ist die wirksamste Massnahme gegen Hitzestress am Tag: Die modellierte gefühlte Temperatur im Schatten kann 20 Grad und mehr unter jener in der Sonne liegen. Der Leitfaden des Bundes zieht Bäume Sonnensegeln und Schirmen vor, weil Bäume zusätzlich durch Verdunstung kühlen."},"basis":"assessed","sources":["uba-klima-2022","bafu-hitze-2018"]},"exemplar":{"text":{"en":"Phoenix measured canopy per census tract (median 11%, range 2–30%) and in November 2024 adopted a funded plan: more than 27,000 trees and 550 shade structures in five years, with at least USD 60 million. Its own count is sobering: 32,968 trees planted on city land in 2010–2023, 21,222 lost.","de":"Phoenix hat die Kronenbedeckung pro Zensusgebiet gemessen (Median 11 %, Spanne 2–30 %) und im November 2024 einen finanzierten Plan beschlossen: über 27’000 Bäume und 550 Schattenstrukturen in fünf Jahren, mit mindestens 60 Millionen US-Dollar. Die eigene Zählung ernüchtert: 32’968 Bäume 2010–2023 auf städtischem Grund gepflanzt, 21’222 verloren."},"basis":["measured","counted"],"sources":["phx-shade-2024"]},"basel":{"text":{"en":"Where trees cannot grow, Basel placed mobile elements in 2025: 56 large planters at 14 sites, 71 umbrellas at 16 sites and mist sprayers at 12 sites. Useful at playgrounds and stops, but small against the 24.4% of the city's settlement area that is traffic space.","de":"Wo keine Bäume wachsen können, stellte Basel 2025 mobile Elemente auf: 56 grosse Pflanzgefässe an 14 Orten, 71 Sonnenschirme an 16 Orten und Sprühnebler an 12 Orten. Nützlich an Spielplätzen und Haltestellen, aber klein gegenüber den 24,4 % der Siedlungsfläche der Stadt, die Verkehrsfläche sind."},"basis":"counted","sources":["bs-controlling-2026"]},"benefits":["health","fair"]},{"id":"cool-surfaces","stage":"reduce","status":"missing","name":{"en":"Cool roofs and pavements","de":"Helle Dächer und Beläge"},"evidence":{"text":{"en":"Reflective roofs lower indoor temperatures; WHO cites a study estimating about 45 avoided heat deaths a year in New York City from much whiter roofs. The same review warns that reflective surfaces can raise ozone, and the IPCC notes that white surfaces soon turn grey.","de":"Reflektierende Dächer senken die Innentemperatur; die WHO zitiert eine Studie, die für New York City rund 45 vermiedene Hitzetote pro Jahr durch viel hellere Dächer schätzt. Dieselbe Auswertung warnt, dass reflektierende Flächen das Ozon erhöhen können, und der IPCC hält fest, dass weisse Flächen rasch vergrauen."},"basis":"assessed","sources":["who-heat-2021","ipcc-ar6-ch6"]},"exemplar":{"text":{"en":"Phoenix has coated more than 140 miles of streets since 2020. Measurements for the city found surfaces 10.5–12 °F (about 6–7 °C) cooler at midday, but air temperature only 0.13 °F lower on average, and more reflected heat on pedestrians at noon.","de":"Phoenix hat seit 2020 über 140 Meilen Strassen beschichtet. Messungen für die Stadt ergaben mittags 10,5–12 °F (etwa 6–7 °C) kühlere Oberflächen, aber eine im Mittel nur um 0,13 °F tiefere Lufttemperatur und mittags mehr reflektierte Wärme auf Fussgängerinnen und Fussgänger."},"basis":"measured","sources":["phx-coolpave"]},"basel":{"text":{"en":"No cool-roof or cool-pavement programme is on record. Given the weak effect on air temperature and the glare, this is the least urgent gap; Basel's green-roof rule already covers unused flat roofs.","de":"Es ist kein Programm für helle Dächer oder Beläge bekannt. Angesichts der schwachen Wirkung auf die Lufttemperatur und der Blendung ist dies die am wenigsten dringliche Lücke; Basels Gründachpflicht deckt ungenutzte Flachdächer bereits ab."},"sources":["bs-controlling-2026","bpg-bs"]},"benefits":["health"]},{"id":"cold-air","stage":"reduce","status":"behind","name":{"en":"Cold-air corridors","de":"Kaltluftschneisen"},"evidence":{"text":{"en":"Green areas of a hectare or more produce cold air at night that can flow over 1,000 m into the city. The federal guide calls for securing these air flows in planning, and Eawag ranks cold-air corridors, with irrigation, as the most effective cooling measures.","de":"Grünflächen ab etwa einer Hektare erzeugen nachts Kaltluft, die über 1’000 m weit in die Stadt fliessen kann. Der Leitfaden des Bundes empfiehlt, diese Luftströme planerisch zu sichern, und die Eawag stuft Kaltluftschneisen, zusammen mit Bewässerung, als wirksamste Kühlmassnahmen ein."},"basis":"assessed","sources":["bafu-hitze-2018","eawag-hitze-2021"]},"exemplar":{"text":{"en":"Stuttgart plans around its cold-air flows: a framework plan of 2007 aims to keep its hillside slopes largely open so that night air can reach the basin. It is informal planning, not a building ban.","de":"Stuttgart plant um seine Kaltluftströme herum: Ein Rahmenplan von 2007 soll die Halbhöhenlagen weitgehend offen halten, damit Nachtluft den Talkessel erreicht. Es ist informelle Planung, kein Bauverbot."},"sources":["stuttgart-rahmenplan"]},"basel":{"text":{"en":"A city climate analysis exists (2019), and large redevelopment sites are checked for air flow by microclimate modelling. But the canton has no reliable data on how well ventilation is being secured, and finds that the Rhine has no cooling effect at night.","de":"Es gibt eine Stadtklimaanalyse (2019), und grössere Areale werden mit Mikroklimamodellierungen auf ihre Durchlüftung geprüft. Belastbare Daten dazu, wie gut die Durchlüftung gesichert wird, hat der Kanton aber nicht, und er stellt fest, dass der Rhein nachts keine kühlende Wirkung hat."},"sources":["bs-controlling-2026"]},"benefits":["health"]},{"id":"canopy-target","stage":"restore","status":"behind","name":{"en":"A binding canopy target","de":"Ein verbindliches Kronenziel"},"evidence":{"text":{"en":"Measured air temperature under tree canopies is a few degrees lower than over open ground on sunny days; a simulation for Munich found over 7 °C. Mostly from shade, reinforced by evaporation.","de":"Unter Baumkronen ist die gemessene Lufttemperatur an sonnigen Tagen einige Grad tiefer als über offenen Flächen; eine Simulation für München ergab über 7 °C. Vor allem durch Schatten, verstärkt durch Verdunstung."},"basis":"assessed","sources":["bafu-hitze-2018"]},"exemplar":{"text":{"en":"Lausanne set 30% by 2040 in 2021 and measures it by LiDAR: its urban canopy grew from 20% in 2012 to 24.3% in 2024. Zurich aims for 25% by 2050, but its own measurements show a fall from 17% (2018) to 15% (2022).","de":"Lausanne setzte 2021 das Ziel von 30 % bis 2040 und misst es mit LiDAR: Die Kronenbedeckung der Stadt wuchs von 20 % im Jahr 2012 auf 24,3 % im Jahr 2024. Zürich strebt 25 % bis 2050 an, doch die eigenen Messungen zeigen einen Rückgang von 17 % (2018) auf 15 % (2022)."},"basis":"official","sources":["lausanne-canopee-2025","zh-baeume-2023"]},"basel":{"text":{"en":"15% of the city's settlement area without forest, unchanged since 2012. The controlling report names about 18% by 2040, but it comes from a parliamentary Anzug, which only obliges the government to report, by 23 October 2026. There is no binding target.","de":"15 % der Siedlungsfläche der Stadt ohne Wald, seit 2012 unverändert. Der Controllingbericht nennt rund 18 % bis 2040, doch das Ziel stammt aus einem Anzug, der die Regierung nur zu einem Bericht verpflichtet, fällig am 23. Oktober 2026. Ein verbindliches Ziel gibt es nicht."},"basis":"official","sources":["bs-controlling-2026","gr-24-5156"]},"benefits":["health","bio","water"]},{"id":"trees","stage":"restore","status":"partial","name":{"en":"More trees, with room to grow old","de":"Mehr Bäume, die alt werden können"},"evidence":{"text":{"en":"Street trees reach on average only a quarter of their potential lifespan, and large old trees give most of the shade. Rooting space and water in dry spells decide whether planting pays off.","de":"Strassenbäume erreichen im Mittel nur ein Viertel ihrer möglichen Lebensdauer, und grosse alte Bäume spenden den meisten Schatten. Wurzelraum und Wasser in Trockenzeiten entscheiden, ob sich eine Pflanzung lohnt."},"basis":"assessed","sources":["bafu-hitze-2018"]},"exemplar":{"text":{"en":"Singapore set out in 2020 to plant one million more trees by 2030, with residents. By April 2023 more than 500,000 were in the ground, and the parks board expects to finish three years early.","de":"Singapur nahm sich 2020 vor, bis 2030 eine Million zusätzliche Bäume zu pflanzen, zusammen mit der Bevölkerung. Bis April 2023 standen über 500’000, und die Parkbehörde rechnet mit einem Abschluss drei Jahre früher."},"basis":"counted","sources":["nparks-trees-2023"]},"basel":{"text":{"en":"Public trees rose from 26,660 in 2020 to 27,807 in 2024, a net gain of 1,147. The Grand Council asks for at least 2,000 more by 2037. There are no figures for trees on private land.","de":"Die öffentlichen Bäume nahmen von 26’660 im Jahr 2020 auf 27’807 im Jahr 2024 zu, netto 1’147. Der Grosse Rat verlangt mindestens 2’000 zusätzliche bis 2037. Für Bäume auf privatem Grund gibt es keine Zahlen."},"basis":"counted","sources":["bs-controlling-2026"]},"benefits":["bio","health","carbon"]},{"id":"green-roofs","stage":"restore","status":"lead","name":{"en":"Green roofs","de":"Begrünte Dächer"},"evidence":{"text":{"en":"The IPCC calls the cooling effect of green roofs highly variable. At street level they help only above several hundred square metres and up to about 10 m in height. Their larger value is rainwater retention and habitat.","de":"Der IPCC nennt die Kühlwirkung begrünter Dächer sehr unterschiedlich. Auf Strassenniveau wirken sie erst ab mehreren hundert Quadratmetern und bis etwa 10 m Höhe. Ihr grösserer Nutzen sind Regenrückhalt und Lebensraum."},"basis":"assessed","sources":["ipcc-ar6-ch6","bafu-hitze-2018"]},"exemplar":{"text":{"en":"Tokyo has required greening on new buildings since 2001: 20% of the roof on sites of 1,000 m² or more, 25% from 5,000 m². From 2000 to 2024, plans covered 2.9 million m² of roof, wall and balcony greening.","de":"Tokio verlangt seit 2001 Begrünung bei Neubauten: 20 % der Dachfläche auf Grundstücken ab 1’000 m², 25 % ab 5’000 m². Von 2000 bis 2024 umfassten die Pläne 2,9 Millionen m² Dach-, Wand- und Balkonbegrünung."},"basis":"counted","sources":["tokyo-roof"]},"basel":{"text":{"en":"Basel requires every unused flat roof to be covered with vegetation, not a share, and has done so for decades. Since April 2026 the rules ask for at least 15 cm of substrate and a seed mix of about 50 regional species, which makes the roofs habitats, not just mats.","de":"Basel verlangt, dass jedes ungenutzte Flachdach begrünt wird, nicht nur ein Anteil, und das seit Jahrzehnten. Seit April 2026 verlangt das Merkblatt mindestens 15 cm Substrat und eine Ansaat mit rund 50 regionalen Arten, was die Dächer zu Lebensräumen macht, nicht bloss zu Matten."},"sources":["bpg-bs","stg-flachdach-2026"]},"benefits":["water","bio"]},{"id":"facades","stage":"restore","status":"behind","name":{"en":"Green façades","de":"Begrünte Fassaden"},"evidence":{"text":{"en":"Measured air temperature within 0.6 m of a green façade was up to 1.3 °C lower than at a bare wall. Façades offer far more surface than roofs and shade the wall itself.","de":"Die gemessene Lufttemperatur innerhalb von 0,6 m vor einer begrünten Fassade lag bis zu 1,3 °C tiefer als vor einer kahlen Wand. Fassaden bieten weit mehr Fläche als Dächer und beschatten die Wand selbst."},"basis":"assessed","sources":["bafu-hitze-2018"]},"exemplar":{"text":{"en":"Singapore targeted 200 hectares of roof and vertical greenery by 2030 and passed it early: 229 ha after 36 ha were added in 2024.","de":"Singapur setzte sich 200 Hektaren Dach- und Vertikalbegrünung bis 2030 zum Ziel und übertraf es vorzeitig: 229 ha, nachdem 2024 36 ha hinzukamen."},"basis":"counted","sources":["nparks-skyrise-2025"]},"basel":{"text":{"en":"The canton has a feasibility study and has picked five pilot façades on its own buildings. The data work took longer than expected, and the canton says long-term funding for care and upkeep still has to be secured.","de":"Der Kanton hat eine Machbarkeitsstudie und fünf Pilotfassaden an eigenen Gebäuden ausgewählt. Die Datenarbeit dauerte länger als erwartet, und laut Kanton muss die langfristige Finanzierung von Pflege und Unterhalt erst gesichert werden."},"basis":"counted","sources":["bs-controlling-2026"]},"benefits":["bio","health"]},{"id":"unsealing","stage":"restore","status":"behind","name":{"en":"Unsealing","de":"Entsiegelung"},"evidence":{"text":{"en":"Full unsealing followed by planting has the best effect on the local climate of any surface measure; partial solutions such as grass pavers do less. Soil and groundwater must be checked for pollution first.","de":"Vollständige Entsiegelung mit anschliessender Begrünung hat unter den Oberflächenmassnahmen die beste Wirkung auf das Lokalklima; Teillösungen wie Rasengittersteine wirken weniger. Boden und Grundwasser sind vorher auf Belastungen zu prüfen."},"basis":"assessed","sources":["bafu-hitze-2018"]},"exemplar":{"text":{"en":"Bern made it law: since 1 January 2025 its climate adaptation regulation requires at least 10,000 m² of climate-effective area a year, 140,000 m² within ten years, counted as net unsealing weighted by effect. Vienna, working by programme rather than law, unsealed 111,600 m² from 2020 to June 2025.","de":"Bern hat es ins Recht geschrieben: Seit dem 1. Januar 2025 verlangt das Klimaanpassungsreglement mindestens 10’000 m² klimawirksame Fläche pro Jahr, 140’000 m² in zehn Jahren, gezählt als netto entsiegelte Fläche, gewichtet nach Wirkung. Wien entsiegelte ohne Gesetz, über Programme, von 2020 bis Juni 2025 111’600 m²."},"basis":"counted","sources":["bern-kar-2024","wien-kfp-2025"]},"basel":{"text":{"en":"4,477 m² were approved for unsealing in 2023 and 2024 together. A motion the Grand Council passed to the government asks for 165,000 m² by 2037; that would need about 11,800 m² a year from 2024 (165,000 m² spread over 14 years), more than five times the current pace.","de":"2023 und 2024 zusammen wurden 4’477 m² Entsiegelung bewilligt. Eine vom Grossen Rat überwiesene Motion verlangt 165’000 m² bis 2037; das erfordert ab 2024 rund 11’800 m² pro Jahr (165’000 m² auf 14 Jahre verteilt), mehr als das Fünffache des heutigen Tempos."},"basis":["counted","derived"],"sources":["bs-controlling-2026"]},"benefits":["water","bio","health"]},{"id":"green-space","stage":"restore","status":"behind","name":{"en":"Green space within 300 metres","de":"Grünraum in 300 Metern"},"evidence":{"text":{"en":"WHO Europe's rule of thumb is public green space of at least 0.5–1 hectare within 300 m of every home, about five minutes' walk.","de":"Die Faustregel der WHO Europa lautet: öffentlicher Grünraum von mindestens 0,5–1 Hektare innert 300 m jeder Wohnung, etwa fünf Gehminuten."},"basis":"assessed","sources":["who-green-2017"]},"exemplar":{"text":{"en":"Across Europe, fewer than half of city dwellers live within 300 m of a park. In Stockholm the share is above 80%, according to the EEA.","de":"In Europa lebt weniger als die Hälfte der Stadtbevölkerung innert 300 m eines Parks. In Stockholm liegt der Anteil laut EUA über 80 %."},"basis":"official","sources":["eea-green-2022"]},"basel":{"text":{"en":"Basel's own target is 9 m² of accessible open space per resident within 300 m. 31,367 of 179,517 residents of the city reach it, 17.5%; 25,651 have less than 1.5 m².","de":"Basels eigenes Ziel sind 9 m² zugängliche Freifläche pro Person innert 300 m. 31’367 von 179’517 Einwohnerinnen und Einwohnern der Stadt erreichen es, 17,5 %; 25’651 haben weniger als 1,5 m²."},"basis":["official","derived"],"sources":["bs-controlling-2026"]},"benefits":["health","fair","bio"]},{"id":"sponge","stage":"regenerate","status":"behind","name":{"en":"Sponge city","de":"Schwammstadt"},"evidence":{"text":{"en":"Evaporating water is the dominant cooling mechanism in a city, and greenery needs considerable water in dry spells. Keeping rainwater where it falls, in soil, trees and cisterns, serves both cooling and flood protection.","de":"Verdunstendes Wasser ist der wichtigste Kühlmechanismus in der Stadt, und Grün braucht in Trockenzeiten erhebliche Wassermengen. Regenwasser dort zu halten, wo es fällt, in Boden, Bäumen und Zisternen, dient der Kühlung und dem Hochwasserschutz zugleich."},"basis":"assessed","sources":["eawag-hitze-2021","bafu-hitze-2018"]},"exemplar":{"text":{"en":"Berlin limits the rainwater a new building may send to the sewer to 2 litres per second per hectare, so the rest must be kept on site. Copenhagen's cloudburst plan of 2012 foresaw about 300 surface projects; by December 2023, 19 were in use.","de":"Berlin begrenzt das Regenwasser, das ein Neubau in die Kanalisation leiten darf, auf 2 Liter pro Sekunde und Hektare; der Rest ist vor Ort zu halten. Kopenhagens Wolkenbruchplan von 2012 sah rund 300 Oberflächenprojekte vor; bis Dezember 2023 waren 19 in Betrieb."},"basis":"counted","sources":["berlin-brewa-2021","kk-skybrud-2023"]},"basel":{"text":{"en":"The first sponge-city streets are due to be built at VoltaNord from 2026. A two-year trial of permeable parking at Riehenring ended in 2024, and its evaluation is not yet published. There is no general limit on rainwater discharge from new buildings on record.","de":"Die ersten Schwammstadt-Strassen sollen ab 2026 im Areal VoltaNord gebaut werden. Ein zweijähriger Versuch mit sickerfähigen Parkplätzen am Riehenring endete 2024; die Auswertung ist noch nicht veröffentlicht. Eine allgemeine Begrenzung der Regenwassereinleitung bei Neubauten ist nicht bekannt."},"sources":["bs-controlling-2026"]},"benefits":["water","bio"]},{"id":"green-factor","stage":"regenerate","status":"missing","name":{"en":"A green factor for every plot","de":"Ein Grünfaktor für jede Parzelle"},"evidence":{"text":{"en":"Official reviews do not measure the cooling of a green factor as such. It works through what it secures: planted, unsealed ground, trees and green roofs on each plot, which the measures above show to be effective.","de":"Amtliche Auswertungen messen die Kühlung eines Grünfaktors nicht als solche. Er wirkt über das, was er sichert: bepflanzten, unversiegelten Boden, Bäume und Gründächer auf jeder Parzelle, deren Wirkung oben belegt ist."},"sources":["bafu-hitze-2018"]},"exemplar":{"text":{"en":"Singapore has required landscaping since 2018: 30–40% of the site area and a green plot ratio of 3.0–4.0, rising with density. Berlin has used a biotope area factor since 1990, with target values of 0.3 to 0.6 by use and density; it is binding only where a landscape plan sets it, on almost 5% of the city.","de":"Singapur verlangt seit 2018 Begrünung: 30–40 % der Grundstücksfläche und eine Grünflächenzahl von 3,0–4,0, steigend mit der Dichte. Berlin kennt seit 1990 den Biotopflächenfaktor, mit Zielwerten von 0,3 bis 0,6 je nach Nutzung und Dichte; verbindlich ist er nur, wo ein Landschaftsplan ihn festsetzt, auf fast 5 % der Stadtfläche."},"sources":["ura-lush-2017","berlin-bff"]},"basel":{"text":{"en":"Basel's building law requires two thirds of the area behind the building line to be garden, but not in zones 5, 6 and 7, the densest. It has no green factor or green area ratio.","de":"Basels Baugesetz verlangt, dass zwei Drittel der Fläche hinter der Baulinie Garten sind, aber nicht in den Zonen 5, 6 und 7, den dichtesten. Einen Grünfaktor oder eine Grünflächenziffer kennt es nicht."},"sources":["bpg-bs"]},"benefits":["water","bio","health"]},{"id":"net-gain","stage":"regenerate","status":"missing","name":{"en":"No net loss, then net gain","de":"Kein Nettoverlust, dann Nettogewinn"},"evidence":{"text":{"en":"The EU now requires no net loss of urban green space and tree canopy by 2030 against 2024, and a rising trend from 2031. It does not bind Switzerland, but sets the benchmark. Switzerland aims to consume no net soil by 2050.","de":"Die EU verlangt neu, dass Grünflächen und Baumkronen in Städten bis 2030 gegenüber 2024 nicht netto abnehmen und ab 2031 zunehmen. Die Schweiz ist daran nicht gebunden, aber es setzt den Massstab. Die Schweiz strebt an, bis 2050 netto keinen Boden mehr zu verbrauchen."},"sources":["eu-nrr-2024","bafu-bodenstrategie-2020"]},"exemplar":{"text":{"en":"England made it law: since February 2024 most new developments must leave biodiversity at least 10% higher than before, measured by a statutory metric and secured for 30 years.","de":"England hat es ins Recht geschrieben: Seit Februar 2024 müssen die meisten Neubauprojekte die Biodiversität um mindestens 10 % gegenüber vorher erhöhen, gemessen mit einer gesetzlichen Metrik und für 30 Jahre gesichert."},"sources":["uk-tcpa-7a"]},"basel":{"text":{"en":"The 2023 biodiversity strategy sets out measures but no quantified gain. A cantonal biodiversity initiative is pending: the government missed the 11 September 2026 deadline for its report and asks to extend it to June 2027.","de":"Die Biodiversitätsstrategie 2023 enthält Massnahmen, aber keinen bezifferten Gewinn. Eine kantonale Biodiversitätsinitiative ist hängig: Die Regierung verpasste die Frist für ihren Bericht vom 11. September 2026 und beantragt eine Verlängerung bis Juni 2027."},"sources":["rr-25-1737"]},"benefits":["bio","water"]},{"id":"monitoring","stage":"regenerate","status":"lead","name":{"en":"Measure canopy every few years","de":"Das Kronendach regelmässig messen"},"evidence":{"text":{"en":"A canopy target means little without repeated measurement of the same indicator. The EU regulation requires canopy to be measured every six years in each urban area.","de":"Ein Kronenziel bedeutet wenig ohne wiederholte Messung desselben Indikators. Die EU-Verordnung verlangt, das Kronendach in jedem städtischen Gebiet alle sechs Jahre zu messen."},"sources":["eu-nrr-2024"]},"exemplar":{"text":{"en":"Zurich flies LiDAR every four years, which is how it learned that its canopy lost 64 hectares between 2018 and 2022.","de":"Zürich misst alle vier Jahre per LiDAR-Befliegung und weiss daher, dass seine Kronenfläche zwischen 2018 und 2022 um 64 Hektaren abnahm."},"basis":"measured","sources":["zh-baeume-2023"]},"basel":{"text":{"en":"Basel measures canopy by LiDAR over the whole canton (2012, 2021, 2024), publishes the maps as open data and plans updates every three years, in 2027 and 2030.","de":"Basel misst das Kronendach per LiDAR über den ganzen Kanton (2012, 2021, 2024), veröffentlicht die Karten als offene Daten und plant alle drei Jahre eine Nachführung, 2027 und 2030."},"basis":"measured","sources":["stg-kronen-ogd","bs-controlling-2026"]},"benefits":["bio"]}]},"obligations":{"title":{"en":"Open obligations","de":"Offene Pflichten"},"lead":{"en":"Binding duties with a deadline, and whether they have been met. Only duties set by federal or cantonal law, or by a Grand Council decision with a deadline, count here; plans, strategies and self-commitments do not.","de":"Verbindliche Pflichten mit Frist, und ob sie erfüllt sind. Es zählen nur Pflichten aus Bundes- oder kantonalem Recht oder aus einem Beschluss des Grossen Rates mit Frist; Pläne, Strategien und Selbstverpflichtungen nicht."},"note":{"en":"Status as of 29 September 2026, checked against the Grand Council's records and the cited documents. A missed deadline for a motion or report has no legal sanction beyond parliamentary oversight. The federal record does not show Basel widely in breach: of the federal duties checked, most are met or not yet due.","de":"Stand 29. September 2026, geprüft anhand der Geschäftsdatenbank des Grossen Rates und der zitierten Dokumente. Eine verpasste Frist für eine Motion oder einen Bericht hat ausser der parlamentarischen Aufsicht keine rechtliche Folge. Die Bundesebene zeigt keine breite Pflichtverletzung Basels: Von den geprüften Bundespflichten sind die meisten erfüllt oder noch nicht fällig."},"status":[{"id":"open","label":{"en":"Not met","de":"Nicht erfüllt"}},{"id":"risk","label":{"en":"At risk","de":"Gefährdet"}},{"id":"late","label":{"en":"Met late","de":"Verspätet erfüllt"}}],"items":[{"id":"noise","status":"open","due":"2018-03-31","title":{"en":"Road-noise remediation","de":"Strassenlärmsanierung"},"law":{"en":"Art. 17 para. 4 lit. b LSV","de":"Art. 17 Abs. 4 lit. b LSV"},"body":{"en":"Roads above the noise limits had to be remediated by 31 March 2018. On the Grenzacherweg in Riehen, the canton ordered remediation only in September 2023; the municipality appealed, and in July 2025 the Federal Supreme Court told the cantonal instances to speed up the proceedings over a remediation that all of them consider urgent.","de":"Strassen über den Lärmgrenzwerten waren bis zum 31. März 2018 zu sanieren. Am Grenzacherweg in Riehen ordnete der Kanton die Sanierung erst im September 2023 an; die Gemeinde rekurrierte, und im Juli 2025 hielt das Bundesgericht die kantonalen Instanzen an, das Verfahren um die von allen als dringlich erachtete Sanierung beschleunigt abzuschliessen."},"sources":["lsv-17","bger-1c-191-2025"]},{"id":"vehicle-tax","status":"open","due":"2026-04-23","title":{"en":"Vehicle tax reform (Motion Fuhrer)","de":"Reform der Motorfahrzeugsteuer (Motion Fuhrer)"},"law":{"en":"Grand Council decision of 23 October 2024 on motion 23.5581","de":"Beschluss des Grossen Rates vom 23. Oktober 2024 zur Motion 23.5581"},"body":{"en":"The motion asks for a vehicle tax that no longer rewards vehicles with excessive resource use. The deadline passed on 23 April 2026 with no bill, interim report or extension on record. The government says a bill is in preparation and could take effect in 2030 at the earliest.","de":"Die Motion verlangt eine Motorfahrzeugsteuer ohne finanzielle Fehlanreize für Fahrzeuge mit übermässigem Ressourcenverbrauch. Die Frist lief am 23. April 2026 ab, ohne Vorlage, Zwischenbericht oder Fristerstreckung. Die Regierung erarbeitet nach eigenen Angaben eine Vorlage, die frühestens Anfang 2030 in Kraft treten könne."},"sources":["gr-23-5581","rr-26-5024"]},{"id":"nis","status":"open","due":"2024-12-31","dueDisplay":{"en":"yearly","de":"jährlich"},"title":{"en":"Yearly report on non-ionising radiation","de":"Jährlicher Bericht zur nichtionisierenden Strahlung"},"law":{"en":"§ 19b para. 1 USG BS","de":"§ 19b Abs. 1 USG BS"},"body":{"en":"The law requires a report to the Grand Council every year. The report on 2023 arrived in March 2026, and none exists yet for 2024 or 2025. The government cites staff turnover at its contractor and proposes to drop the yearly duty. The measured values were well within the limits.","de":"Das Gesetz verlangt jedes Jahr einen Bericht an den Grossen Rat. Der Bericht zum Jahr 2023 kam im März 2026, für 2024 und 2025 liegt noch keiner vor. Die Regierung nennt Personalwechsel beim beauftragten Unternehmen und schlägt vor, die jährliche Pflicht abzuschaffen. Die gemessenen Werte lagen deutlich unter den Grenzwerten."},"sources":["usg-bs","rr-26-0185"]},{"id":"biodiversity-initiative","status":"open","due":"2026-09-11","title":{"en":"Government report on the biodiversity initiative","de":"Bericht der Regierung zur Biodiversitätsinitiative"},"law":{"en":"§ 19 para. 1 IRG","de":"§ 19 Abs. 1 IRG"},"body":{"en":"The six-month deadline for the government's report ended on 11 September 2026. The government asked in August for nine more months, to 11 June 2027, to prepare a counter-proposal; the Grand Council has not yet decided.","de":"Die sechsmonatige Frist für den Bericht der Regierung endete am 11. September 2026. Die Regierung beantragte im August neun Monate mehr, bis zum 11. Juni 2027, um einen Gegenvorschlag auszuarbeiten; der Grosse Rat hat noch nicht entschieden."},"sources":["rr-25-1737"]},{"id":"climate-2027","status":"risk","due":"2027-12-31","dueDisplay":{"en":"2027","de":"2027"},"title":{"en":"First five-year climate target: 479,000 t","de":"Erstes Fünfjahresziel Klima: 479’000 t"},"law":{"en":"§ 16a para. 3 KV BS; Klimaschutzstrategie, Table 1","de":"§ 16a Abs. 3 KV BS; Klimaschutzstrategie, Tabelle 1"},"body":{"en":"The constitution requires binding five-year targets on the way to net zero in 2037. The first is 479,000 t CO2eq net in 2027, 29% below 2020. The strategy itself says missing it cannot be ruled out, and the government now calls the 2037 transport targets hardly achievable.","de":"Die Verfassung verlangt verbindliche Fünfjahresziele auf dem Weg zu Netto-Null 2037. Das erste lautet auf netto 479’000 t CO2eq im Jahr 2027, 29 % unter 2020. Die Strategie selbst hält es für nicht auszuschliessen, dass es verfehlt wird, und die Regierung bezeichnet die Verkehrsziele 2037 inzwischen als kaum erreichbar."},"sources":["kv-bs","bs-ks-teil1-2025","rr-26-5024"]},{"id":"gewaesserraum","status":"late","due":"2018-12-31","done":"2024-02-01","doneDisplay":{"en":"February 2024","de":"Februar 2024"},"title":{"en":"Space for watercourses","de":"Gewässerraum"},"law":{"en":"Transitional provisions to the GSchV amendment of 4 May 2011, para. 1","de":"Übergangsbestimmungen zur Änderung der GSchV vom 4. Mai 2011, Abs. 1"},"body":{"en":"Cantons had to fix the space reserved for rivers and streams by the end of 2018. Basel-Stadt's zoning plan for it has been in force since February 2024, about five years late.","de":"Die Kantone mussten den Gewässerraum bis Ende 2018 festlegen. Der Nutzungsplan Gewässerraum von Basel-Stadt ist seit Februar 2024 rechtskräftig, rund fünf Jahre zu spät."},"sources":["gschv-ueb-2011","bs-gewaesserraum"]},{"id":"solar-public","status":"late","due":"2023-08-31","done":"2025-06-25","title":{"en":"Solar duty on public buildings (Motion Grossenbacher)","de":"Solarpflicht auf öffentlichen Gebäuden (Motion Grossenbacher)"},"law":{"en":"Grand Council decision of 16 February 2022 on motion 19.5034","de":"Beschluss des Grossen Rates vom 16. Februar 2022 zur Motion 19.5034"},"body":{"en":"The extended deadline was 31 August 2023. The government met the motion with its «Solaroffensive» bill of 25 June 2025, almost two years late. The bill is still before the Grand Council's committee.","de":"Die erstreckte Frist lief am 31. August 2023 ab. Die Regierung erfüllte die Motion mit dem Ratschlag «Solaroffensive» vom 25. Juni 2025, fast zwei Jahre zu spät. Die Vorlage liegt noch in der Kommission des Grossen Rates."},"sources":["gr-19-5034","rr-25-0921"]}]}}</script>
<script>
(() => {
  'use strict';

  /* ---------- Language ---------- */
  // Keep numbers with their units and currency codes on one line.
  const UNITS = '%|ha|°C|t|kt|km|m²|m|ng/l|µg/m³|Mio\\.|Mrd\\.|bn|days|Tage|years|Jahre|Jahren|properties|Liegenschaften|trees|Bäume';
  const NB_UNIT = new RegExp(`(\\d) (?=(?:${UNITS})(?![\\p{L}\\d]))`, 'gu');
  const MONTHS = LANG === 'de'
    ? '(?:Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)'
    : '(?:January|February|March|April|May|June|July|August|September|October|November|December)';
  const NB_DATE = new RegExp(`(\\b\\d{1,2}\\.?) (?=${MONTHS}\\b)`, 'g');
  // German puts a (non-breaking) space before the percent sign.
  const pctSpace = (t) => (LANG === 'de' ? t.replace(/(\d)%/g, '$1 %') : t);
  const typo = (s) => pctSpace(String(s)).replace(NB_DATE, '$1 ').replace(NB_UNIT, '$1 ').replace(/(^|[\s(])(CHF|EUR|Art\.|Abs\.|§|Nr\.|no\.|lit\.) (?=\S)/g, '$1$2 ');
  // A localised field is {en, de}; plain strings and numbers pass through.
  const L = (x) => {
    if (x == null) return '';
    if (typeof x === 'object' && !Array.isArray(x)) return typo(x[LANG] ?? x.en ?? '');
    return typeof x === 'string' ? typo(x) : x;
  };
  const LOCALE = LANG === 'de' ? 'de-CH' : 'en-GB';
  // Swiss style: apostrophe for thousands, decimal comma in running text.
  const fmtN = (n, digits = 0) => {
    const s = new Intl.NumberFormat(LOCALE, { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(n);
    return LANG === 'de' ? s.replace('.', ',') : s;
