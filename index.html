.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.derived { margin-top: 16px; font-weight: 600; max-width: 60ch; }
.derived small { font-weight: 400; color: var(--ink-2); }
@media (max-width: 640px) { .dotrow { grid-template-columns: 1fr; gap: 8px; } }

/* Pathway */
.pathway svg { display: block; width: 100%; height: auto; overflow: visible; }
.pathway text { font-family: var(--font); fill: var(--ink-2); font-size: 12px; }
.pathway .axis { stroke: var(--rule); stroke-width: 1; }
.pathway .base { stroke: var(--ink); stroke-width: 2; }
.pathway .path-ill { stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
.pathway .path-act { stroke: var(--ink); stroke-width: 4; fill: none; }
.pathway .dot { fill: var(--ink); }
.pathway .mk { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; }
.pathway .today { stroke: var(--fuchsine); stroke-width: 2; }
.pathway .today-t { fill: var(--fuchsine); font-weight: 700; }
.pathway .gap { fill: var(--fuchsine); }
.pathway .gap-t { fill: var(--fuchsine); font-weight: 700; font-size: 13px; }
.pace { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px var(--gap); margin-top: 20px; }
.pace div { border-top: 2px solid var(--ink); padding-top: 8px; }
.pace b { display: block; font-size: var(--fs-2xl); font-weight: 800; font-stretch: 72%; line-height: 1.05; }
.pace span { font-size: var(--fs-s); color: var(--ink-2); }
.pace .hot b { color: var(--fuchsine); }

/* Site sheets */
.sheets { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--gap); }
.sheet { border-top: 8px solid var(--fuchsine); background: var(--field); }
.sheet header { padding: 16px 18px 12px; }
.sheet h4 { margin: 0; font-size: var(--fs-xl); font-stretch: 75%; font-weight: 800; }
.sheet header p { font-size: var(--fs-s); color: var(--ink-2); margin-top: 2px; }
.sheet dl { margin: 0; }
.sheet dl div { display: grid; grid-template-columns: 8.5rem 1fr; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--rule); font-size: var(--fs-s); }
.sheet dt { font-weight: 700; }
.sheet dd { margin: 0; }
@media (max-width: 420px) { .sheet dl div { grid-template-columns: 1fr; gap: 2px; } }

/* Log scale */
.logaxis { position: relative; height: 18px; font-size: var(--fs-xs); color: var(--ink-2); }
.logaxis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.logaxis span:first-child { transform: none; }
.logaxis span:last-child { transform: translateX(-100%); }
.track .lim { position: absolute; top: -7px; bottom: -7px; border-left: 3px solid var(--ink); }
.legend i.limkey { width: 3px; height: 18px; background: var(--ink); }

/* Progress */
.progress { position: relative; height: 56px; background: var(--field); display: flex; }
.progress .done { background: var(--ink); color: var(--paper); display: flex; align-items: center; padding-left: 12px; font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); }
.progress .plan { background-image: repeating-linear-gradient(135deg, var(--rhine) 0 6px, transparent 6px 12px); border-left: 2px solid var(--paper); }
.overdue { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; }
.overdue b { font-size: var(--fs-2xl); font-weight: 800; font-stretch: 72%; color: var(--fuchsine); line-height: 1; }

/* Truth + upgrades */
.truth { margin-top: clamp(48px, 6vw, 72px); padding-top: 16px; border-top: 8px solid var(--fuchsine); }
.truth h3 { font-size: var(--fs-s); color: var(--fuchsine); font-weight: 700; }
.truth p { margin-top: 10px; font-size: clamp(1.25rem, 2.1vw, 1.625rem); font-weight: 600; font-stretch: 92%; line-height: 1.3; max-width: 44ch; }
.upgrades { margin-top: 40px; }
.upgrades h3 { font-size: var(--fs-l); font-stretch: 90%; }
.upgrades ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 72ch; }
.upgrades li { padding-left: 22px; position: relative; }
.upgrades li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 12px; height: 4px; background: var(--rhine); }
.upgrades .note { margin-top: 12px; }

/* Generic sections */
.block { border-top: 3px solid var(--ink); padding-block: clamp(48px, 7vw, 96px); }
.block-head { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-bottom: 32px; }
.block-head h2 { grid-column: span 5; font-size: clamp(2rem, 4vw, 3.25rem); font-weight: 800; font-stretch: 72%; line-height: 1; }
.block-head p { grid-column: 7 / span 6; font-size: var(--fs-l); color: var(--ink-2); line-height: 1.45; }
@media (max-width: 900px) { .block-head h2, .block-head p { grid-column: span 12; } }

/* Votes */
.votes .row { grid-template-columns: minmax(200px, 38%) 1fr 5.5rem; }
.votes .lbl small { display: block; color: var(--ink-2); font-size: var(--fs-xs); }
.votes .kind { display: inline-block; font-size: var(--fs-xs); font-weight: 700; margin-right: 6px; }
.votes .track { height: 28px; background: transparent; border: 2px solid var(--ink); }
.votes .bar.pass { background: var(--ink); }
.votes .bar.fail { background: repeating-linear-gradient(135deg, var(--g2) 0 4px, transparent 4px 8px); }
.votes .half { position: absolute; left: 50%; top: -8px; bottom: -8px; border-left: 2px solid var(--fuchsine); }
@media (max-width: 640px) { .votes .row { grid-template-columns: 1fr 4.5rem; } }

/* Timeline */
.tl { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.tl h3 { font-size: var(--fs-l); font-stretch: 85%; margin-bottom: 8px; }
.tl ol { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); }
.tl time { font-weight: 800; font-stretch: 78%; }
.tl .when { font-size: var(--fs-xs); color: var(--fuchsine); font-weight: 700; display: block; }
.tl .ahead li:first-child { border-top: 3px solid var(--fuchsine); }
@media (max-width: 800px) { .tl { grid-template-columns: 1fr; } }

/* Legal */
.legal { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px var(--gap); }
.legal article { border-top: 2px solid var(--ink); padding-top: 12px; }
.legal h3 { font-size: var(--fs-l); font-stretch: 88%; }
.legal .law { font-size: var(--fs-s); color: var(--ink-2); margin-top: 6px; font-style: italic; }
.legal p.body { margin-top: 10px; }
.legal p.work { margin-top: 10px; font-size: var(--fs-s); }
.legal p.work b { font-weight: 700; }

/* Method */
.rubric { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); margin: 0; }
.rubric div { border-top: 8px solid var(--c); padding-top: 8px; }
.rubric dt { font-size: var(--fs-2xl); font-weight: 900; font-stretch: 62%; line-height: 1; color: var(--c-text); }
.rubric dd { margin: 6px 0 0; font-size: var(--fs-s); }
.rubric .t-good { --c: var(--rhine); --c-text: var(--rhine); }
.rubric .t-mid { --c: var(--sulfur); --c-text: var(--sulfur-ink); }
.rubric .t-bad { --c: var(--fuchsine); --c-text: var(--fuchsine); }
.method-notes { margin: 32px 0 0; padding-left: 1.1em; max-width: 72ch; display: grid; gap: 8px; }
@media (max-width: 800px) { .rubric { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Sources */
.src-tools { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 20px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 2px solid var(--ink); background: none; padding: 6px 10px; font-size: var(--fs-s); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.src-search { border: 2px solid var(--ink); background: var(--paper); padding: 7px 10px; font: inherit; font-size: var(--fs-s); min-width: min(100%, 280px); color: var(--ink); }
.src-status { font-size: var(--fs-s); color: var(--ink-2); }
.srclist { list-style: none; margin: 0; padding: 0; }
.srclist li { display: grid; grid-template-columns: 3rem 1fr auto; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); }
.srclist li:target { background: var(--field); }
.srclist .n { font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); line-height: 1.2; }
.srclist .t a { font-weight: 600; }
.srclist .m { font-size: var(--fs-s); color: var(--ink-2); margin-top: 2px; }
.srclist .used { font-size: var(--fs-xs); color: var(--ink-3); margin-top: 4px; }
.type { font-size: var(--fs-xs); font-weight: 700; padding: 2px 8px; border: 1px solid var(--ink); white-space: nowrap; align-self: start; }
.type.official { background: var(--ink); color: var(--paper); }
.type.advocacy { border-color: var(--fuchsine); color: var(--fuchsine); }
@media (max-width: 560px) { .srclist li { grid-template-columns: 2.25rem 1fr; } .srclist .type { grid-column: 2; justify-self: start; } }

/* Popover */
.pop {
  position: absolute; z-index: 60; width: min(380px, calc(100vw - 24px)); background: var(--paper);
  border: 2px solid var(--ink); padding: 16px 18px 18px; box-shadow: 8px 8px 0 var(--ink);
}
.pop[hidden] { display: none; }
.pop .top { display: flex; align-items: center; gap: 12px; }
.pop .top .close { margin-left: auto; }
.pop .n { font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); }
.pop h4 { margin: 10px 0 4px; font-size: var(--fs-m); line-height: 1.3; }
.pop p { font-size: var(--fs-s); color: var(--ink-2); }
.pop .links { display: flex; gap: 16px; margin-top: 12px; font-size: var(--fs-s); font-weight: 600; }
.pop .close { border: none; background: none; font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 0 4px; }
@media (max-width: 640px) {
  .pop { position: fixed; left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100%; box-shadow: 0 -4px 0 var(--ink); border-width: 2px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
}

/* Footer */
.site-foot { border-top: 3px solid var(--ink); padding-block: 32px 48px; font-size: var(--fs-s); color: var(--ink-2); }
.site-foot .wrap { display: grid; gap: 8px; }

/* Kicker, method footer, changelog */
.kicker { font-size: var(--fs-s); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 18px; display: flex; gap: 10px; align-items: center; }
.kicker::before { content: ""; flex: none; width: 28px; height: 10px; background: linear-gradient(90deg, var(--ink) 0 22%, var(--fuchsine) 22%); }
.method-foot { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px var(--gap); margin-top: 48px; }
.method-foot h3 { font-size: var(--fs-l); font-stretch: 88%; margin-bottom: 10px; }
.changelog { list-style: none; margin: 0; padding: 0; font-size: var(--fs-s); }
.changelog li { display: grid; grid-template-columns: 9rem 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--rule); }
.changelog time { font-weight: 700; }
.cite-text { font-size: var(--fs-s); background: var(--field); padding: 14px 16px; overflow-wrap: anywhere; user-select: all; }
@media (max-width: 480px) { .changelog li { grid-template-columns: 1fr; gap: 2px; } }
.noscript { padding-block: 40px; max-width: 72ch; }
.noscript h1 { font-size: var(--fs-2xl); margin-bottom: 16px; }
.noscript ul { padding-left: 1.2em; }

/* Print */
@media print {
  :root { --paper: #fff; }
  .site-head, .actions, .theme-btn, .src-tools, .pop, .skip { display: none !important; }
  .area-head { position: static; }
  .area, .block { break-inside: auto; padding-block: 24px; }
  .chart, .sheet, .fig, .legal article { break-inside: avoid; }
  .seg-out { animation: none !important; }
  .srclist .t a::after { content: " " attr(href); font-weight: 400; font-size: 0.75rem; word-break: break-all; }
  body { font-size: 10.5pt; }
}

<main id="main">
  <noscript><div class="wrap noscript"><h1>Basel&#x27;s net-zero target covers at most a fifth of its residents&#x27; climate footprint.</h1><p>The canton has Switzerland&#x27;s toughest climate target, one of Europe&#x27;s heaviest chemical legacies and, in 2026, the hottest summer since Swiss records began. This audit grades where it stands. Every figure links to its source.</p><p><b>Overall grade: C.</b> Good governance on paper, lagging outcomes, and a chemical legacy that is still largely in the ground.</p><h2>Grades by area</h2><ul><li><b>C</b> Climate mitigation: The target is real. The accounting flatters it, and the last step depends on technology and law that do not yet exist.</li><li><b>D</b> Heat and adaptation: 2026 showed what is coming. Adaptation is proceeding at the pace of routine street maintenance.</li><li><b>D</b> Chemical legacy in soil and groundwater: The region&#x27;s chemical past is still mostly underground, next to future homes and existing drinking water.</li><li><b>B–</b> Air quality: Much cleaner than in 1990 and mostly within Swiss limits. Those limits are well above what the WHO now considers safe.</li><li><b>C+</b> Drinking water and rivers: The tap water is good. The rivers carry PFAS and now need heat-wave closures to keep fish alive.</li><li><b>C–</b> Noise and traffic: Years past a federal deadline on road noise; the fix still awaits a parliamentary decision and a rollout of eight years or more.</li></ul><p>This page draws its charts with JavaScript. The full data is in <a href="data/assessment.json">assessment.json</a>.</p></div></noscript>
  <div id="app"></div>
</main>

ng. Mobility is off track by the climate office's own account, the canton's heat monitoring finds no measurable reduction in exposure, and road-noise remediation is years overdue.","de":"Bei der Wärme geht es voran. Die Mobilität ist nach Angaben der Klimafachstelle nicht auf Kurs, das kantonale Hitze-Controlling stellt keine messbare Entlastung fest, und die Strassenlärmsanierung ist seit Jahren überfällig."},"sources":["bajour-berger-2026","bs-controlling-2026","rr-laerm-2018"]},{"label":{"en":"Legacy liabilities","de":"Altlasten"},"grade":"D","note":{"en":"Contaminated chemical sites next to homes and drinking water, with clean-up years away.","de":"Belastete Chemie-Standorte neben Wohnungen und Trinkwasser, die Sanierung liegt Jahre entfernt."},"sources":["srf-klybeck-2026","srf-feldreben-2026"]}]},"domains":[{"id":"climate","name":{"en":"Climate mitigation","de":"Klimaschutz"},"short":{"en":"Climate","de":"Klima"},"grade":"C","verdict":{"en":"The target is real. The accounting flatters it, and the last step depends on technology and law that do not yet exist.","de":"Das Ziel ist ernst gemeint. Die Bilanzierung schönt es, und der letzte Schritt hängt von Technik und Recht ab, die es noch nicht gibt."},"metrics":[{"value":"2037","label":{"en":"Net-zero year, written into the cantonal constitution in 2022","de":"Netto-Null-Jahr, 2022 in die Kantonsverfassung geschrieben"},"sources":["bs-strategie-2023","bs-abst-2022"]},{"value":{"en":"3.1 t","de":"3,1 t"},"label":{"en":"Direct emissions per resident in 2022; total emissions fell 6% from 2020","de":"Direkte Emissionen pro Kopf 2022; die Gesamtemissionen sanken gegenüber 2020 um 6 %"},"sources":["bs-klimaschutz"]},{"value":">13 t","label":{"en":"Indirect emissions per resident, outside the target; a Swiss-average estimate in which financial investments account for more than 6 t","de":"Indirekte Emissionen pro Kopf, ausserhalb des Ziels; eine Schätzung auf Basis des Schweizer Durchschnitts, davon über 6 t aus Finanzanlagen"},"sources":["bs-strategie-2025"]},{"value":"23%","label":{"en":"Share of waste burned in Basel's incinerator that comes from Basel-Stadt itself","de":"Anteil des in der Basler KVA verbrannten Abfalls, der aus Basel-Stadt selbst stammt"},"sources":["rr-ccs-2025"]},{"value":">50%","label":{"en":"Heating systems already running on renewable energy","de":"Heizungen, die bereits mit erneuerbarer Energie laufen"},"sources":["bajour-berger-2026"]},{"value":"CHF 500","label":{"en":"Current industry estimate per tonne for capturing, transporting and storing CO2","de":"Aktuelle Branchenschätzung pro Tonne für Abscheidung, Transport und Speicherung von CO2"},"sources":["rr-ccs-2025"]}],"charts":["pathway","waste-origin","gas-exit"],"truth":{"text":{"en":"If the 2037 target is met, it will be met largely on the balance sheet. The incinerator, the largest single source, would need carbon capture that no waste incinerator operates at industrial scale, that Swiss waste law does not yet allow to be stored, and that the government only contemplates from 2037. The climate office itself says any shortfall will be covered by negative emissions after 2037, bought on the market if necessary.","de":"Wird das Ziel 2037 erreicht, dann grösstenteils in der Bilanz. Die KVA, die grösste Einzelquelle, bräuchte eine CO2-Abscheidung, die keine Kehrichtverbrennung im industriellen Massstab betreibt, deren Speicherung das Schweizer Abfallrecht noch nicht zulässt und die die Regierung erst ab 2037 in Betracht zieht. Die Klimafachstelle sagt selbst, eine Lücke werde nach 2037 mit Negativemissionen geschlossen, nötigenfalls am Markt gekauft."},"sources":["rr-ccs-2025","baz-klimaportal-2025","bajour-berger-2026"]},"upgrades":[{"text":{"en":"Negotiate intercantonal and cross-border cost sharing for incinerator carbon capture now; 77% of the waste comes from elsewhere.","de":"Die Kostenteilung für die CO2-Abscheidung an der KVA jetzt interkantonal und grenzüberschreitend verhandeln; 77 % des Abfalls stammen von anderswo."},"sources":["rr-ccs-2025"]},{"text":{"en":"Implement the Grand Council's 2024 motion to reform the vehicle tax, which already weighs weight and CO2, towards fuel and space consumption. Mobility is off track by the climate office's own account.","de":"Die Motion des Grossen Rates von 2024 umsetzen, welche die bereits nach Gewicht und CO2 bemessene Motorfahrzeugsteuer stärker auf Treibstoff- und Flächenverbrauch ausrichten will. Die Mobilität ist nach Angaben der Klimafachstelle nicht auf Kurs."},"sources":["bs-mfz-steuer","bz-suv-2024","bajour-berger-2026"]},{"text":{"en":"Set a dated target for indirect emissions instead of waiting for groundwork due in 2028.","de":"Ein terminiertes Ziel für indirekte Emissionen setzen, statt auf Grundlagen zu warten, die erst 2028 vorliegen sollen."},"sources":["bajour-berger-2026"]},{"text":{"en":"Position the Rhine ports as Switzerland's CO2 export hub. The government already describes the region as pivotal for moving CO2 by rail and ship.","de":"Die Rheinhäfen als Schweizer Drehscheibe für den CO2-Export positionieren. Die Regierung bezeichnet die Region bereits als zentral für den CO2-Transport per Bahn und Schiff."},"sources":["rr-ccs-2025"]}]},{"id":"heat","name":{"en":"Heat and adaptation","de":"Hitze und Anpassung"},"short":{"en":"Heat","de":"Hitze"},"grade":"D","verdict":{"en":"2026 showed what is coming. Adaptation is proceeding at the pace of routine street maintenance.","de":"2026 hat gezeigt, was kommt. Die Anpassung kommt im Tempo des ordentlichen Strassenunterhalts voran."},"metrics":[{"value":{"en":"39.7 °C","de":"39,7 °C"},"label":{"en":"New station record at Basel-Binningen on 30 July 2026, equalling the record north of the Alps","de":"Neuer Stationsrekord in Basel-Binningen am 30. Juli 2026, gleichauf mit dem Rekord der Alpennordseite"},"sources":["meteoswiss-jja-2026","blick-sommer-2026"]},{"value":"52","label":{"en":"Hot days (30 °C or more) in June–August 2026, against a 1991–2020 average of 14","de":"Hitzetage (30 °C und mehr) im Juni–August 2026, gegenüber einem Mittel von 14 (1991–2020)"},"sources":["nbcn-binningen","blick-sommer-2026"]},{"value":"20","label":{"en":"Days of 35 °C or more in June–August 2026, against 12 in 2003","de":"Tage mit 35 °C und mehr im Juni–August 2026, gegenüber 12 im Jahr 2003"},"sources":["nbcn-binningen"]},{"value":{"en":"≈28,000","de":"≈28’000"},"label":{"en":"Trees on public ground in the city","de":"Bäume auf öffentlichem Grund in der Stadt"},"sources":["bs-baeume-2025"]},{"value":"17%","label":{"en":"Tree canopy cover of the city of Basel in 2024, unchanged since 2012","de":"Baumkronenbedeckung der Stadt Basel 2024, seit 2012 unverändert"},"sources":["bs-controlling-2026"]},{"value":{"en":"4,477 m²","de":"4’477 m²"},"label":{"en":"Unsealed area approved in 2023–2024, against a target of 165,000 m² by 2037","de":"In den Jahren 2023–2024 bewilligte Entsiegelung, gegenüber einem Ziel von 165’000 m² bis 2037"},"sources":["bs-controlling-2026"]}],"charts":["hot-days","trees"],"truth":{"text":{"en":"The canton's own 2026 monitoring report finds no measurable reduction in the number of people exposed to heat, and tree canopy has not grown since 2012. New trees are planted mainly where streets are already being dug up for district heating or maintenance, for cost reasons. The one measure that would free real space, converting street area to greenery, was rejected at the ballot box in 2023. Petitioners said Basel has by far the smallest share of green space among the large Swiss cities, and the government's reply did not dispute it.","de":"Der kantonale Controllingbericht 2026 stellt insgesamt keine messbare Reduktion der Hitzebetroffenheit fest, und die Baumkronenbedeckung ist seit 2012 nicht gewachsen. Neue Bäume werden aus Kostengründen vor allem dort gepflanzt, wo Strassen ohnehin für Fernwärme oder Unterhalt aufgerissen werden. Die eine Massnahme, die wirklich Raum schaffen würde, die Umwandlung von Strassenfläche in Grün, scheiterte 2023 an der Urne. Die Petitionäre hielten fest, Basel habe unter den grossen Schweizer Städten den deutlich geringsten Grünflächenanteil; die Regierung widersprach in ihrer Antwort nicht."},"sources":["bs-controlling-2026","rr-begruenung-2025","bs-abst-2023"]},"upgrades":[{"text":{"en":"Set a canopy-cover target for the identified heat hotspots instead of a tree count.","de":"Für die bekannten Hitze-Hotspots ein Ziel für die Kronenüberdeckung setzen statt einer Baumzahl."},"sources":[]},{"text":{"en":"Adopt the proposed «Grünes Basel» programme for greening and unsealing private land, still before the Grand Council, and aim it at courtyards, where no ballot fight is needed.","de":"Das vorgeschlagene Förderprogramm «Grünes Basel» für Begrünung und Entsiegelung privater Flächen, das noch im Grossen Rat hängig ist, beschliessen und gezielt in Innenhöfen einsetzen, wo es keinen Abstimmungskampf braucht."},"sources":["bs-gruenes-basel-2025","bs-controlling-2026"]},{"text":{"en":"Make unsealing the default whenever a district-heating trench is dug, not an option.","de":"Entsiegelung zur Regel machen, wann immer ein Fernwärmegraben geöffnet wird, nicht zur Option."},"sources":[]}]},{"id":"legacy","name":{"en":"Chemical legacy in soil and groundwater","de":"Chemie-Altlasten in Boden und Grundwasser"},"short":{"en":"Chemical legacy","de":"Chemie-Altlasten"},"grade":"D","verdict":{"en":"The region's chemical past is still mostly underground, next to future homes and existing drinking water.","de":"Die Chemievergangenheit der Region liegt grösstenteils noch im Boden, neben künftigen Wohnungen und bestehendem Trinkwasser."},"metrics":[{"value":{"en":"28–30 ha","de":"28–30 ha"},"label":{"en":"Klybeck, a former chemical site being turned into a district (canton: about 280,000 m²; SRF: 300,000 m²)","de":"Klybeck, ein ehemaliges Chemieareal, das zum Quartier wird (Kanton: rund 280’000 m²; SRF: 300’000 m²)"},"sources":["bs-klybeck","srf-klybeck-2026"]},{"value":{"en":"8,500","de":"8500"},"label":{"en":"Residents planned at Klybeck by 2040","de":"Geplante Bewohnerinnen und Bewohner im Klybeck bis 2040"},"sources":["srf-klybeck-2026"]},{"value":{"en":"CHF 280 m","de":"CHF 280 Mio."},"label":{"en":"Cost of remediating the Feldreben chemical landfill in Muttenz (BL)","de":"Kosten der Sanierung der Chemiemülldeponie Feldreben in Muttenz (BL)"},"sources":["srf-feldreben-2026"]},{"value":{"en":"≈20 years","de":"≈20 Jahre"},"label":{"en":"Groundwater treatment needed at Feldreben","de":"Nötige Grundwasserbehandlung bei der Feldreben"},"sources":["srf-feldreben-2026"]},{"value":{"en":">200,000","de":">200’000"},"label":{"en":"People drawing drinking water from the Muttenzer Hard, next to the landfills (figure reported in 2013)","de":"Menschen, die ihr Trinkwasser aus der Muttenzer Hard beziehen, neben den Deponien (Zahl von 2013)"},"sources":["bz-feldreben"]}],"charts":["legacy-sites"],"truth":{"text":{"en":"Klybeck is planned for 8,500 residents on ground where, SRF reported in April 2026, pollutants including the carcinogen benzidine exceed remediation thresholds in places. In 2024 SRF reported that the canton had dropped a bid for the Novartis parcels after an internal report said the remediation cost could not be assessed; the canton says an overall assessment, including finances, was decisive. The Feldreben clean-up is only now entering planning.","de":"Im Klybeck sollen 8500 Menschen wohnen, auf einem Boden, in dem laut SRF (April 2026) Schadstoffe wie das krebserregende Benzidin teils über den Sanierungswerten liegen. 2024 berichtete SRF, der Kanton habe auf ein Angebot für die Novartis-Parzellen verzichtet, nachdem ein interner Bericht die Sanierungskosten als nicht abschätzbar bezeichnet hatte; der Kanton erklärt, eine Gesamtbetrachtung, auch der Finanzen, sei ausschlaggebend gewesen. Die Sanierung Feldreben tritt erst jetzt in die Planung."},"sources":["srf-klybeck-2026","srf-rundschau-2024","bafu-altlasten-medien","srf-feldreben-2026"]},"upgrades":[{"text":{"en":"Require a substance inventory drawn from each site's production history before building permits are granted. Critics have long asked for the inventory; tying it to permits is this audit's proposal.","de":"Vor Baubewilligungen ein Stoffinventar aus der Produktionsgeschichte jedes Areals verlangen. Das Inventar fordern Kritiker seit Langem; die Verknüpfung mit der Bewilligung ist ein Vorschlag dieser Bilanz."},"sources":["aefu-klybeck-2026"]},{"text":{"en":"Make independent second opinions standard, as the canton did for the Ackermätteli playground in 2025.","de":"Unabhängige Zweitgutachten zum Standard machen, wie es der Kanton 2025 für den Spielplatz Ackermätteli getan hat."},"sources":["bs-ackermaetteli"]},{"text":{"en":"Publish site monitoring as open data, as the canton already does for groundwater PFAS.","de":"Die Überwachung der Areale als offene Daten publizieren, wie es der Kanton für PFAS im Grundwasser bereits tut."},"sources":["bs-pfas"]}]},{"id":"air","name":{"en":"Air quality","de":"Luftqualität"},"short":{"en":"Air","de":"Luft"},"grade":"B–","verdict":{"en":"Much cleaner than in 1990 and mostly within Swiss limits. Those limits are well above what the WHO now considers safe.","de":"Viel sauberer als 1990 und meist innerhalb der Schweizer Grenzwerte. Diese liegen deutlich über dem, was die WHO heute für unbedenklich hält."},"metrics":[{"value":"−65%","label":{"en":"Nitrogen oxide and particulate emissions in the region since 1990","de":"Stickoxid- und Feinstaubemissionen in der Region seit 1990"},"sources":["ub-luft-flyer"]},{"value":"−80%","label":{"en":"Volatile organic compound emissions since 1990","de":"Emissionen flüchtiger organischer Verbindungen seit 1990"},"sources":["ub-luft-flyer"]},{"value":{"en":"Stalled","de":"Stagnation"},"label":{"en":"Nitrogen dioxide in 2025: the decline stopped, but the Swiss annual limit was met at every station","de":"Stickstoffdioxid 2025: kein weiterer Rückgang, aber der Schweizer Jahresgrenzwert wurde an allen Stationen eingehalten"},"sources":["luft-2025"]},{"value":"27 µg/m³","label":{"en":"NO2 annual mean at Feldbergstrasse in 2025, below the Swiss limit of 30 (2022: 37)","de":"NO2-Jahresmittel an der Feldbergstrasse 2025, unter dem Schweizer Grenzwert von 30 (2022: 37)"},"sources":["luft-2025","bl-luft-2022"]},{"value":"3×","label":{"en":"The Swiss NO2 limit relative to the WHO 2021 guideline of 10 µg/m³","de":"Der Schweizer NO2-Grenzwert im Verhältnis zum WHO-Richtwert 2021 von 10 µg/m³"},"sources":["bl-luft-2022","who-aqg-2021"]}],"charts":["air-limits","air-emissions"],"truth":{"text":{"en":"\"Within limits\" mostly means within Swiss limits. Fine particles (PM2.5) and ozone are still too high, and nitrogen deposition exceeds ecological limits almost everywhere.","de":"«Innerhalb der Grenzwerte» heisst meist: innerhalb der Schweizer Grenzwerte. Feinstaub (PM2.5) und Ozon sind weiterhin zu hoch, und die Stickstoffeinträge überschreiten die ökologischen Belastungsgrenzen fast überall."},"sources":["ub-luft-2025"]},"upgrades":[{"text":{"en":"Report against the WHO 2021 values as cantonal target values, even though the legal limits are federal.","de":"Die WHO-Werte 2021 als kantonale Zielwerte ausweisen und daran berichten, auch wenn die Grenzwerte Bundesrecht sind."},"sources":["who-aqg-2021"]},{"text":{"en":"Concentrate on fine particles and carcinogenic soot from combustion, which the regional clean-air programme singles out for reduction.","de":"Auf Feinstaub und krebserregenden Russ aus Verbrennung fokussieren, deren Reduktion das regionale Luftreinhalteprogramm besonders hervorhebt."},"sources":["ub-luft-2025"]}]},{"id":"water","name":{"en":"Drinking water and rivers","de":"Trinkwasser und Flüsse"},"short":{"en":"Water","de":"Wasser"},"grade":"C+","subgrades":[{"label":{"en":"Tap water","de":"Leitungswasser"},"grade":"B–"},{"label":{"en":"River ecosystems","de":"Flussökosysteme"},"grade":"C"}],"verdict":{"en":"The tap water is good. The rivers carry PFAS and now need heat-wave closures to keep fish alive.","de":"Das Leitungswasser ist gut. Die Flüsse führen PFAS und müssen bei Hitzewellen gesperrt werden, damit die Fische überleben."},"metrics":[{"value":"≥10×","label":{"en":"Margin by which every Basel drinking-water sample met the planned PFAS limit in the 2023 national campaign","de":"Abstand, mit dem jede Basler Trinkwasserprobe in der nationalen Kampagne 2023 den geplanten PFAS-Höchstwert einhielt"},"sources":["gr-pfas-2024"]},{"value":{"en":"All","de":"Alle"},"label":{"en":"Wild fish samples contained PFAS; some exceeded the legal maximum","de":"Wildfischproben enthielten PFAS; einige überschritten den gesetzlichen Höchstwert"},"sources":["bs-pfas"]},{"value":"240–400 ng/l","label":{"en":"PFAS in groundwater near the EuroAirport as asserted in a Green Party question (2025), against the planned 100 ng/l limit; the government did not confirm the figures","de":"PFAS im Grundwasser beim EuroAirport gemäss einer Anfrage der Grünen (2025), gegenüber dem geplanten Höchstwert von 100 ng/l; die Regierung bestätigte die Zahlen nicht"},"sources":["gruene-bl-pfas-2025"]},{"value":">25 °C","label":{"en":"Peak water temperature in the lower Birs, July 2026","de":"Höchste Wassertemperatur in der unteren Birs, Juli 2026"},"sources":["srf-birs-2026"]},{"value":"2","label":{"en":"Rivers closed to bathing, entry and fishing on their lower reaches in June 2026 (Birs and Wiese)","de":"Flüsse, deren Unterlauf im Juni 2026 für Baden, Betreten und Fischen gesperrt wurde (Birs und Wiese)"},"sources":["bs-birs-2026","bs-wiese-2026"]}],"charts":["pfas"],"truth":{"text":{"en":"Part of the drinking water is produced next to unremediated chemical landfills. The protection is hydraulic: more Rhine water is infiltrated than is pumped out, so the groundwater flows away from the wells. The authorities have said an effect on drinking water has not been demonstrated; critics dispute this. The contamination itself remains in place.","de":"Ein Teil des Trinkwassers wird neben unsanierten Chemiemülldeponien gewonnen. Der Schutz ist hydraulisch: Es wird mehr Rheinwasser versickert als abgepumpt, sodass das Grundwasser von den Brunnen wegfliesst. Die Behörden erklärten, ein Einfluss auf das Trinkwasser sei nicht nachgewiesen; Kritiker bestreiten dies. Die Belastung selbst bleibt im Boden."},"sources":["hardwasser-wasserberg","tageswoche-2013","srf-feldreben-2026"]},"upgrades":[{"text":{"en":"Trace the PFAS plume around the EuroAirport across the border and put the cost on the polluter. The Grand Council took a first step in September 2026 by referring a cantonal initiative for a federal PFAS levy.","de":"Die PFAS-Fahne rund um den EuroAirport grenzüberschreitend erfassen und die Kosten dem Verursacher auferlegen. Der Grosse Rat hat im September 2026 mit der Überweisung einer Standesinitiative für eine Bundesabgabe auf PFAS einen ersten Schritt getan."},"sources":["gruene-bl-pfas-2025","gr-pfas-abgabe-2026"]},{"text":{"en":"Build cold-water refuges at the mouths of the Birs and Wiese before the next hot summer.","de":"Vor dem nächsten heissen Sommer Kaltwasser-Refugien an den Mündungen von Birs und Wiese schaffen."},"sources":["bs-birs-2026"]}]},{"id":"noise","name":{"en":"Noise and traffic","de":"Lärm und Verkehr"},"short":{"en":"Noise & traffic","de":"Lärm & Verkehr"},"grade":"C–","verdict":{"en":"Years past a federal deadline on road noise; the fix still awaits a parliamentary decision and a rollout of eight years or more.","de":"Jahre nach Ablauf einer Bundesfrist zum Strassenlärm; die Lösung wartet noch auf den Parlamentsentscheid und eine Umsetzung von acht Jahren oder mehr."},"metrics":[{"value":{"en":"31 Mar 2018","de":"31.3.2018"},"label":{"en":"Federal deadline for road-noise remediation, passed with the work unfinished","de":"Bundesfrist für die Strassenlärmsanierung, abgelaufen, die Sanierung ist nicht abgeschlossen"},"sources":["rr-laerm-2018"]},{"value":"63%","label":{"en":"Share of the road network that is traffic-calmed today","de":"Anteil des Strassennetzes, der heute verkehrsberuhigt ist"},"sources":["bs-tempo30-page"]},{"value":"+50 km","label":{"en":"Planned Tempo 30 extension, plus 20 km at night only","de":"Geplante Ausweitung von Tempo 30, dazu 20 km nur nachts"},"sources":["bs-mm-tempo30-2026"]},{"value":{"en":"CHF 2.35 bn","de":"CHF 2,35 Mrd."},"label":{"en":"Rheintunnel motorway, cost in the federal consultation of June 2026; back in the 2045 horizon after voters rejected the expansion package","de":"Autobahn Rheintunnel, Kosten gemäss Vernehmlassung des Bundes vom Juni 2026; nach dem Nein an der Urne wieder im Horizont 2045"},"sources":["uvek-v45-2026","rr-rheintunnel-2026"]},{"value":{"en":"9.6 m","de":"9,6 Mio."},"label":{"en":"EuroAirport passengers in 2025, a record; aviation is outside the climate target","de":"Passagiere am EuroAirport 2025, ein Rekord; der Flugverkehr liegt ausserhalb des Klimaziels"},"sources":["moneycab-eap-2026","bajour-berger-2026"]}],"charts":["calming"],"truth":{"text":{"en":"Basel-Stadt voted 56% against motorway expansion in 2024. Federal planning has put the Rheintunnel back on the list anyway. The canton's Tempo 30 extension, meant to meet a legal duty overdue since 2018, is still before the Grand Council and would take eight to ten years to roll out. Since 1 October 2026, federal law also requires an expert report showing that Tempo 30 on main roads does not divert traffic into residential streets.","de":"Basel-Stadt stimmte 2024 mit 56 % gegen den Autobahnausbau. Die Bundesplanung hat den Rheintunnel trotzdem wieder auf die Liste gesetzt. Die kantonale Ausweitung von Tempo 30, die eine seit 2018 überfällige Rechtspflicht erfüllen soll, liegt noch beim Grossen Rat und bräuchte acht bis zehn Jahre. Seit dem 1. Oktober 2026 verlangt das Bundesrecht zudem ein Gutachten, das zeigt, dass Tempo 30 auf Hauptstrassen keinen Ausweichverkehr in Wohnquartiere auslöst."},"sources":["bs-abst-2024","uvek-v45-2026","bs-mm-tempo30-2026","astra-schilliger-2026","sda-schilliger-2026"]},"upgrades":[{"text":{"en":"Introduce the planned night-time Tempo 30 immediately. It needs signs, not construction, and courts have upheld noise-based Tempo 30 orders.","de":"Das geplante Nacht-Tempo-30 sofort einführen. Es braucht Signale, keine Bauarbeiten, und Gerichte haben lärmbegründete Tempo-30-Anordnungen bestätigt."},"sources":["bs-mm-tempo30-2026","bger-1c-318-2024"]},{"text":{"en":"Hold the government to the conditions it set in March 2026 for supporting the Rheintunnel: tangible gains for residents, flanking measures such as urban greenery, space for walking and cycling and unsealing, and a limited construction burden. Make them binding before construction is approved.","de":"Die Regierung auf die Bedingungen verpflichten, die sie im März 2026 für eine Unterstützung des Rheintunnels formuliert hat: spürbarer Mehrwert für die Bevölkerung, flankierende Massnahmen wie Stadtgrün, Raum für Fuss- und Veloverkehr und Entsiegelung sowie eine begrenzte Baubelastung. Diese Bedingungen verbindlich machen, bevor der Bau bewilligt wird."},"sources":["rr-rheintunnel-2026"]},{"text":{"en":"Commission the diversion reports now required by federal law for each main-road section together with the noise reports, so that the new requirement does not delay remediation further.","de":"Die neu vom Bundesrecht verlangten Gutachten zum Ausweichverkehr für jeden Hauptstrassenabschnitt zusammen mit den Lärmgutachten in Auftrag geben, damit die neue Anforderung die Sanierung nicht weiter verzögert."},"sources":["astra-schilliger-2026"]}]}],"charts":{"pathway":{"type":"pathway","title":{"en":"The path to 2037, and the gap at the end of it","de":"Der Weg bis 2037 und die Lücke an seinem Ende"},"note":{"en":"Tonnes CO2-equivalent on cantonal territory; 2022 is the latest published inventory as of September 2026. The dashed line is an illustrative straight path, not the canton's official curve. 2020 follows the climate strategy (674,000 t; the portal launch release rounds to about 700,000). 2022 is derived from the reported 6% reduction. 2020 was a pandemic year, so the pace comparison is indicative. IWB reports about 620,000 t CO2 in a different accounting.","de":"Tonnen CO2-Äquivalent auf Kantonsgebiet; 2022 ist das neuste veröffentlichte Inventar (Stand September 2026). Die gestrichelte Linie ist ein illustrativer linearer Pfad, nicht die offizielle Kurve des Kantons. 2020 folgt der Klimaschutzstrategie (674’000 t; die Medienmitteilung zum Klimaportal rundet auf rund 700’000). 2022 ist aus der ausgewiesenen Reduktion von 6 % abgeleitet. 2020 war ein Pandemiejahr; der Tempovergleich ist deshalb ein Richtwert. Die IWB weisen in einer anderen Bilanzierung rund 620’000 t CO2 aus."},"start":{"year":2020,"value":674000,"sources":["bs-strategie-2025"]},"reductionTo2022":{"year":2022,"percent":6,"sources":["bs-klimaschutz"]},"residual2037":{"year":2037,"value":90000,"sources":["infras-kurzfassung"]},"markers":[{"year":2027.9,"label":{"en":"CCS feasibility study due","de":"Machbarkeitsstudie CCS fällig"},"sources":["rr-ccs-2025"],"short":{"en":"CCS study","de":"Studie CCS"}},{"year":2031,"label":{"en":"Federal CCS law planned","de":"Bundesgesetz zu CCS geplant"},"sources":["rr-ccs-2025"],"short":{"en":"CCS law","de":"Gesetz CCS"}}],"sources":["bs-strategie-2025","bs-mm-klimaportal","bs-klimaschutz","infras-kurzfassung","rr-ccs-2025","iwb-fokus-2023"]},"waste-origin":{"type":"stack","title":{"en":"Whose waste Basel burns","de":"Wessen Abfall Basel verbrennt"},"note":{"en":"Origin of waste incinerated at the Basel plant (KVA), the canton's largest emission source. The report gives no reference year; the last share is the remainder.","de":"Herkunft des in der Basler Kehrichtverwertungsanlage (KVA) verbrannten Abfalls, der grössten Emissionsquelle des Kantons. Der Bericht nennt kein Bezugsjahr; der letzte Anteil ist der Rest."},"unit":"%","segments":[{"label":{"en" e":"Die Regierung schlägt Tempo 30 auf 50 weiteren Kilometern vor"},"sources":["bs-mm-tempo30-2026","bs-tempo30-page"]},{"date":"2026-04-09","label":{"en":"Klybeck: pollutants including the carcinogen benzidine found above remediation thresholds in places","de":"Klybeck: Schadstoffe wie das krebserregende Benzidin teils über den Sanierungswerten gefunden"},"sources":["srf-klybeck-2026"]},{"date":"2026-06-15","precision":"month","label":{"en":"Birs and Wiese closed to bathing and fishing in the heat","de":"Birs und Wiese wegen Hitze für Baden und Fischen gesperrt"},"sources":["bs-birs-2026","bs-wiese-2026"]},{"date":"2026-08-31","precision":"season","label":{"en":"Hottest summer since Swiss records began in 1864; 39.7 °C in Basel-Binningen","de":"Heissester Sommer seit Messbeginn 1864; 39,7 °C in Basel-Binningen"},"sources":["meteoswiss-jja-2026","nbcn-binningen"]},{"date":"2026-09-03","label":{"en":"Climate office: mobility is off track","de":"Klimafachstelle: Mobilität nicht auf Kurs"},"sources":["bajour-berger-2026"]},{"date":"2026-09-23","label":{"en":"Grand Council refers a cantonal initiative for a federal PFAS levy","de":"Der Grosse Rat überweist eine Standesinitiative für eine Bundesabgabe auf PFAS"},"sources":["gr-pfas-abgabe-2026"]},{"date":"2026-10-01","label":{"en":"Amended federal signalling rules: Tempo 30 on main roads needs proof of no diversion into residential streets","de":"Geänderte Signalisationsverordnung: Tempo 30 auf Hauptstrassen braucht den Nachweis, dass kein Ausweichverkehr in Quartiere entsteht"},"sources":["astra-schilliger-2026","sda-schilliger-2026"]},{"date":"2027-05-31","precision":"season","display":{"en":"Spring 2027","de":"Frühling 2027"},"label":{"en":"Owners' target for the Klybeck remediation plan","de":"Zieltermin der Eigentümer für das Sanierungsprojekt Klybeck"},"sources":["srf-klybeck-2026"]},{"date":"2027-06-01","precision":"season","display":{"en":"Summer–autumn 2027","de":"Sommer/Herbst 2027"},"label":{"en":"Federal parliament expected to debate the 2045 transport programme, incl. Rheintunnel","de":"Das Bundesparlament berät voraussichtlich das Verkehrsprogramm 2045, inkl. Rheintunnel"},"sources":["rr-dreirosen-2026"]},{"date":"2027-12-31","precision":"year","display":{"en":"End of 2027","de":"Ende 2027"},"label":{"en":"Feasibility study on carbon capture at the Basel incinerator due","de":"Machbarkeitsstudie zur CO2-Abscheidung an der Basler KVA fällig"},"sources":["rr-ccs-2025"]},{"date":"2028-01-01","precision":"year","display":{"en":"From 2028","de":"Ab 2028"},"label":{"en":"IWB starts disconnecting about 1,000 gas connections a year","de":"Die IWB beginnen, jährlich rund 1000 Gasanschlüsse abzutrennen"},"sources":["bs-mm-waerme-2023"]},{"date":"2030-12-31","precision":"year","display":{"en":"2030","de":"2030"},"label":{"en":"Cantonal administration to reach net zero on its direct emissions","de":"Die Kantonsverwaltung soll bei ihren direkten Emissionen Netto-Null erreichen"},"sources":["bs-klimaschutz"]},{"date":"2031-01-01","label":{"en":"Federal CCS framework law planned to take effect","de":"Geplantes Inkrafttreten eines Bundesrahmengesetzes zu CCS"},"sources":["rr-ccs-2025"]},{"date":"2037-12-31","precision":"year","display":{"en":"2037","de":"2037"},"label":{"en":"Net zero on cantonal territory; gas grid switched off","de":"Netto-Null auf Kantonsgebiet; Gasnetz stillgelegt"},"sources":["bs-strategie-2023","bs-mm-waerme-2023"]},{"date":"2040-12-31","precision":"year","display":{"en":"2040","de":"2040"},"label":{"en":"Klybeck district for 8,500 residents","de":"Quartier Klybeck für 8500 Bewohnerinnen und Bewohner"},"sources":["srf-klybeck-2026"]},{"date":"2045-12-31","precision":"year","display":{"en":"2045","de":"2045"},"label":{"en":"Rheintunnel realisation horizon","de":"Realisierungshorizont Rheintunnel"},"sources":["rr-rheintunnel-2026"]}],"legal":[{"title":{"en":"Who pays for Klybeck","de":"Wer bezahlt im Klybeck?"},"law":{"en":"Art. 32d and Art. 32d bis para. 3 USG (SR 814.01); AltlV (SR 814.680); BGE 139 II 106; BGE 144 II 332","de":"Art. 32d und Art. 32d bis Abs. 3 USG (SR 814.01); AltlV (SR 814.680); BGE 139 II 106; BGE 144 II 332"},"body":{"en":"Remediation costs fall primarily on those whose conduct caused the contamination; at Klybeck the historic operators were Ciba, Novartis and BASF. An owner who merely holds the land bears a small share at most, and none if it could not have known of the contamination with due care; the Federal Supreme Court has held a 10% share excessive for such an owner absent special circumstances. The current owners, Rhystadt and Swiss Life, acquired a site already known to be contaminated. Selling or dividing a parcel listed in the contaminated-sites register has required a permit since 2014.","de":"Die Sanierungskosten tragen in erster Linie jene, die die Belastung durch ihr Verhalten verursacht haben; im Klybeck waren das die früheren Betreiber Ciba, Novartis und BASF. Wer das Grundstück bloss innehat, trägt höchstens einen kleinen Anteil und keinen, wenn er die Belastung bei gebotener Sorgfalt nicht kennen konnte; das Bundesgericht hielt für einen solchen Eigentümer 10 % ohne besondere Umstände für übersetzt. Die heutigen Eigentümer Rhystadt und Swiss Life erwarben ein Areal, dessen Belastung bekannt war. Die Veräusserung oder Teilung eines im Kataster eingetragenen Grundstücks ist seit 2014 bewilligungspflichtig."},"work":{"en":"Buyers, lenders and investors carry the risk of a cost-allocation ruling, which any party responsible can request (Art. 32d para. 4 USG). Contamination findings are therefore a pricing and contract question, not only a planning one.","de":"Käufer, Kreditgeber und Investoren tragen das Risiko einer Kostenverteilungsverfügung, die jeder Verursacher verlangen kann (Art. 32d Abs. 4 USG). Belastungsbefunde werden damit zur Preis- und Vertragsfrage, nicht nur zur Planungsfrage."},"sources":["srf-klybeck-2026","srf-klybeck-altlasten","bs-klybeck"]},{"title":{"en":"Carbon storage has no domestic legal path yet","de":"Für die CO2-Speicherung fehlt im Inland der Rechtsweg"},"law":{"en":"Art. 3 para. 5 and Art. 6 KlG (SR 814.310); Art. 14 KlV (SR 814.310.1); Art. 55 para. 1bis CO2 Ordinance (SR 641.711); planned federal CCS framework law","de":"Art. 3 Abs. 5 und Art. 6 KlG (SR 814.310); Art. 14 KlV (SR 814.310.1); Art. 55 Abs. 1bis CO2-Verordnung (SR 641.711); geplantes Bundesrahmengesetz zu CCS"},"body":{"en":"Captured CO2 destined for disposal counts as waste. It may be exported for permanent geological storage in an approved European site, which the CO2 Ordinance has credited since 2025, but only with a waste-law export permit and a bilateral agreement; Switzerland signed one with Norway in 2025. There is no permit regime for storing CO2 underground in Switzerland and no law on CO2 pipelines. A framework law is planned to take effect on 1 January 2031. Federal aid for new technologies can cover up to half of eligible costs, and federal and cantonal authorities must make carbon storage available by 2050.","de":"Abgeschiedenes CO2, das entsorgt werden soll, gilt als Abfall. Es darf zur dauerhaften geologischen Speicherung in eine bewilligte europäische Lagerstätte exportiert werden, was die CO2-Verordnung seit 2025 anrechnet, aber nur mit abfallrechtlicher Exportbewilligung und bilateralem Abkommen; mit Norwegen hat die Schweiz 2025 eines unterzeichnet. Für eine Speicherung im Schweizer Untergrund fehlt ein Bewilligungsregime, für CO2-Leitungen ein Gesetz. Ein Rahmengesetz soll am 1. Januar 2031 in Kraft treten. Bundesbeiträge für neuartige Technologien können bis zur Hälfte der anrechenbaren Kosten decken, und Bund und Kantone müssen bis 2050 Kohlenstoffspeicher verfügbar machen."},"work":{"en":"Until storage in Switzerland is lawful, capture at the incinerator can be planned and subsidised but depends on export by rail and ship. Cost sharing with the cantons and regions that send waste has to be negotiated.","de":"Solange die Speicherung in der Schweiz nicht zulässig ist, lässt sich die Abscheidung an der KVA planen und fördern, bleibt aber auf den Export per Bahn und Schiff angewiesen. Die Kostenteilung mit den Kantonen und Regionen, die Abfall liefern, muss ausgehandelt werden."},"sources":["rr-ccs-2025"]},{"title":{"en":"Road noise is an overdue duty","de":"Die Strassenlärmsanierung ist überfällig"},"law":{"en":"Art. 16 USG; Art. 13 and Art. 17 para. 4 lit. b LSV (SR 814.41); Art. 108 SSV (SR 741.21), as amended on 12 August 2026 with effect from 1 October 2026; BGer 1C_318/2024 of 27 March 2026; BGer 1C_513/2022 of 7 July 2023","de":"Art. 16 USG; Art. 13 und Art. 17 Abs. 4 lit. b LSV (SR 814.41); Art. 108 SSV (SR 741.21), geändert am 12. August 2026 mit Wirkung ab 1. Oktober 2026; BGer 1C_318/2024 vom 27. März 2026; BGer 1C_513/2022 vom 7. Juli 2023"},"body":{"en":"The deadline for remediating noise from main and other roads passed on 31 March 2018. On 27 March 2026 the Federal Supreme Court dismissed, insofar as it was admissible, an appeal by the TCS section of both Basel cantons and a resident against Tempo 30 on cantonal roads in Bottmingen, Oberwil and Therwil. It had upheld Tempo 30 on Basel's Feldbergstrasse in 2023. The Basel-Stadt government nevertheless says blanket Tempo 30 would conflict with federal law, and proceeds road by road. Since 1 October 2026, the expert report for Tempo 30 on traffic-oriented roads must also show that the reduction does not cause unwanted diversion into residential areas. The Federal Council's announcement does not say how this applies to procedures already under way.","de":"Die Frist zur Sanierung des Lärms von Haupt- und übrigen Strassen lief am 31. März 2018 ab. Am 27. März 2026 wies das Bundesgericht eine Beschwerde der TCS-Sektion beider Basel und eines Anwohners gegen Tempo 30 auf Kantonsstrassen in Bottmingen, Oberwil und Therwil ab, soweit es darauf eintrat. Bereits 2023 hatte es Tempo 30 auf der Basler Feldbergstrasse bestätigt. Die Basler Regierung hält flächendeckendes Tempo 30 dennoch für bundesrechtswidrig und geht Strasse für Strasse vor. Seit dem 1. Oktober 2026 muss das Gutachten für Tempo 30 auf verkehrsorientierten Strassen zudem zeigen, dass die Temporeduktion keinen «unerwünschten Ausweichverkehr» in Wohnquartiere verursacht. Wie das auf laufende Verfahren anzuwenden ist, sagt die Mitteilung des Bundesrates nicht."},"work":{"en":"Residents along roads above the noise limits can ask the authorities to act. Road users can appeal speed orders, but courts have upheld them where limits are exceeded and the expert report required by Art. 108 SSV is sound.","de":"Anwohnende von Strassen über den Lärmgrenzwerten können von den Behörden Massnahmen verlangen. Verkehrsteilnehmende können Temporeduktionen anfechten, doch Gerichte haben sie bestätigt, wo Grenzwerte überschritten sind und das Gutachten nach Art. 108 SSV trägt."},"sources":["rr-laerm-2018","bger-1c-318-2024","bger-1c-513-2022","bs-mm-tempo30-2026","astra-schilliger-2026","sda-schilliger-2026"]},{"title":{"en":"PFAS across a treaty border","de":"PFAS über eine Vertragsgrenze hinweg"},"law":{"en":"Franco-Swiss treaty on Basel-Mulhouse Airport of 4 July 1949 (SR 0.748.131.934.92), Art. 6; Drinking Water Ordinance TBDV (SR 817.022.11); polluter-pays principle (Art. 2 USG)","de":"Französisch-schweizerischer Staatsvertrag vom 4. Juli 1949 über den Flughafen Basel-Mülhausen (SR 0.748.131.934.92), Art. 6; Trinkwasserverordnung TBDV (SR 817.022.11); Verursacherprinzip (Art. 2 USG)"},"body":{"en":"Elevated PFAS levels are reported in groundwater near the binational airport, which lies on French soil; under Art. 6 of the treaty, French law applies throughout the airport area unless the treaty provides otherwise. Swiss drinking-water law currently sets limits for single PFAS substances. The EU-aligned limit of 100 ng/l for the sum of 20 PFAS is planned but was not in force on 28 September 2026.","de":"Im Grundwasser beim binationalen Flughafen, der auf französischem Boden liegt, werden erhöhte PFAS-Werte gemeldet; nach Art. 6 des Staatsvertrags gilt im ganzen Flughafengebiet französisches Recht, soweit der Vertrag nichts anderes vorsieht. Das Schweizer Trinkwasserrecht kennt heute Höchstwerte für einzelne PFAS. Der an die EU angelehnte Höchstwert von 100 ng/l für die Summe von 20 PFAS ist geplant, war am 28. September 2026 aber nicht in Kraft."},"work":{"en":"Holding a polluter liable for contamination that originates on the airport site raises questions of jurisdiction, applicable law and the airport's treaty status. On 23 September 2026 the Grand Council referred, on first reading, a cantonal initiative asking the federal parliament for a levy on PFAS to fund remediation.","de":"Einen Verursacher für eine Belastung haftbar zu machen, die vom Flughafengelände ausgeht, wirft Fragen der Zuständigkeit, des anwendbaren Rechts und des Status des Flughafens nach dem Staatsvertrag auf. Am 23. September 2026 hat der Grosse Rat eine Standesinitiative erstmals überwiesen, die vom Bundesparlament eine Abgabe auf PFAS zur Finanzierung von Sanierungen verlangt."},"sources":["bl-eap-2024","gruene-bl-pfas-2025","bafu-naqua-pfas","gr-pfas-abgabe-2026"]},{"title":{"en":"Can anyone enforce net zero 2037?","de":"Kann jemand Netto-Null 2037 durchsetzen?"},"law":{"en":"§ 15 para. 2 and § 16a para. 2 Constitution of Basel-Stadt (SG 111.100); ECtHR (Grand Chamber), Verein KlimaSeniorinnen Schweiz and Others v. Switzerland, no. 53600/20, 9 April 2024, § 502","de":"§ 15 Abs. 2 und § 16a Abs. 2 Verfassung des Kantons Basel-Stadt (SG 111.100); EGMR (Grosse Kammer), Verein KlimaSeniorinnen Schweiz u. a. gegen die Schweiz, Nr. 53600/20, 9. April 2024, § 502"},"body":{"en":"§ 16a para. 2 obliges the canton, within its competences, to bring emissions on its territory to net zero in all sectors by 2037; § 15 para. 2 commits it to contribute, within its means, to keeping global warming below 1.5 °C. Both qualifiers weigh against enforceable individual claims. A search of opencaselaw.ch on 28 September 2026 found no decision construing § 16a. The Strasbourg court recognised standing for associations to bring Convention claims against the state; that does not create standing under cantonal law.","de":"§ 16a Abs. 2 verpflichtet den Kanton, «im Rahmen seiner Kompetenzen» dafür zu sorgen, dass die Treibhausgasemissionen auf Kantonsgebiet in allen Sektoren bis 2037 auf Netto-Null sinken; nach § 15 Abs. 2 trägt er «nach seinen Möglichkeiten» dazu bei, dass die Erwärmung 1,5 °C nicht übersteigt. Beide Vorbehalte sprechen gegen durchsetzbare individuelle Ansprüche. Eine Suche auf opencaselaw.ch am 28. September 2026 ergab keinen Entscheid, der § 16a auslegt. Der Strassburger Gerichtshof anerkannte die Beschwerdebefugnis von Verbänden für Konventionsrügen gegen den Staat; eine Legitimation nach kantonalem Recht folgt daraus nicht."},"work":{"en":"The target binds the canton, but it is unclear who could take it to court. Standing, not the substance of the target, is the likely obstacle.","de":"Das Ziel bindet den Kanton, aber es ist offen, wer es vor Gericht bringen könnte. Hürde ist voraussichtlich die Legitimation, nicht der Inhalt des Ziels."},"sources":["kv-bs","egmr-klimaseniorinnen","infras-strategie"]}],"method":{"rubric":[{"grade":"A","meaning":{"en":"Meets health-based benchmarks and legal deadlines; on track.","de":"Erfüllt gesundheitsbasierte Richtwerte und gesetzliche Fristen; auf Kurs."}},{"grade":"B","meaning":{"en":"Broadly compliant with a credible plan; minor gaps.","de":"Weitgehend rechtskonform mit glaubwürdigem Plan; kleinere Lücken."}},{"grade":"C","meaning":{"en":"Targets set, but outcomes lag or depend on unproven measures.","de":"Ziele gesetzt, aber die Ergebnisse hinken nach oder hängen von unerprobten Massnahmen ab."}},{"grade":"D","meaning":{"en":"Material unresolved harm, or legal deadlines missed.","de":"Erhebliche ungelöste Schäden oder verpasste gesetzliche Fristen."}},{"grade":"F","meaning":{"en":"Deteriorating with no credible plan.","de":"Verschlechterung ohne glaubwürdigen Plan."}}],"notes":[{"en":"Letter grades run from A (best) to F.","de":"Buchstabennoten von A (beste) bis F, nicht die Schweizer Schulnoten 1 bis 6."},{"en":"Plus and minus mark the position within a band. The overall grade is a judgment, not an average.","de":"Plus und Minus zeigen die Lage innerhalb einer Stufe. Die Gesamtnote ist eine Einschätzung, kein Durchschnitt."},{"en":"Data years differ: the latest published emissions inventory is from 2022, weather and air data from 2025 and 2026. Each figure shows its source and date.","de":"Die Datenjahre unterscheiden sich: Das neuste veröffentlichte Emissionsinventar stammt von 2022, die Wetter- und Luftdaten von 2025 und 2026. Jede Zahl nennt ihre Quelle und ihr Datum."},{"en":"Sources are classed as official, press, advocacy or reference. Advocacy sources are flagged wherever they carry a figure.","de":"Quellen sind als amtlich, Presse, Interessenvertretung oder Referenz eingestuft. Quellen von Interessenvertretungen sind überall gekennzeichnet, wo sie eine Zahl tragen."},{"en":"No own measurements were taken. Figures derived by calculation are labelled as such; hot days were counted from MeteoSwiss's daily series.","de":"Es wurden keine eigenen Messungen durchgeführt. Berechnete Zahlen sind als solche gekennzeichnet; die Hitzetage wurden aus der täglichen Messreihe von MeteoSchweiz ausgezählt."},{"en":"Recommendations under 'What would raise the grade' are this audit's analysis, not the canton's plans.","de":"Die Empfehlungen unter «Was die Note verbessern würde» sind Analyse dieser Bilanz, nicht Pläne des Kantons."}]},"changelog":[{"date":"2026-09-28","text":{"en":"First public edition, in English and German. Figures and legal references checked against primary sources on 28 September 2026.","de":"Erste öffentliche Ausgabe, auf Englisch und Deutsch. Zahlen und Rechtsgrundlagen am 28. September 2026 an den Primärquellen überprüft."}}],"sources":[{"id":"bs-strategie-2023","type":"official","publisher":"Regierungsrat Basel-Stadt","date":"2023-09-26","title":"Gemeinsam Netto-Null 2037 erreichen: Regierungsrat verabschiedet die kantonale Klimaschutzstrategie","url":"https://www.bs.ch/medienmitteilungen/2023-gemeinsam-netto-null-2037-erreichen-regierungsrat-verabschiedet-die-kantonale-klimaschutzstrategie"},{"id":"bs-strategie-2025","type":"official","publisher":"Regierungsrat Basel-Stadt","date":"2025-08-14","title":"Klimaschutzstrategie, Langfassung (Ausgabe August 2025)","url":"https://media.bs.ch/original_file/81b51881b3601b2d7641aff299881202da3330f2/20250814-klimastrategie-langfassung-bf.pdf"},{"id":"infras-strategie","type":"official","publisher":"Regierungsrat Basel-Stadt (prepared with Infras)","date":"2023-09-26","title":"Klimaschutzstrategie Basel-Stadt, Teil 1 (Bericht an den Grossen Rat)","url":"https://www.infras.ch/media/filer_public/83/94/83948a47-b338-46a4-a71b-41739044341f/3812a_klimaschutzstrategie_basel-stadt.pdf"},{"id":"infras-kurzfassung","type":"official","publisher":"Regierungsrat Basel-Stadt (prepared with Infras)","date":"2023-09-28","title":"Klimaschutzstrategie Basel-Stadt, Kurzfassung","url":"https://www.infras.ch/media/filer_public/7c/9c/7c9c0b02-508f-43f3-8dda-c3941696aa53/3812a_klimastrategie_basel-stadt_kurzfassung.pdf"},{"id":"bs-klimaschutz","type":"official","publisher":"Kanton Basel-Stadt","date":"2025-07","title":"Massnahmen für den Klimaschutz","url":"https://www.bs.ch/schwerpunkte/klima/klimaschutz"},{"id":"bs-mm-klimaportal","type":"official","publisher":"Kanton Basel-Stadt","date":"2025-09-11","title":"Mit einem Klimaportal macht der Kanton die Fortschritte im Klimaschutz transparent","url":"https://www.bs.ch/medienmitteilungen/2025-mit-einem-klimaportal-macht-der-kanton-basel-stadt-die-fortschritte-im-klimaschutz-transparent"},{"id":"rr-ccs-2025","type":"official","publisher":"Regierungsrat Basel-Stadt","date":"2025-09-17","title":"Bericht zum Anzug
