/* ---------- Tokens ---------- */
:root {
  --paper: #F5F6F3;
  --ink: #000000;
  --ink-2: #4A514D;
  --ink-3: #737A76;
  --rule: #C9CEC8;
  --field: #E7EAE5;
  --g1: #6F7672;
  --g2: #9FA5A1;
  --g3: #CDD2CC;
  --rhine: #0B6B64;
  --rhine-wash: #CFE7E1;
  --sulfur: #D9AC00;
  --sulfur-ink: #000000;
  --sulfur-wash: #F4E6AE;
  --fuchsine: #B8155F;
  --fuchsine-wash: #F6D7E5;
  --on-strong: #FFFFFF;

  --font: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --fs-xs: 0.8125rem;
  --fs-s: 0.9375rem;
  --fs-m: 1.0625rem;
  --fs-l: 1.3125rem;
  --fs-xl: 1.75rem;
  --fs-2xl: 2.5rem;
  --fs-thesis: clamp(2.125rem, 5.4vw, 4.75rem);
  --fs-grade: clamp(4.5rem, 11vw, 9rem);

  --gap: clamp(16px, 2.4vw, 32px);
  --pad: clamp(16px, 4vw, 44px);
  --header-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1312; --ink: #F1F3F0; --ink-2: #B4BBB6; --ink-3: #89918C;
    --rule: #2E3633; --field: #1A201E; --g1: #9AA29D; --g2: #6B736E; --g3: #3A423F;
    --rhine: #4DC2B4; --rhine-wash: #103631; --sulfur: #E8C13A; --sulfur-ink: #E8C13A;
    --sulfur-wash: #332B0D; --fuchsine: #F2629F; --fuchsine-wash: #3C1528; --on-strong: #0F1312;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1312; --ink: #F1F3F0; --ink-2: #B4BBB6; --ink-3: #89918C;
  --rule: #2E3633; --field: #1A201E; --g1: #9AA29D; --g2: #6B736E; --g3: #3A423F;
  --rhine: #4DC2B4; --rhine-wash: #103631; --sulfur: #E8C13A; --sulfur-ink: #E8C13A;
  --sulfur-wash: #332B0D; --fuchsine: #F2629F; --fuchsine-wash: #3C1528; --on-strong: #0F1312;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 16px); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: var(--fs-m); line-height: 1.55;
  font-variant-numeric: tabular-nums lining-nums;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--fuchsine); outline-offset: 2px; }
button { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.1; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 1280px; margin-inline: auto; padding-inline: var(--pad); }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--ink); color: var(--paper); padding: 8px 12px; z-index: 100; }
.skip:focus { top: 8px; }
.note { font-size: var(--fs-s); color: var(--ink-2); max-width: 72ch; }

/* Tones */
.tone-good { color: var(--rhine); } .tone-mid { color: var(--sulfur-ink); } .tone-bad { color: var(--fuchsine); }
.bg-ink { background: var(--ink); } .bg-g1 { background: var(--g1); } .bg-g2 { background: var(--g2); } .bg-g3 { background: var(--g3); }
.bg-good { background: var(--rhine); } .bg-mid { background: var(--sulfur); } .bg-bad { background: var(--fuchsine); } .bg-base { background: var(--g2); }

/* ---------- Header ---------- */
.site-head {
  position: sticky; top: 0; z-index: 40; background: var(--paper);
  border-bottom: 3px solid var(--ink); padding-top: env(safe-area-inset-top, 0px);
}
.site-head .wrap { display: flex; align-items: center; gap: 20px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-stretch: 85%; white-space: nowrap; }
.brand-short { display: none; }
@media (max-width: 560px) { .brand-full { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } .brand-short { display: inline; } }
.brand-mark { width: 28px; height: 20px; display: flex; }
.brand-mark span:first-child { flex: 0 0 22%; background: var(--ink); }
.brand-mark span:last-child { flex: 1; background: var(--fuchsine); }
.nav { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); }
.nav ul { padding-right: 40px !important; }
.nav::-webkit-scrollbar { display: none; }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; }
.nav a {
  display: flex; align-items: baseline; gap: 6px; padding: 8px 10px; text-decoration: none;
  font-size: var(--fs-s); white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -3px;
}
.nav a b { font-stretch: 75%; font-weight: 800; }
.nav a[aria-current="true"] { border-bottom-color: var(--ink); }
.head-tools { display: flex; gap: 6px; align-items: center; }
.lang-btn { border: 2px solid var(--ink); padding: 6px 10px; line-height: 1.2; font-size: var(--fs-xs); font-weight: 700; text-decoration: none; letter-spacing: 0.04em; }
.lang-btn:hover { background: var(--ink); color: var(--paper); }
.theme-btn { border: 2px solid var(--ink); background: none; padding: 6px 10px; font-size: var(--fs-xs); font-weight: 600; cursor: pointer; white-space: nowrap; }
@media (max-width: 760px) {
  .site-head .wrap { flex-wrap: wrap; gap: 0 12px; padding-top: 8px; }
  .brand { flex: 1; }
  .nav { order: 3; flex-basis: 100%; margin-inline: calc(var(--pad) * -1); padding-inline: var(--pad); }
}

/* ---------- Hero ---------- */
.hero { padding-block: clamp(40px, 7vw, 96px) clamp(40px, 6vw, 72px); }
:lang(de) .thesis { max-width: 19ch; }
.thesis {
  font-size: var(--fs-thesis); font-weight: 800; font-stretch: 72%;
  line-height: 0.98; letter-spacing: -0.012em; max-width: 17ch;
}
.standfirst { margin-top: 24px; font-size: var(--fs-l); line-height: 1.45; max-width: 58ch; color: var(--ink-2); }

.strip { margin: clamp(36px, 5vw, 56px) 0 0; }
.strip-bar { display: flex; height: clamp(64px, 9vw, 112px); }
.seg { display: flex; align-items: flex-end; padding: 10px 12px; color: var(--on-strong); font-weight: 800; font-stretch: 75%; font-size: clamp(1.25rem, 3vw, 2.25rem); line-height: 1; min-width: 0; }
.strip-bar { position: relative; }
.seg-hot { flex: 0 0 var(--w); background: var(--fuchsine); transform-origin: left center; }
.seg-rest { flex: 0 0 var(--w); background: var(--field); color: var(--ink); justify-content: flex-end; }
.strip-mark { position: absolute; top: -8px; bottom: -8px; width: 0; border-left: 3px solid var(--ink); }
.strip-mk { margin-top: 12px; font-size: var(--fs-s); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.strip-mk i { display: inline-block; width: 3px; height: 14px; background: var(--ink); align-self: center; }
@media (prefers-reduced-motion: no-preference) {
  .js .seg-hot { animation: reveal 1.2s cubic-bezier(.2,.7,.1,1) .35s both; }
  @keyframes reveal { from { transform: scaleX(0); } to { transform: scaleX(1); } }
}
.strip-legend { display: grid; grid-template-columns: var(--w-in) 1fr; gap: 16px; margin-top: 12px; font-size: var(--fs-s); }
.strip-legend > div { padding-right: 12px; }
.strip-legend b { display: block; font-size: var(--fs-m); }
.strip .note { margin-top: 14px; }
@media (max-width: 640px) {
  .strip-legend { grid-template-columns: 1fr; gap: 10px; }
  .strip-legend > div { padding-left: 12px; border-left: 6px solid var(--ink); }
  .strip-legend > div:first-child { border-left-color: var(--fuchsine); }
  .strip-legend > div + div { border-left-color: var(--rule); }
}

.hero-foot { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-top: clamp(40px, 6vw, 72px); align-items: start; }
.overall { grid-column: span 3; }
.overall .grade-big { font-size: var(--fs-grade); font-weight: 900; font-stretch: 62%; line-height: 0.8; letter-spacing: -0.02em; }
.overall h2 { font-size: var(--fs-l); margin-top: 12px; }
.overall p:not(.grade-big) { margin-top: 6px; color: var(--ink-2); font-size: var(--fs-s); max-width: 34ch; }
.facets { grid-column: span 5; list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
.facets li { display: grid; grid-template-columns: 3.25rem 1fr; gap: 12px; align-items: baseline; }
.facets .g { font-size: var(--fs-2xl); font-weight: 900; font-stretch: 62%; line-height: 1; }
.facets h3 { font-size: var(--fs-m); }
.facets p { font-size: var(--fs-s); color: var(--ink-2); margin-top: 2px; }
.meta { grid-column: span 4; background: var(--field); padding: 20px; display: grid; gap: 14px; font-size: var(--fs-s); }
.meta dl { margin: 0; display: grid; gap: 10px; }
.meta dt { color: var(--ink-2); font-size: var(--fs-xs); }
.meta dd { margin: 0; font-weight: 600; }
.meta .stale { color: var(--fuchsine); font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 2px solid var(--ink); background: var(--paper); padding: 8px 12px; font-size: var(--fs-s); font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--ink); color: var(--paper); }
@media (max-width: 1000px) {
  .overall { grid-column: span 12; display: grid; grid-template-columns: auto 1fr; gap: 0 20px; align-items: end; }
  .overall .grade-big { grid-row: span 2; }
  .facets { grid-column: span 12; }
  .meta { grid-column: span 12; }
}

/* ---------- Scoreboard ---------- */
.board { padding-bottom: clamp(48px, 7vw, 88px); }
.board ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--gap); }
.board a { display: block; text-decoration: none; border-top: 10px solid var(--c); padding-top: 12px; height: 100%; }
.board a:hover .nm { text-decoration: underline; text-underline-offset: 0.18em; }
.board .g { font-size: clamp(3rem, 6vw, 4.5rem); font-weight: 900; font-stretch: 62%; line-height: 0.9; color: var(--c-text); }
.board .nm { display: block; font-size: var(--fs-m); margin-top: 8px; }
.board p { font-size: var(--fs-s); color: var(--ink-2); margin-top: 6px; }
.board .t-good { --c: var(--rhine); --c-text: var(--rhine); }
.board .t-mid { --c: var(--sulfur); --c-text: var(--sulfur-ink); }
.board .t-bad { --c: var(--fuchsine); --c-text: var(--fuchsine); }
@media (max-width: 1000px) { .board ol { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 36px; } }
@media (max-width: 560px) { .board ol { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- Area sections ---------- */
.area { border-top: 3px solid var(--ink); padding-block: clamp(48px, 7vw, 96px); }
.area-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px var(--gap); }
.area-head { grid-column: span 3; position: sticky; top: calc(var(--header-h) + 24px); align-self: start; }
.area-body { grid-column: 4 / span 9; min-width: 0; }
.area-head .g { font-size: var(--fs-grade); font-weight: 900; font-stretch: 62%; line-height: 0.8; letter-spacing: -0.02em; }
.area-head h2 { font-size: var(--fs-xl); font-stretch: 85%; margin-top: 16px; max-width: 12ch; }
.subgrades { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 4px; font-size: var(--fs-s); }
.subgrades b { font-stretch: 75%; font-weight: 800; font-size: var(--fs-l); margin-right: 6px; }
@media (max-width: 900px) {
  .area-head { grid-column: span 12; position: static; display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .area-head h2 { margin-top: 0; max-width: none; }
  .area-body { grid-column: span 12; }
}
.verdict { font-size: clamp(1.375rem, 2.4vw, 1.875rem); font-weight: 600; font-stretch: 90%; line-height: 1.25; max-width: 32ch; }

.figures { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px var(--gap); margin: 40px 0 0; }
@media (min-width: 900px) { .figures[data-n="5"], .figures[data-n="6"] { grid-template-columns: repeat(3, 1fr); } }
.fig { border-top: 2px solid var(--ink); padding-top: 10px; }
.fig dt { font-size: clamp(1.75rem, 3vw, 2.25rem); font-weight: 800; font-stretch: 72%; line-height: 1.05; }
.fig dd { margin: 6px 0 0; font-size: var(--fs-s); color: var(--ink-2); line-height: 1.45; }

/* Source citations */
.cites { white-space: nowrap; }
.cite {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.6em; height: 1.45em;
  margin-left: 4px; padding: 0 5px; border: 1px solid var(--ink-3); background: transparent;
  font-size: 0.72rem; font-weight: 700; line-height: 1; vertical-align: 0.15em; cursor: pointer; color: var(--ink);
}
.cite:hover, .cite[aria-expanded="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.cite.is-adv { border-color: var(--fuchsine); color: var(--fuchsine); }
.cite.is-adv:hover, .cite.is-adv[aria-expanded="true"] { background: var(--fuchsine); color: var(--paper); }
.adv-flag { margin-left: 6px; font-size: var(--fs-xs); color: var(--fuchsine); font-weight: 600; white-space: nowrap; }

/* Charts */
.chart { margin: clamp(48px, 6vw, 72px) 0 0; }
.chart h3 { font-size: var(--fs-l); font-stretch: 90%; }
.chart-body { margin-top: 20px; }
.chart > .note { margin-top: 14px; }
.numbers { margin-top: 12px; font-size: var(--fs-s); }
.numbers summary { cursor: pointer; font-weight: 600; width: fit-content; }
.numbers table { border-collapse: collapse; margin-top: 10px; min-width: min(100%, 420px); }
.numbers th, .numbers td { text-align: left; padding: 6px 16px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.numbers td.n, .numbers th.n { text-align: right; }
.numbers .scroll { overflow-x: auto; }

/* Horizontal rows (thresholds, declines, votes, log) */
.rows { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: minmax(150px, 30%) 1fr 5.5rem; gap: 14px; align-items: center; }
.row .lbl { font-size: var(--fs-s); line-height: 1.35; }
.row .val { font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); text-align: right; }
.track { position: relative; height: 22px; background: var(--field); }
.track .bar { position: absolute; inset: 0 auto 0 0; }
.group-label { font-weight: 700; margin: 22px 0 10px; }
.group-label:first-child { margin-top: 0; }
@media (max-width: 640px) {
  .row { grid-template-columns: 1fr 4.5rem; row-gap: 6px; }
  .row .lbl { grid-column: 1 / -1; }
}

/* Stack bars */
.stack { display: flex; height: 56px; }
.stack > div { display: flex; align-items: center; padding-inline: 10px; font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); color: var(--on-strong); overflow: hidden; white-space: nowrap; min-width: 0; }
.stack .bg-g2, .stack .bg-g3 { color: var(--ink); }
.legend { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: var(--fs-s); }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend i { width: 14px; height: 14px; display: inline-block; flex: none; }
.legend b { font-stretch: 85%; }

/* Columns */
.cols { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: clamp(10px, 3vw, 36px); height: 260px; align-items: end; padding-bottom: 0; border-bottom: 2px solid var(--ink); }
.col { position: relative; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.col .v { font-weight: 800; font-stretch: 72%; font-size: var(--fs-2xl); line-height: 1; margin-bottom: 6px; }
.col .b { width: 100%; }
.col-labels { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: clamp(10px, 3vw, 36px); margin-top: 8px; font-size: var(--fs-s); color: var(--ink-2); }
.refline { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--ink); pointer-events: none; }
.refline span { position: absolute; right: 0; top: -1.6em; font-size: var(--fs-xs); background: var(--paper); padding-left: 6px; font-weight: 600; }

/* Dots */
.dotrow { display: grid; grid-template-columns: minmax(160px, 30%) 1fr; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.dotrow .lbl { font-size: var(--fs-s); }
.dotrow .lbl b { display: block; font-size: var(--fs-l); font-stretch: 75%; font-weight: 800; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
@media (max-width: 640px) { .dotrow { grid-template-columns: 1fr; gap: 8px; } }

/* Pathway */
.series svg { display: block; width: 100%; height: auto; overflow: visible; }
.series text { font-family: var(--font); fill: var(--ink-2); font-size: 12px; }
.series .axis { stroke: var(--rule); stroke-width: 1; }
.series .base { stroke: var(--ink); stroke-width: 2; }
.series .line { stroke: var(--ink); stroke-width: 3; fill: none; }
.series .dot { fill: var(--ink); }
.series .line.ln-bad { stroke: var(--fuchsine); } .series .dot.ln-bad { fill: var(--fuchsine); }
.series .line.ln-good { stroke: var(--rhine); } .series .dot.ln-good { fill: var(--rhine); }
.series .line.ln-mid { stroke: var(--sulfur); } .series .dot.ln-mid { fill: var(--sulfur); }
.series .line.ln-g2 { stroke: var(--g2); } .series .dot.ln-g2 { fill: var(--g2); }
.lnkey { display: inline-block; width: 18px; height: 4px; vertical-align: middle; background: var(--ink); }
.lnkey.ln-bad { background: var(--fuchsine); } .lnkey.ln-good { background: var(--rhine); } .lnkey.ln-mid { background: var(--sulfur); } .lnkey.ln-g2 { background: var(--g2); }
.series .val { fill: var(--ink); font-weight: 700; }
.series .ref { stroke: var(--fuchsine); stroke-width: 2; stroke-dasharray: 6 4; }
.series .ref-pt { fill: none; stroke: var(--fuchsine); stroke-width: 2.5; }
.series .ref-t { fill: var(--fuchsine); font-weight: 700; }
.refkey, .refkey-pt { display: inline-block; width: 18px; height: 0; border-top: 2px dashed var(--fuchsine); vertical-align: middle; }
.refkey-pt { width: 12px; height: 12px; border: 2.5px solid var(--fuchsine); border-radius: 50%; }
.pace { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px var(--gap); margin-top: 20px; }
.pace div { border-top: 2px solid var(--ink); padding-top: 8px; }
.pace b { display: block; font-size: var(--fs-2xl); font-weight: 800; font-stretch: 72%; line-height: 1.05; }
.pace span { font-size: var(--fs-s); color: var(--ink-2); }

/* Site sheets */
.sheets { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--gap); }
.sheet { border-top: 8px solid var(--fuchsine); background: var(--field); }
.sheet header { padding: 16px 18px 12px; }
.sheet h4 { margin: 0; font-size: var(--fs-xl); font-stretch: 75%; font-weight: 800; }
.sheet header p { font-size: var(--fs-s); color: var(--ink-2); margin-top: 2px; }
.sheet dl { margin: 0; }
.sheet dl div { display: grid; grid-template-columns: 8.5rem 1fr; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--rule); font-size: var(--fs-s); }
.sheet dt { font-weight: 700; }
.sheet dd { margin: 0; }

.progress { position: relative; height: 56px; background: var(--field); display: flex; }

.overdue { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; }
.overdue b { font-size: var(--fs-2xl); font-weight: 800; font-stretch: 72%; color: var(--fuchsine); line-height: 1; }

.truth { margin-top: clamp(48px, 6vw, 72px); padding-top: 16px; border-top: 8px solid var(--fuchsine); }
.truth h3 { font-size: var(--fs-s); color: var(--fuchsine); font-weight: 700; }
.truth p { margin-top: 10px; font-size: clamp(1.25rem, 2.1vw, 1.625rem); font-weight: 600; font-stretch: 92%; line-height: 1.3; max-width: 44ch; }
.upgrades { margin-top: 40px; }
.upgrades h3 { font-size: var(--fs-l); font-stretch: 90%; }
.upgrades ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 72ch; }
.upgrades li { padding-left: 22px; position: relative; }
.upgrades li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 12px; height: 4px; background: var(--rhine); }
.upgrades .note { margin-top: 12px; }

.block { border-top: 3px solid var(--ink); padding-block: clamp(48px, 7vw, 96px); }
.block-head { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-bottom: 32px; }
.block-head h2 { grid-column: span 5; font-size: clamp(2rem, 4vw, 3.25rem); font-weight: 800; font-stretch: 72%; line-height: 1; }
.block-head p { grid-column: 7 / span 6; font-size: var(--fs-l); color: var(--ink-2); line-height: 1.45; }
@media (max-width: 900px) { .block-head h2, .block-head p { grid-column: span 12; } }

@media (max-width: 640px) { .votes .row { grid-template-columns: 1fr 4.5rem; } }

.tl .when { font-size: var(--fs-xs); color: var(--fuchsine); font-weight: 700; display: block; }

.legal article { border-top: 2px solid var(--ink); padding-top: 12px; }
.legal h3 { font-size: var(--fs-l); font-stretch: 88%; }
.legal .law { font-size: var(--fs-s); color: var(--ink-2); margin-top: 6px; font-style: italic; }
.legal p.body { margin-top: 10px; }
.legal p.work { margin-top: 10px; font-size: var(--fs-s); }

}
.pop[hidden] { display: none; }
.pop .top { display: flex; align-items: center; gap: 12px; }

.pop .n { font-weight: 800; font-stretch: 75%; font-size: var(--fs-l); }

.method-foot { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px var(--gap); margin-top: 48px; }
.method-foot h3 { font-size: var(--fs-l); font-stretch: 88%; margin-bottom: 10px; }

@media print {

  body { font-size: 10.5pt; }

  const NB_DATE = new RegExp(`(\\b\\d{1,2}\\.?) (?=${MONTHS}\\b)`, 'g');

  const whereLabel = (w) => DOMAIN.has(w) ? L(DOMAIN.get(w).short) : UI.nav[w];

  const toneOf = (g) => (g[0] === 'A' || g[0] === 'B') ? 'good' : g[0] === 'C' ? 'mid' : 'bad';
  const gradeLabel = (g) => `${UI.grade} ${g[0]}${g.includes('+') ? ' ' + UI.plus : /[–-]/.test(g) ? ' ' + UI.minus : ''}`;

  function cites(ids) {
    if (!ids || !ids.length) return '';
    let adv = false;
    const btns = ids.map((id) => {
      const s = SRC.get(id); if (!s) return '';
      if (s.type === 'advocacy') adv = true;
      return `<button type="button" class="cite${s.type === 'advocacy' ? ' is-adv' : ''}" data-src="${esc(s.id)}" aria-haspopup="dialog" aria-expanded="false" aria-label="${UI.source} ${s.n}: ${esc(s.publisher)}">${s.n}</button>`;
    }).join('');
    return `<span class="cites">${btns}</span>${adv ? `<span class="adv-flag">${UI.advFlag}</span>` : ''}`;
  }

  /* ---------- Dates ---------- */
  const parseISO = (s) => { const [y, m = 1, d = 1] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const fullDate = (d) => UI.day(d.getDate(), (LANG === 'de' ? UI.monthsLong : UI.months)[d.getMonth()], d.getFullYear());
  function fmtDate(item) {
    if (item.display) return L(item.display);
    const d = parseISO(item.date);
    if (item.precision === 'year') return String(d.getFullYear());
    if (item.precision === 'month') return `${UI.monthsLong[d.getMonth()]} ${d.getFullYear()}`;
    if (item.precision === 'season') return `${UI.summer} ${d.getFullYear()}`;
    return fullDate(d);
  }
  function fmtSourceDate(s) {
    if (!s || s === 'n.d.') return UI.undated;
    const [y, m, d] = s.split('-');
    if (d) return fullDate(new Date(+y, +m - 1, +d));
    if (m) return `${UI.monthsLong[Number(m) - 1]} ${y}`;
    return y;
  }
  function relative(to) {
    const days = Math.round((to - TODAY) / 864e5);
    const a = Math.abs(days);
    if (a < 60) return UI.rel(a, 'd', days >= 0);
    if (a < 730) return UI.rel(Math.round(a / 30.44), 'm', days >= 0);
    return UI.rel(Math.round(a / 365.25), 'y', days >= 0);
  }
  const decimalYear = (d) => d.getFullYear() + (d - new Date(d.getFullYear(), 0, 1)) / (365.25 * 864e5);

  /* ---------- Chart renderers ---------- */
  const table = (head, rows) => `<details class="numbers"><summary>${UI.showNumbers}</summary><div class="scroll"><table><thead><tr>${head.map((h, i) => `<th${i ? ' class="n"' : ''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td${i ? ' class="n"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;

  const R = {};

  // Measured series. Reference values (legal limits, legal targets) are drawn apart from the data and labelled as such.
  const linesOf = (c) => c.lines || [{ points: c.points, tone: 'ink' }];
  const xLabel = (p) => p.label ? L(p.label) : String(p.x);
  R.series = (c, id) => {
    const div = c.axis?.div || 1, dg = c.digits || 0, unit = L(c.axis?.unit || c.unit);
    const v = (y) => fmtN(y / div, dg);
    const lines = linesOf(c);
    const multi = lines.length > 1;
    const aria = lines.map((ln) => `${multi ? L(ln.label) + ': ' : ''}${ln.points.map((p) => `${xLabel(p)} ${v(p.y)}`).join(', ')}`).join('; ') + ` (${unit})`;
    const keys = multi ? lines.map((ln) => `<li><i class="lnkey ln-${ln.tone}" aria-hidden="true"></i><span>${esc(L(ln.label))} ${cites(ln.sources)}</span></li>`).join('') : '';
    const refs = (c.refs || []).map((r) => `<li><i class="${r.kind === 'point' ? 'refkey-pt' : 'refkey'}" aria-hidden="true"></i><span>${esc(L(r.label))} ${cites(r.sources)}</span></li>`).join('');
    const xs = [...new Map(lines.flatMap((ln) => ln.points.map((p) => [p.x, xLabel(p)]))).entries()].sort((a, b) => a[0] - b[0]);
    const head = [UI.period].concat(multi ? lines.map((ln) => L(ln.label)) : [L(c.valueLabel || unit)]);
    const rows = xs.map(([x, lab]) => [esc(lab)].concat(lines.map((ln) => { const p = ln.points.find((q) => q.x === x); return p ? v(p.y) : '–'; })))
      .concat((c.refs || []).map((r) => [esc(L(r.label)), v(r.y)].concat(multi ? Array(lines.length - 1).fill('') : [])));
    return {
      body: `<div class="series" data-series="${esc(id)}" role="img" aria-label="${esc(aria)}"></div>${keys || refs ? `<ul class="legend">${keys}${refs}</ul>` : ''}`,
      table: table(head, rows)
    };
  };

  function drawSeries(el, c) {
    const W = Math.max(300, el.clientWidth);
    const narrow = W < 560;
    const H = narrow ? 240 : 280;
    const m = { l: narrow ? 44 : 56, r: narrow ? 14 : 24, t: 28, b: 30 };
    const div = c.axis?.div || 1, dg = c.digits || 0, unit = L(c.axis?.unit || c.unit);
    const lines = linesOf(c);
    const xs = lines.flatMap((ln) => ln.points.map((p) => p.x)).concat((c.refs || []).filter((r) => r.kind === 'point').map((r) => r.x));
    const x0 = c.xMin ?? Math.min(...xs), x1 = c.xMax ?? Math.max(...xs);
    const X = (x) => m.l + (x - x0) / (x1 - x0 || 1) * (W - m.l - m.r);
    const Y = (y) => m.t + (1 - y / c.yMax) * (H - m.t - m.b);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">`;
    c.yTicks.forEach((t) => {
      s += `<line class="${t ? 'axis' : 'base'}" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/>`;
      s += `<text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${fmtN(t / div)}</text>`;
    });
    s += `<text x="${m.l - 8}" y="${m.t - 14}" text-anchor="end">${esc(unit)}</text>`;
    const ticks = narrow ? (c.xTicksNarrow || c.xTicks) : c.xTicks;
    ticks.forEach((t) => { s += `<text x="${X(t.x ?? t)}" y="${H - m.b + 20}" text-anchor="middle">${esc(t.label ? L(t.label) : t)}</text>`; });
    (c.refs || []).forEach((r) => {
      if (r.kind === 'point') {
        s += `<circle class="ref-pt" cx="${X(r.x)}" cy="${Y(r.y)}" r="6"/>`;
        s += `<text class="ref-t" x="${X(r.x) - 10}" y="${Y(r.y) - 12}" text-anchor="end">${esc(L(r.mark))}</text>`;
      } else {
        s += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${Y(r.y)}" y2="${Y(r.y)}"/>`;
        s += `<text class="ref-t" x="${W - m.r}" y="${Y(r.y) - 6}" text-anchor="end">${esc(L(r.mark))}</text>`;
      }
    });
    lines.forEach((ln) => {
      let d = '';
      ln.points.forEach((p, i) => { d += `${i && !p.break ? 'L' : 'M'}${X(p.x)},${Y(p.y)} `; });
      s += `<path class="line ln-${ln.tone}" d="${d.trim()}"/>`;
      const labelAll = !narrow && lines.length === 1;
      ln.points.forEach((p, i) => {
        const last = i === ln.points.length - 1;
        s += `<circle class="dot ln-${ln.tone}" cx="${X(p.x)}" cy="${Y(p.y)}" r="${narrow ? 3.5 : 4.5}"/>`;
        if (labelAll || i === 0 || last) s += `<text class="val" x="${X(p.x)}" y="${Y(p.y) - 10}" text-anchor="${last && lines.length > 1 ? 'end' : 'middle'}">${fmtN(p.y / div, dg)}</text>`;
      });
    });
    s += '</svg>';
    el.innerHTML = s;
  }

  R.stack = (c) => {
    const total = c.segments.reduce((a, b) => a + b.value, 0);
    const share = (v) => (v / total * 100);
    const isPct = L(c.unit) === '%';
    const fmtV = (v) => isPct ? pct(v) : fmtN(v);
    const bar = c.segments.map((s) => `<div class="bg-${s.tone}" style="flex:0 0 ${share(s.value)}%" title="${esc(L(s.label))}: ${fmtV(s.value)}">${share(s.value) > 9 ? fmtV(s.value) : ''}</div>`).join('');
    const legend = c.segments.map((s) => `<li><i class="bg-${s.tone}" aria-hidden="true"></i><span>${esc(L(s.label))} <b>${fmtV(s.value)}</b></span></li>`).join('');
    const aria = c.segments.map((s) => `${L(s.label)} ${fmtV(s.value)}`).join(', ');
    return {
      body: `<div class="stack" role="img" aria-label="${esc(aria)}">${bar}</div><ul class="legend">${legend}</ul>`,
      table: table([UI.segment, isPct ? UI.share : L(c.unit)], c.segments.map((s) => [esc(L(s.label)), fmtV(s.value)]))
    };
  };

  R.columns = (c) => {
    const max = Math.max(...c.bars.map((b) => b.value));
    const ref = c.bars.find((b) => b.tone === 'base');
    const cols = c.bars.map((b) => `<div class="col"><span class="v">${fmtN(b.value, b.digits || 0)}</span><div class="b bg-${b.tone}" style="height:${b.value / max * 82}%"></div></div>`).join('');
    const refLine = ref ? `<div class="refline" style="bottom:${ref.value / max * 82}%"><span>${esc(L(ref.label))} ${fmtN(ref.value, ref.digits || 0)}</span></div>` : '';
    const labels = c.bars.map((b) => `<div>${esc(L(b.label))} ${cites(b.sources)}</div>`).join('');
    const aria = c.bars.map((b) => `${L(b.label)}: ${b.value} ${L(c.unit)}`).join('; ');
    return {
      body: `<div class="cols" role="img" aria-label="${esc(aria)}">${cols}${refLine}</div><div class="col-labels">${labels}</div>`,
      table: table([UI.period, L(c.valueLabel)], c.bars.map((b) => [esc(L(b.label)), fmtN(b.value, b.digits || 0)]))
    };
  };

  R.dots = (c) => {
    const rows = c.rows.map((r) => {
      const n = Math.round(r.value / c.perDot);
      return `<div class="dotrow"><div class="lbl"><b>${fmtN(r.value)}</b>${esc(L(r.label))} ${cites(r.sources)}</div><div class="dots" role="img" aria-label="${fmtN(r.value)} ${esc(L(c.unit))}">${`<i class="bg-${r.tone}"></i>`.repeat(n)}</div></div>`;
    }).join('');
    return { body: rows, table: table([UI.item, L(c.unit)], c.rows.map((r) => [esc(L(r.label)), fmtN(r.value)])) };
  };

  R.sites = (c) => {
    const sheets = c.sites.map((s) => `<article class="sheet"><header><h4>${esc(L(s.name))}</h4><p>${esc(L(s.place))}</p></header><dl>${s.rows.map((r) => `<div><dt>${esc(L(r.k))}</dt><dd>${esc(L(r.v))} ${cites(r.sources)}</dd></div>`).join('')}</dl></article>`).join('');
    return { body: `<div class="sheets">${sheets}</div>`, table: '' };
  };

  R.thresholds = (c) => {
    const groups = c.groups.map((g) => `<p class="group-label">${esc(L(g.label))}</p><div class="rows">${g.items.map((it) => `<div class="row"><span class="lbl">${esc(L(it.label))} ${cites(it.sources)}</span><span class="track"><span class="bar bg-${it.tone}" style="width:${it.value / c.max * 100}%"></span></span><span class="val">${fmtN(it.value)}</span></div>`).join('')}</div>`).join('');
    const rows = c.groups.flatMap((g) => g.items.map((it) => [`${esc(L(g.label))}: ${esc(L(it.label))}`, `${fmtN(it.value)} ${esc(c.unit)}`]));
    return { body: groups, table: table([UI.measure, UI.value], rows) };
  };

  R.declines = (c) => {
    const f = (v) => `${v < 0 ? '−' : '+'}${pct(Math.abs(v))}`;
    const body = `<div class="rows">${c.items.map((it) => `<div class="row"><span class="lbl">${esc(L(it.label))}</span><span class="track"><span class="bar bg-good" style="width:${Math.abs(it.value)}%"></span></span><span class="val">${f(it.value)}</span></div>`).join('')}</div>`;
    return { body, table: table([UI.pollutant, UI.change1990], c.items.map((it) => [esc(L(it.label)), f(it.value)])) };
  };

  R.log = (c) => {
    const lmin = Math.log10(c.min), lmax = Math.log10(c.max);
    const P = (v) => (Math.log10(v) - lmin) / (lmax - lmin) * 100;
    const bars = c.items.filter((it) => it.tone !== 'base');
    const lines = c.items.filter((it) => it.tone === 'base');
    const marks = lines.map((l) => `<span class="lim" style="left:${P(l.to)}%" aria-hidden="true"></span>`).join('');
    const nf = (v) => fmtN(v, v < 10 && v % 1 ? 1 : 0);
    const val = (it) => it.from ? `${nf(it.from)}–${nf(it.to)}` : `${it.prefix || ''}${nf(it.to)}`;
    const rows = bars.map((it) => {
      const from = it.from ? P(it.from) : 0; const to = P(it.to);
      return `<div class="row"><span class="lbl">${esc(L(it.label))} ${cites(it.sources)}</span><span class="track"><span class="bar bg-${it.tone}" style="left:${from}%;width:${to - from}%"></span>${marks}</span><span class="val">${val(it)}</span></div>`;
    }).join('');
    const ticks = Array.from({ length: lmax - lmin + 1 }, (_, i) => 10 ** (lmin + i)).map((t) => `<span style="left:${P(t)}%">${fmtN(t)}</span>`).join('');
    const axis = `<div class="row" aria-hidden="true"><span class="lbl"></span><span class="logaxis">${ticks}</span><span></span></div>`;
    const legend = `<ul class="legend">${lines.map((l) => `<li><i class="limkey" aria-hidden="true"></i><span>${esc(L(l.label))}: <b>${fmtN(l.to)} ${esc(c.unit)}</b> ${cites(l.sources)}</span></li>`).join('')}</ul>`;
    const aria = c.items.map((it) => `${L(it.label)}: ${it.from ? `${it.from} ${UI.to} ${it.to}` : (it.prefix ? UI.atMost + ' ' : '') + it.to} ${c.unit}`).join('; ');
    const body = `<div role="group" aria-label="${esc(aria)}"><div class="rows">${rows}${axis}</div>${legend}</div>`;
    return { body, table: table([UI.measure, 'PFAS']  , c.items.map((it) => [esc(L(it.label)), `${val(it)} ${esc(c.unit)}`])) };
  };

  R.progress = (c) => {
    const dl = parseISO(c.deadline);
    const months = Math.round((TODAY - dl) / (30.44 * 864e5));
    const y = Math.floor(months / 12), mo = months % 12;
    const body = `<div class="progress" role="img" aria-label="${esc(L(c.nowLabel))}: ${pct(c.now)}"><div class="done" style="width:${c.now}%">${pct(c.now)}</div></div>
      <ul class="legend"><li><i class="bg-ink" aria-hidden="true"></i><span>${esc(L(c.nowLabel))} <b>${pct(c.now)}</b> ${cites(c.nowSources)}</span></li></ul>
      <div class="overdue"><b>${UI.yearsMonths(y, mo)}</b><span>${esc(L(c.deadlineLabel))} ${cites(c.deadlineSources)}</span></div>`;
    return { body, table: table([UI.measure, UI.value], [[esc(L(c.nowLabel)), pct(c.now)], [UI.deadline, fullDate(dl)]]) };
  };

  function chartFigure(id) {
    const c = D.charts[id]; if (!c || !R[c.type]) return '';
    const out = R[c.type](c, id);
    return `<figure class="chart" id="chart-${id}"><figcaption><h3>${esc(L(c.title))}</h3></figcaption><div class="chart-body">${out.body}</div>${c.note ? `<p class="note">${esc(L(c.note))} ${cites(c.sources)}</p>` : ''}${out.table}</figure>`;
  }

  /* ---------- Sections ---------- */
  function hero() {
    const h = D.hero; const o = D.overall; const m = D.meta;
    const reviewed = parseISO(m.reviewed);
    const age = Math.floor((TODAY - reviewed) / 864e5);
    const stale = age > m.reviewIntervalDays;
    const counts = D.sources.reduce((a, s) => (a[s.type] = (a[s.type] || 0) + 1, a), {});
    const next = D.timeline.map((t) => ({ ...t, d: parseISO(t.date) })).filter((t) => t.d >= TODAY).sort((a, b) => a.d - b.d)[0];
    const facets = o.facets.map((f) => `<li><span class="g tone-${toneOf(f.grade)}" aria-label="${gradeLabel(f.grade)}">${esc(f.grade)}</span><div><h3>${esc(L(f.label))}</h3><p>${esc(L(f.note))} ${cites(f.sources)}</p></div></li>`).join('');
    const [hot, rest] = h.segments;
    const w = (x) => (x / h.total * 100).toFixed(2);
    const mk = h.marker;
    const unit = L(h.unit);
    return `<section class="hero wrap" id="overview" aria-labelledby="thesis">
      <p class="kicker">${esc(L(m.kicker))}</p>
      <h1 class="thesis" id="thesis">${esc(L(m.thesis))}</h1>
      <p class="standfirst">${esc(L(m.standfirst))}</p>
      <figure class="strip" style="--w-in:${w(hot.value)}%">
        <div class="strip-bar" role="img" aria-label="${esc(L(h.aria))}">
          <div class="seg seg-hot" style="--w:${w(hot.value)}%">${fmtN(hot.value)}</div>
          <div class="seg seg-rest" style="--w:${w(rest.value)}%">${fmtN(rest.value)}</div>
          ${mk ? `<span class="strip-mark" style="left:${w(mk.value)}%" aria-hidden="true"></span>` : ''}
        </div>
        <div class="strip-legend">
          <div><b>${fmtN(hot.value)} ${esc(unit)}</b>${esc(L(hot.label))} ${cites(hot.sources)}</div>
          <div><b>${fmtN(rest.value)} ${esc(unit)}</b>${esc(L(rest.label))} ${cites(rest.sources)}</div>
        </div>
        ${mk ? `<p class="strip-mk"><i aria-hidden="true"></i><b>${fmtN(mk.value, mk.digits || 0)} ${esc(unit)}</b> ${esc(L(mk.label))} ${cites(mk.sources)}</p>` : ''}
        <figcaption class="note">${esc(L(h.note))}</figcaption>
      </figure>
      <div class="hero-foot">
        <div class="overall">
          <p class="grade-big tone-${toneOf(o.grade)}" aria-label="${UI.overall}: ${gradeLabel(o.grade)}">${esc(o.grade)}</p>
          <h2>${UI.overallGrade}</h2>
          <p>${esc(L(o.summary))}</p>
        </div>
        <ul class="facets">${facets}</ul>
        <div class="meta">
          <dl>
            <div><dt>${UI.lastReviewed}</dt><dd>${fullDate(reviewed)} <span class="${stale ? 'stale' : ''}">(${age <= 0 ? UI.today : UI.daysAgo(age)}${stale ? ', ' + UI.reviewDue : ''})</span></dd></div>
            <div><dt>${UI.sources}</dt><dd>${D.sources.length}: ${UI.typeCounts(counts)}</dd></div>
            ${next ? `<div><dt>${UI.nextDeadline}</dt><dd>${esc(L(next.label))}, ${esc(fmtDate(next))} (${relative(next.d)})</dd></div>` : ''}
          </dl>
          <div class="actions">
            <button class="btn" type="button" data-action="json">${UI.dlData}</button>
            <button class="btn" type="button" data-action="csv">${UI.dlSources}</button>
            <button class="btn" type="button" data-action="print">${UI.print}</button>
          </div>
        </div>
      </div>
    </section>`;
  }

  function board() {
    const first = (s) => { const t = L(s); const i = t.indexOf('. '); return i > 0 ? t.slice(0, i + 1) : t; };
    const items = D.domains.map((d) => `<li><a class="t-${toneOf(d.grade)}" href="#${d.id}"><span class="g" aria-label="${gradeLabel(d.grade)}">${esc(d.grade)}</span><strong class="nm">${esc(L(d.short))}</strong><p>${esc(first(d.verdict))}</p></a></li>`).join('');
    return `<nav class="board wrap" aria-label="${esc(UI.nav.overview)}"><ol>${items}</ol></nav>`;
  }

  function area(d) {
    const t = toneOf(d.grade);
    const sub = d.subgrades ? `<ul class="subgrades">${d.subgrades.map((s) => `<li><b class="tone-${toneOf(s.grade)}">${esc(s.grade)}</b>${esc(L(s.label))}</li>`).join('')}</ul>` : '';
    const figs = d.metrics.map((m) => `<div class="fig"><dt>${esc(L(m.value))}</dt><dd>${esc(L(m.label))} ${cites(m.sources)}</dd></div>`).join('');
    const ups = d.upgrades.map((u) => `<li>${esc(L(u.text))} ${cites(u.sources)}</li>`).join('');
    return `<section class="area" id="${d.id}" aria-labelledby="h-${d.id}"><div class="wrap area-grid">
      <header class="area-head"><p class="g tone-${t}" aria-label="${gradeLabel(d.grade)}">${esc(d.grade)}</p><div><h2 id="h-${d.id}">${esc(L(d.name))}</h2>${sub}</div></header>
      <div class="area-body">
        <p class="verdict">${esc(L(d.verdict))}</p>
        <dl class="figures" data-n="${d.metrics.length}">${figs}</dl>
        ${(d.charts || []).map(chartFigure).join('')}
        <div class="truth"><h3>${UI.truth}</h3><p>${esc(L(d.truth.text))} ${cites(d.truth.sources)}</p></div>
        <div class="upgrades"><h3>${UI.upgrades}</h3><ul>${ups}</ul><p class="note">${UI.upgradesNote}</p></div>
      </div></div></section>`;
  }

  function politics() {
    const p = D.politics;
    const rows = p.votes.map((v) => {
      const pass = v.yes >= 50;
      return `<div class="row"><span class="lbl"><span class="kind">${esc(L(v.kind))}</span>${esc(L(v.label))} ${cites(v.sources)}<small>${esc(fmtDate({ date: v.date }))}${v.note ? `, ${esc(L(v.note))}` : ''}</small></span><span class="track"><span class="bar ${pass ? 'pass' : 'fail'}" style="width:${v.yes}%"></span><span class="half" aria-hidden="true"></span></span><span class="val">${pct(v.yes, 1)}</span></div>`;
    }).join('');
    return `<section class="block" id="voters" aria-labelledby="h-voters"><div class="wrap">
      <div class="block-head"><h2 id="h-voters">${esc(L(p.title))}</h2><p>${esc(L(p.lead))}</p></div>
      <figure class="chart" style="margin-top:0"><figcaption class="visually-hidden">${UI.votesCaption}</figcaption>
        <div class="rows votes">${rows}</div>
        <ul class="legend"><li><i class="bg-ink" aria-hidden="true"></i><span>${UI.passed}</span></li><li><i style="background:repeating-linear-gradient(135deg,var(--g2) 0 3px,transparent 3px 6px);border:1px solid var(--ink)" aria-hidden="true"></i><span>${UI.rejected}</span></li><li><i style="background:var(--fuchsine);width:3px" aria-hidden="true"></i><span>${UI.half}</span></li></ul>
        ${table([UI.vote, UI.yes], p.votes.map((v) => [`${esc(fmtDate({ date: v.date }))}: ${esc(L(v.label))}`, pct(v.yes, 2)]))}
      </figure>
    </div></section>`;
  }

  function deadlines() {
    const items = D.timeline.map((t) => ({ ...t, d: parseISO(t.date) })).sort((a, b) => a.d - b.d);
    const past = items.filter((t) => t.d < TODAY).reverse();
    const ahead = items.filter((t) => t.d >= TODAY);
    const li = (t, showRel) => `<li><time datetime="${esc(t.date)}">${esc(fmtDate(t))}${showRel ? `<span class="when">${relative(t.d)}</span>` : ''}</time><span>${esc(L(t.label))} ${cites(t.sources)}</span></li>`;
    return `<section class="block" id="deadlines" aria-labelledby="h-deadlines"><div class="wrap">
      <div class="block-head"><h2 id="h-deadlines">${UI.deadlinesTitle}</h2><p>${UI.deadlinesLead}</p></div>
      <div class="tl">
        <div class="ahead"><h3>${UI.ahead}</h3><ol>${ahead.map((t) => li(t, true)).join('')}</ol></div>
        <div><h3>${UI.behind}</h3><ol>${past.map((t) => li(t, false)).join('')}</ol></div>
      </div>
    </div></section>`;
  }

  function legal() {
    const arts = D.legal.map((l) => `<article><h3>${esc(L(l.title))}</h3><p class="law">${esc(L(l.law))}</p><p class="body">${esc(L(l.body))} ${cites(l.sources)}</p><p class="work"><b>${UI.inPractice}:</b> ${esc(L(l.work))}</p></article>`).join('');
    return `<section class="block" id="legal" aria-labelledby="h-legal"><div class="wrap">
      <div class="block-head"><h2 id="h-legal">${UI.legalTitle}</h2><p>${UI.legalLead}</p></div>
      <div class="legal">${arts}</div>
    </div></section>`;
  }

  function method() {
    const m = D.method;
    const rub = m.rubric.map((r) => `<div class="t-${toneOf(r.grade)}"><dt>${esc(r.grade)}</dt><dd>${esc(L(r.meaning))}</dd></div>`).join('');
    const log = (D.changelog || []).slice().sort((a, b) => b.date.localeCompare(a.date))
      .map((c) => `<li><time datetime="${esc(c.date)}">${esc(fullDate(parseISO(c.date)))}</time><span>${esc(L(c.text))}</span></li>`).join('');
    const url = LANG === 'de' ? D.meta.siteUrl + 'de/' : D.meta.siteUrl;
    const citeText = `${L(D.meta.author)}, ${L(D.meta.title)} ${D.meta.edition}, ${LANG === 'de' ? 'Stand' : 'reviewed'} ${fullDate(parseISO(D.meta.reviewed))}, ${url}`;
    return `<section class="block" id="method" aria-labelledby="h-method"><div class="wrap">
      <div class="block-head"><h2 id="h-method">${UI.methodTitle}</h2><p>${esc(L(D.meta.scope))}</p></div>
      <dl class="rubric">${rub}</dl>
      <ul class="method-notes">${m.notes.map((n) => `<li>${esc(L(n))}</li>`).join('')}</ul>
      <div class="method-foot">
        <div><h3>${UI.changelog}</h3><ol class="changelog">${log}</ol></div>
        <div><h3>${UI.cite}</h3><p class="cite-text">${esc(citeText)}</p></div>
      </div>
    </div></section>`;
  }

  function sources() {
    const types = ['official', 'press', 'advocacy', 'reference'];
    const counts = types.map((t) => [t, D.sources.filter((s) => s.type === t).length]).filter(([, n]) => n);
    const li = D.sources.map((s) => `<li id="src-${s.n}" data-type="${s.type}" data-text="${esc((s.title + ' ' + s.publisher + ' ' + s.date).toLowerCase())}"><span class="n">${s.n}</span><div><div class="t"><a href="${esc(s.url)}" target="_blank" rel="noopener" hreflang="${esc(s.lang || 'de')}">${esc(s.title)}</a></div><div class="m">${esc(s.publisher)}, ${esc(fmtSourceDate(s.date))}</div>${s.usedIn.size ? `<div class="used">${UI.citedIn}: ${[...s.usedIn].map((w) => esc(whereLabel(w))).join(', ')}</div>` : ''}</div><span class="type ${s.type}">${UI.types[s.type]}</span></li>`).join('');
    return `<section class="block" id="sources" aria-labelledby="h-sources"><div class="wrap">
      <div class="block-head"><h2 id="h-sources">${UI.nav.sources}</h2><p>${UI.sourcesLead}</p></div>
      <div class="src-tools">
        <div class="filters" role="group" aria-label="${UI.nav.sources}"><button type="button" data-filter="all" aria-pressed="true">${UI.all} ${D.sources.length}</button>${counts.map(([t, n]) => `<button type="button" data-filter="${t}" aria-pressed="false">${UI.types[t]} ${n}</button>`).join('')}</div>
        <label class="visually-hidden" for="src-q">${UI.search}</label>
        <input class="src-search" id="src-q" type="search" placeholder="${UI.search}" autocomplete="off">
        <span class="src-status" id="src-status" aria-live="polite"></span>
      </div>
      <ol class="srclist" id="srclist">${li}</ol>
    </div></section>`;
  }

  /* ---------- Render ---------- */
  const app = document.getElementById('app');
  app.innerHTML = hero() + board() + D.domains.map(area).join('') + politics() + deadlines() + legal() + method() + sources();
  const repo = D.meta.repoUrl ? ` <a href="${esc(D.meta.repoUrl)}">GitHub</a>,` : '';
  document.getElementById('foot').innerHTML = `<p>${UI.preparedBy} ${esc(L(D.meta.author))}. ${esc(L(D.meta.disclaimer))}</p><p>${UI.dataLine}:${repo} <a href="${LANG === 'de' ? '../' : ''}data/assessment.json">assessment.json</a>. ${UI.reviewedOn} ${esc(fullDate(parseISO(D.meta.reviewed)))}. ${UI.licence}</p>`;

  const navItems = D.domains.map((d) => [d.id, L(d.short), d.grade]).concat(['voters', 'deadlines', 'legal', 'method', 'sources'].map((k) => [k, UI.nav[k], '']));
  document.getElementById('nav-list').innerHTML = navItems.map(([id, label, g]) => `<li><a href="#${id}" data-nav="${id}">${g ? `<b class="tone-${toneOf(g)}">${esc(g)}</b>` : ''}${esc(label)}</a></li>`).join('');

  /* Series charts draw to the measured width and redraw on resize */
  const drawAll = () => document.querySelectorAll('[data-series]').forEach((el) => drawSeries(el, D.charts[el.dataset.series]));
  drawAll();
  let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(drawAll, 120); });

  /* Header height for sticky offsets */
  const head = document.querySelector('.site-head');
  const setH = () => ROOT.style.setProperty('--header-h', head.offsetHeight + 'px');
  setH(); if ('ResizeObserver' in window) new ResizeObserver(setH).observe(head);

  /* Active nav */
  if ('IntersectionObserver' in window) {
    const links = new Map([...document.querySelectorAll('[data-nav]')].map((a) => [a.dataset.nav, a]));
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          links.forEach((a) => a.removeAttribute('aria-current'));
          const a = links.get(e.target.id);
          if (a) { a.setAttribute('aria-current', 'true'); a.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
        }
      });
    }, { rootMargin: '-40% 0px -55% 0px' });
    navItems.forEach(([id]) => { const el = document.getElementById(id); if (el) io.observe(el); });
  }

  /* ---------- Language switch: keep the reader's place, remember the choice ---------- */
  const langBtn = document.getElementById('lang-btn');
  if (langBtn) langBtn.addEventListener('click', () => {
    try { localStorage.setItem('basel-audit-lang', langBtn.hreflang); } catch (_) { /* storage unavailable */ }
    langBtn.href = langBtn.getAttribute('href').split('#')[0] + location.hash;
  });
  try { if (!localStorage.getItem('basel-audit-lang')) localStorage.setItem('basel-audit-lang', LANG); } catch (_) { /* storage unavailable */ }

  /* ---------- Source popover ---------- */
  const pop = document.getElementById('pop');
  let opener = null;
  function closePop() {
    if (pop.hidden) return;
    pop.hidden = true;
    if (opener) { opener.setAttribute('aria-expanded', 'false'); opener.focus(); opener = null; }
  }
  function openPop(btn) {
    const s = SRC.get(btn.dataset.src); if (!s) return;
    if (opener && opener !== btn) opener.setAttribute('aria-expanded', 'false');
    opener = btn; btn.setAttribute('aria-expanded', 'true');
    pop.innerHTML = `<div class="top"><span class="n">${UI.source} ${s.n}</span><span class="type ${s.type}">${UI.types[s.type]}</span><button class="close" type="button" aria-label="${UI.close}">×</button></div>
      <h4 id="pop-title">${esc(s.title)}</h4><p>${esc(s.publisher)}, ${esc(fmtSourceDate(s.date))}</p>
      <div class="links"><a href="${esc(s.url)}" target="_blank" rel="noopener">${UI.openSource}</a><a href="#src-${s.n}" data-jump>${UI.findInList}</a></div>`;
    pop.hidden = false;
    if (window.matchMedia('(min-width: 641px)').matches) {
      const r = btn.getBoundingClientRect();
      const pw = pop.offsetWidth;
      let left = window.scrollX + r.left - 8;
      left = Math.min(left, window.scrollX + document.documentElement.clientWidth - pw - 12);
      left = Math.max(window.scrollX + 12, left);
      let top = window.scrollY + r.bottom + 10;
      if (r.bottom + pop.offsetHeight + 20 > window.innerHeight) top = window.scrollY + r.top - pop.offsetHeight - 10;
      pop.style.left = left + 'px'; pop.style.top = top + 'px';
    }
    pop.querySelector('.close').focus();
  }
  document.addEventListener('click', (e) => {
    const c = e.target.closest('.cite');
    if (c) { e.preventDefault(); (opener === c && !pop.hidden) ? closePop() : openPop(c); return; }
    if (e.target.closest('.close')) { closePop(); return; }
    if (e.target.closest('[data-jump]')) { const o = opener; pop.hidden = true; if (o) o.setAttribute('aria-expanded', 'false'); opener = null; return; }
    if (!pop.hidden && !e.target.closest('#pop')) closePop();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });

  /* ---------- Source filters ---------- */
  const list = document.getElementById('srclist');
  const q = document.getElementById('src-q');
  const status = document.getElementById('src-status');
  let filter = 'all';
  function applyFilter() {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    list.querySelectorAll('li').forEach((li) => {
      const ok = (filter === 'all' || li.dataset.type === filter) && (!term || li.dataset.text.includes(term));
      li.hidden = !ok; if (ok) shown++;
    });
    status.textContent = shown === D.sources.length ? '' : shown ? UI.showing(shown, D.sources.length) : UI.noMatch;
  }
  document.querySelector('.filters').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    applyFilter();
  });
  q.addEventListener('input', applyFilter);

  /* ---------- Actions ---------- */
  function download(name, type, text) {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const csvCell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]'); if (!b) return;
    if (b.dataset.action === 'json') download(`${UI.file}-${D.meta.reviewed}.json`, 'application/json', RAW);
    if (b.dataset.action === 'csv') {
      const rows = [['n', 'id', 'type', 'publisher', 'date', 'title', 'url', 'cited_in']].concat(D.sources.map((s) => [s.n, s.id, s.type, s.publisher, s.date, s.title, s.url, [...s.usedIn].map(whereLabel).join('; ')]));
      download(`${UI.file}-${LANG === 'de' ? 'quellen' : 'sources'}-${D.meta.reviewed}.csv`, 'text/csv', '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\n'));
    }
    if (b.dataset.action === 'print') window.print();
  });
  let openedForPrint = [];
  window.addEventListener('beforeprint', () => { openedForPrint = [...document.querySelectorAll('details:not([open])')]; openedForPrint.forEach((d) => d.open = true); });
  window.addEventListener('afterprint', () => { openedForPrint.forEach((d) => d.open = false); openedForPrint = []; });

  /* ---------- Theme ---------- */
  const THEMES = ['auto', 'light', 'dark'];
  const tBtn = document.getElementById('theme-btn');
  const setTheme = (t) => {
    ROOT.dataset.theme = t;
    tBtn.textContent = `${UI.theme}: ${UI.themes[t]}`;
    try { localStorage.setItem('basel-audit-theme', t); } catch (_) { /* storage unavailable */ }
  };
  let saved = 'auto';
  try { saved = localStorage.getItem('basel-audit-theme') || 'auto'; } catch (_) { /* storage unavailable */ }
  setTheme(THEMES.includes(saved) ? saved : 'auto');
  tBtn.addEventListener('click', () => setTheme(THEMES[(THEMES.indexOf(ROOT.dataset.theme) + 1) % THEMES.length]));

  /* Deep link to a section after render */
  if (location.hash) { try { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); } catch (_) { /* invalid selector */ } }
})();
</script>
</body>
</html>
